<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon ERP Practice Lab</title>
<style>
:root{
  --blue:#0878e8;--blue2:#0b6fe8;--bg:#f5f6fa;--text:#252525;--muted:#8a8f98;
  --border:#e4e7ec;--white:#fff;--danger:#e5484d;--success:#16a34a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font:inherit}
.topbar{height:58px;background:linear-gradient(90deg,#0875e5,#0870df);color:white;display:flex;align-items:center;padding:0 18px;gap:22px;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:700;min-width:130px}
.nav{display:flex;gap:4px;height:100%;align-items:center}
.nav button{height:100%;border:0;background:transparent;color:white;padding:0 14px;cursor:pointer;font-weight:600}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);border-bottom:3px solid white}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.top-actions button{border:0;border-radius:9px;background:white;color:#1268c9;padding:9px 13px;font-weight:600;cursor:pointer}
.iconbtn{width:36px;height:36px;border-radius:50%!important;padding:0!important}
.layout{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:250px;background:white;border-right:1px solid var(--border);padding:18px 14px;flex-shrink:0}
.content{flex:1;padding:18px 14px;min-width:0}
.page-title{font-size:22px;font-weight:700;margin:0 0 12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.search{background:white;border:1px solid var(--border);border-radius:9px;padding:10px 12px;width:310px;outline:none}
.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn-primary{background:var(--blue);color:white}.btn-secondary{background:white;border:1px solid var(--border)}
.btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd0d0}
.card{background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;background:white}
th,td{padding:13px 12px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
th{font-weight:600;background:#fff;color:#444}
tr:hover td{background:#fafcff}
.empty{text-align:center;padding:90px 20px;color:#777}
.empty .circle{width:56px;height:56px;border-radius:50%;background:#eef6ff;color:#1877df;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
.filter-title{font-weight:700;margin:4px 0 9px}
.filter-group{margin-bottom:18px}
.field{width:100%;border:1px solid #d9dde4;border-radius:8px;background:white;padding:10px 11px;outline:none}
.field:focus{border-color:#5ca4ef;box-shadow:0 0 0 3px rgba(8,120,232,.08)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#eef7ff;color:#3d7daf;border-radius:5px;padding:5px 8px;font-size:12px}
.section-link{display:block;padding:11px 10px;border-radius:7px;color:#333;text-decoration:none;cursor:pointer}
.section-link:hover,.section-link.active{background:#eef5ff;color:#0875e5}
.subhead{font-size:12px;color:#a0a4aa;font-weight:700;margin:17px 10px 7px;text-transform:uppercase}
.columns-panel{position:absolute;right:14px;top:76px;background:white;border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);display:none;width:330px;z-index:20}
.columns-panel.show{display:block}
.columns-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:400}
.check input{accent-color:#0878e8}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30}
.modal{width:min(850px,92vw);max-height:88vh;overflow:auto;background:white;border-radius:12px;padding:20px;box-shadow:0 15px 50px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h2{margin:0;font-size:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.items{width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:12px}
.items th,.items td{padding:9px}
.summary{display:flex;justify-content:flex-end;margin-top:15px}
.summary-box{width:320px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0}
.summary-row.total{font-size:18px;font-weight:700;border-top:1px solid var(--border);padding-top:10px}
.report{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.kpi{background:white;border:1px solid var(--border);border-radius:10px;padding:16px}
.kpi .n{font-size:22px;font-weight:700;margin-top:7px}
.bar{height:13px;background:#e9edf3;border-radius:20px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:#1e88e5}
.mini-stat{margin-top:7px;display:flex;justify-content:space-between;font-size:14px;color:#666}
.dashboard-section{margin-top:15px}
.dashboard-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:15px}
.dashboard-controls{display:flex;gap:8px;flex-wrap:wrap}
.dashboard-note{font-size:12px;color:#8a8f98;margin-top:5px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.chart-card{position:relative;border:1px solid var(--border);border-radius:9px;padding:12px;background:#fff;min-width:0}
.chart-title{font-weight:700;margin-bottom:6px}
.chart-mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.chart-mini-kpis>div{border:1px solid var(--border);border-radius:7px;padding:7px 9px;background:#fafbfc}
.chart-mini-kpis span{display:block;font-size:11px;color:#7b8490}
.chart-mini-kpis b{display:block;margin-top:3px;font-size:14px}

.chart-card canvas{width:100%;height:260px;display:block}
.chart-empty{position:absolute;left:0;right:0;top:46px;height:260px;display:flex;align-items:center;justify-content:center;color:#8a8f98;pointer-events:none}
.pivot-wrap{max-height:520px}
.pivot-table{min-width:1450px}
.pivot-table th{position:sticky;top:0;z-index:1}
.chip-expense{background:#fff0f0;color:#c53b40}
@media(max-width:1100px){.charts-grid{grid-template-columns:1fr}.dashboard-section-head{flex-direction:column}.dashboard-controls{width:100%}.dashboard-controls .field{width:180px!important}}
@media(max-width:900px){.nav button{padding:0 7px}.sidebar{width:205px}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.topbar{overflow:auto}.sidebar{display:none}.content{padding:10px}.form-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#f4f8f6 0%,#fbfcfb 48%,#f1f6f3 100%);display:flex;align-items:center;justify-content:flex-end;padding:42px 7vw;z-index:1000}
.login-panel{width:min(470px,92vw);background:rgba(255,255,255,.96);border:1px solid #e6ece8;border-radius:20px;padding:38px 42px;box-shadow:0 18px 60px rgba(30,70,55,.12)}
.login-brand{text-align:center;margin-bottom:24px}
.login-logo{font-size:30px;font-weight:700;color:#174f4d;letter-spacing:-.6px}
.login-subtitle{margin-top:8px;color:#64748b;font-size:17px}
.login-form{display:flex;flex-direction:column;gap:15px}
.login-label{font-size:13px;font-weight:600;color:#344054;margin-bottom:6px}
.login-input-wrap{position:relative}
.login-input{width:100%;height:52px;border:1px solid #d8e0dc;border-radius:10px;padding:0 44px 0 15px;outline:none;font-size:15px;background:#fff}
.login-input:focus{border-color:#3c9b79;box-shadow:0 0 0 3px rgba(60,155,121,.12)}
.login-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#7a8790;cursor:pointer;font-size:18px}
.login-options{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px;font-size:13px;color:#667085}
.login-remember{display:flex;align-items:center;gap:8px}
.login-remember input{accent-color:#2f8f70;width:16px;height:16px}
.login-link{border:0;background:none;color:#238566;cursor:pointer;padding:0}
.login-button{height:52px;border:0;border-radius:10px;background:linear-gradient(90deg,#2d8b6d,#379879);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 7px 18px rgba(45,139,109,.18)}
.login-button:hover{filter:brightness(.97)}
.login-divider{display:flex;align-items:center;gap:12px;margin:23px 0 18px;color:#98a2b3;font-size:13px}
.login-divider:before,.login-divider:after{content:"";height:1px;background:#e5e7eb;flex:1}
.login-security{text-align:center;color:#98a2b3;font-size:12px}\n.account-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#667085}
\n.login-role{text-align:center;color:#667085;font-size:12px;margin-top:8px}
.admin-note{font-size:12px;color:#667085;margin-top:8px}
.settings-wrap{position:relative}
.settings-menu{position:absolute;right:0;top:44px;width:220px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:8px;display:none;z-index:50}
.settings-menu.show{display:block}
.settings-menu .menu-title{padding:8px 10px 6px;font-size:12px;color:#98a2b3;text-transform:uppercase;font-weight:700}
.settings-menu button{display:block;width:100%;text-align:left;border:0!important;background:#fff!important;color:#252525!important;border-radius:7px!important;padding:10px!important;cursor:pointer}
.settings-menu button:hover{background:#f2f7ff!important;color:#0875e5!important}
.account-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.account-table th,.account-table td{padding:12px}
.status-active{color:#15803d;background:#ecfdf3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:600}
.status-locked{color:#b42318;background:#fef3f2;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:600}

.login-error{display:none;color:#c53b40;background:#fff1f1;border:1px solid #ffd4d4;border-radius:8px;padding:9px 11px;font-size:13px}
.login-error.show{display:block}
@media(max-width:700px){.login-screen{justify-content:center;padding:20px}.login-panel{padding:30px 24px;border-radius:16px}}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-panel">
    <div class="login-brand">
      <div class="login-logo">🌿 Spa POS</div>
      
    </div>
    <form class="login-form" onsubmit="event.preventDefault();login()">
      <div>
        <div class="login-label">Tên đăng nhập</div>
        <input class="login-input" id="loginUsername" autocomplete="username" placeholder="Nhập tên đăng nhập">
      </div>
      <div>
        <div class="login-label">Mật khẩu</div>
        <div class="login-input-wrap">
          <input class="login-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
          <span class="login-icon" onclick="togglePassword()" title="Hiện/ẩn mật khẩu">◉</span>
        </div>
      </div>
      <div class="login-error" id="loginError">Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.</div>
      <div class="login-options">
        <label class="login-remember"><input type="checkbox" id="rememberLogin"> Ghi nhớ đăng nhập</label>
      </div>
      <button class="login-button" type="submit">↪ &nbsp; Đăng nhập</button>
    </form>
  </div>
</div>
<div class="topbar">
  <div class="logo">Salon ERP Lab</div>
  <div class="nav" id="nav"></div>
  <div class="top-actions">
    <button onclick="openInvoice()">🛒 Thu ngân</button>
    <button class="iconbtn" title="Thông báo">🔔</button>
    <button class="iconbtn" title="Trợ giúp">?</button>
    <div class="settings-wrap">
    <button class="iconbtn" title="Cài đặt" onclick="toggleSettingsMenu()">⚙</button>
    <div class="settings-menu" id="settingsMenu">
      <div class="menu-title">Admin</div>
      <button onclick="openAdminAccounts()">Quản lý tài khoản</button>
    </div>
  </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<script>
const state={
  section:'Đơn hàng',
  page:'Hóa đơn',
  invoices:[],
  customers:[
    {code:'KH000001',name:'Khách lẻ',phone:''},
    {code:'KH000002',name:'NGUYỄN THỊ HÀ',phone:''},
    {code:'KH000003',name:'Chú Úy',phone:''}
  ],
  products:[
    {code:'SP000045',name:'Chăm sóc một vùng (Đầu/Cổ vai gáy/Lưng - Cột sống/Chân/Tay) - CTTNT8',type:'Gói dịch vụ, liệu trình',pre:90000,vat:10,price:99000,cost:0,stock:'---'},
    {code:'SP000044',name:'GIFT - Chăm sóc chuyên sâu vùng mặt, cột sống, siết eo',type:'Dịch vụ',pre:0,vat:10,price:0,cost:0,stock:'---'},
    {code:'SP000043',name:'GIFT - Chăm sóc chuyên sâu vùng mặt, kéo dãn cột sống',type:'Dịch vụ',pre:0,vat:10,price:0,cost:0,stock:'---'},
    {code:'SP000042',name:'GIFT - Chăm sóc chuyên sâu vùng mặt',type:'Dịch vụ',pre:0,vat:10,price:0,cost:0,stock:'---'},
    {code:'GDV033',name:'Gói - Thư giãn toàn thân (Buổi - 11B)',type:'Gói dịch vụ, liệu trình',pre:5909091,vat:10,price:6500000,cost:0,stock:'---'},
    {code:'GDV031',name:'Gói - Thư giãn toàn thân (Buổi - TC)',type:'Gói dịch vụ, liệu trình',pre:454545,vat:10,price:500000,cost:0,stock:'---'},
    {code:'GDV032',name:'Gói - Thư giãn toàn thân (Buổi - 4B)',type:'Gói dịch vụ, liệu trình',pre:1818182,vat:10,price:2000000,cost:0,stock:'---'},
    {code:'DV0020',name:'Lẻ - Thư giãn toàn thân (Buổi - TN)',type:'Dịch vụ',pre:227273,vat:10,price:250000,cost:0,stock:'---'},
    {code:'DV0019',name:'Lẻ - Thư giãn toàn thân (Buổi)',type:'Dịch vụ',pre:454545,vat:10,price:500000,cost:0,stock:'---'},
    {code:'GDV018',name:'Gói - Chăm sóc chuyên sâu một vùng (Đầu/Cổ vai gáy/Lưng - Cột sống/Chân/Tay) (Buổi - 11B)',type:'Gói dịch vụ, liệu trình',pre:4545455,vat:10,price:5000000,cost:0,stock:'---'}
  ],
  suppliers:[],
  returns:[],
  imports:[],
  transfers:[],
  damages:[],
  stocktakes:[],
  accounts:[
    {id:'ADMIN001',name:'Quản trị viên',username:'admin',role:'Admin',status:'Hoạt động'}
  ]
};
const STORAGE_KEY='spa_pos_state_v1';
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){console.warn('Không thể lưu dữ liệu',e);}
}
function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved && typeof saved==='object'){
      Object.keys(state).forEach(k=>{if(saved[k]!==undefined)state[k]=saved[k];});
    }
  }catch(e){console.warn('Không thể đọc dữ liệu',e);}
}
loadState();

const menus={
  'Quản trị':['Quản lý tài khoản'],
  'Tổng quan':['Tổng quan'],
  'Hàng hóa':['Danh sách hàng hóa','Thiết lập giá','Hóa đơn đầu vào','Kho hàng','Kiểm kho','Chuyển hàng','Xuất hủy','Nhập hàng','Nhà cung cấp','Nhập hàng','Trả hàng nhập'],
  'Đơn hàng':['Hóa đơn','Trả hàng'],
  'Khách hàng':['Khách hàng'],
  'Sổ quỹ':['Phiếu thu','Phiếu chi'],
  'Phân tích':['Báo cáo nhân viên','Báo cáo doanh thu','Báo cáo hàng hóa'],
  'Thuế & Kế toán':['Tổng hợp','Công nợ phải thu']
};

function togglePassword(){
  const input=document.getElementById('loginPassword');
  input.type=input.type==='password'?'text':'password';
}
function forgotPassword(){
  alert('Vui lòng liên hệ quản trị viên để đặt lại mật khẩu.');
}
function login(){
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value;
  const error=document.getElementById('loginError');
  if(!username||!password){
    error.textContent='Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';
    error.classList.add('show');return;
  }
  const account=state.accounts.find(a=>a.username.toLowerCase()===username.toLowerCase() && a.password===password);
  if(!account){
    error.textContent='Tên đăng nhập hoặc mật khẩu không đúng.';
    error.classList.add('show');return;
  }
  if(account.status!=='Hoạt động'){
    error.textContent='Tài khoản đã bị khóa. Vui lòng liên hệ Admin.';
    error.classList.add('show');return;
  }
  error.classList.remove('show');
  if(document.getElementById('rememberLogin').checked)localStorage.setItem('spa_pos_username',account.username);
  else localStorage.removeItem('spa_pos_username');
  localStorage.setItem('spa_pos_role',account.role);
  localStorage.setItem('spa_pos_user_id',account.id);
  localStorage.setItem('spa_pos_user_name',account.name);
  document.getElementById('loginScreen').style.display='none';
  state.currentUser=account;
  if(account.role==='Admin'){
    state.section='Quản trị';state.page='Quản lý tài khoản';
  }else{
    state.section='Tổng quan';state.page='Tổng quan';
  }
  renderAll();
}
function initLogin(){
  const remembered=localStorage.getItem('spa_pos_username');
  if(remembered){
    document.getElementById('loginUsername').value=remembered;
    document.getElementById('rememberLogin').checked=true;
  }
}
function money(n){return new Intl.NumberFormat('vi-VN').format(n||0)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function peekAutoCode(prefix,width,storageKey,collection,field){
  const nums=(collection||[]).map(x=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return 0;
    const n=Number(raw.slice(prefix.length));
    return Number.isFinite(n)?n:0;
  });
  const stored=Number(localStorage.getItem(storageKey)||0);
  return prefix+String(Math.max(0,...nums,stored)+1).padStart(width,'0');
}
function nextAutoCode(prefix,width,storageKey,collection,field){
  const code=peekAutoCode(prefix,width,storageKey,collection,field);
  localStorage.setItem(storageKey,String(Number(code.slice(prefix.length))));
  return code;
}
function syncAutoCodeCounter(storageKey,prefix,collection,field){
  const max=(collection||[]).reduce((n,x)=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return n;
    const value=Number(raw.slice(prefix.length));
    return Number.isFinite(value)?Math.max(n,value):n;
  },0);
  const stored=Number(localStorage.getItem(storageKey)||0);
  if(max>stored)localStorage.setItem(storageKey,String(max));
}
syncAutoCodeCounter('spa_next_employee_id','NV',state.accounts,'id');
syncAutoCodeCounter('spa_next_invoice_id','HD',state.invoices,'id');
syncAutoCodeCounter('spa_next_customer_id','KH',state.customers,'code');
function renderNav(){
  document.getElementById('nav').innerHTML=Object.keys(menus).map(x=>`<button class="${state.section===x?'active':''}" onclick="selectSection('${x}')">${x}</button>`).join('');
}
function renderSidebar(){
  const list=menus[state.section]||[];
  document.getElementById('sidebar').innerHTML=list.map((x,i)=>{
    if(i===0 && state.section!=='Đơn hàng' && state.section!=='Hàng hóa') return `<div class="section-link ${state.page===x?'active':''}" onclick="selectPage('${x}')">${x}</div>`;
    return `<div class="section-link ${state.page===x?'active':''}" onclick="selectPage('${x}')">${x}</div>`;
  }).join('');
}
function selectSection(s){state.section=s;state.page=menus[s][0];renderAll()}
function selectPage(p){state.page=p;renderAll()}

function renderAll(){saveState();renderNav();renderSidebar();renderPage()}
function renderPage(){
  const c=document.getElementById('content');
  if(state.page==='Hóa đơn') return invoicePage(c);
  if(state.page==='Danh sách hàng hóa') return productPage(c);
  if(state.page==='Thiết lập giá') return pricePage(c);
  if(state.page==='Nhà cung cấp') return supplierPage(c);

  if(state.page==='Tổng quan') return dashboard(c);

}

function getDashboardPeriodRange(period){
  const now=new Date();
  const start=new Date(now);
  const end=new Date(now);
  end.setHours(23,59,59,999);
  start.setHours(0,0,0,0);
  if(period==='yesterday'){
    start.setDate(start.getDate()-1); end.setDate(end.getDate()-1);
  }else if(period==='7days'){
    start.setDate(start.getDate()-6);
  }else if(period==='month'){
    start.setDate(1);
  }else if(period==='lastMonth'){
    start.setMonth(start.getMonth()-1,1); end.setMonth(end.getMonth(),0); end.setHours(23,59,59,999);
  }else if(period==='quarter'){
    start.setMonth(Math.floor(now.getMonth()/3)*3,1);
  }else if(period==='lastQuarter'){
    const q=Math.floor(now.getMonth()/3)-1;
    const year=now.getFullYear()+(q<0?-1:0);
    const normalized=(q+4)%4;
    start.setFullYear(year,normalized*3,1);
    end.setFullYear(year,normalized*3+3,0); end.setHours(23,59,59,999);
  }else if(period==='year'){
    start.setMonth(0,1);
  }
  return {start,end};
}

function dashboardInvoices(period){
  const range=getDashboardPeriodRange(period);
  return state.invoices.filter(x=>{
    const d=x.createdAt?new Date(x.createdAt):new Date();
    return d>=range.start && d<=range.end;
  });
}

function refreshDashboard(){

  const revenue=rows.filter(x=>(x.type||'Thu')==='Thu').reduce((a,x)=>a+Number(x.total||0),0);
  const income=rows.filter(x=>(x.type||'Thu')==='Thu').reduce((a,x)=>a+Number(x.paid||0),0);
  const expense=rows.filter(x=>(x.type||'Thu')==='Chi').reduce((a,x)=>a+Number(x.total||0),0);
  const debt=Math.max(0,revenue-income);
  document.getElementById('dashboardRevenue').innerText=money(revenue)+' ₫';
  const cashRevenue=rows.filter(x=>(x.paymentMethod||'')==='Tiền mặt').reduce((a,x)=>a+Number(x.total||0),0);
  const bankRevenue=rows.filter(x=>(x.paymentMethod||'')==='Ngân hàng').reduce((a,x)=>a+Number(x.total||0),0);
  const ewalletRevenue=rows.filter(x=>(x.paymentMethod||'')==='Ví điện tử').reduce((a,x)=>a+Number(x.total||0),0);
  const otherRevenue=rows.filter(x=>!['Tiền mặt','Ngân hàng','Ví điện tử'].includes(x.paymentMethod)).reduce((a,x)=>a+Number(x.total||0),0);

function getChartBuckets(period,granularity){
  const rows=dashboardInvoices(period), range=getDashboardPeriodRange(period);
  let labels=[],values=[],customers=[];
  if(granularity==='hour'){
    labels=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+'h');
    values=Array(24).fill(0); customers=Array(24).fill(0);
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;values[d.getHours()]+=Number(x.total||0);customers[d.getHours()]+=1;});
  }else if(granularity==='weekday'){
    labels=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
    values=Array(7).fill(0); customers=Array(7).fill(0);
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]+=Number(x.total||0);customers[idx]+=1;});
  }else{
    const cursor=new Date(range.start), end=new Date(range.end), map=new Map();
    while(cursor<=end){
      const key=cursor.toISOString().slice(0,10);
      labels.push(cursor.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}));map.set(key,labels.length-1);
      values.push(0);customers.push(0);cursor.setDate(cursor.getDate()+1);
    }
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=map.get(d.toISOString().slice(0,10));if(idx!==undefined){values[idx]+=Number(x.total||0);customers[idx]+=1;}});
  }
  return {labels,values,customers};
}
function drawChart(canvasId,emptyId,type,data){
  const canvas=document.getElementById(canvasId),empty=document.getElementById(emptyId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,width=canvas.clientWidth||700,height=260;
  canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const hasData=data.values.some(v=>v>0);if(empty)empty.style.display=hasData?'none':'flex';
  const pad={left:58,right:18,top:18,bottom:40},chartW=Math.max(10,width-pad.left-pad.right),chartH=height-pad.top-pad.bottom;
  const max=Math.max(1,...data.values),steps=4;
  ctx.font='12px Arial';ctx.fillStyle='#7b8490';ctx.strokeStyle='#e7ebf0';ctx.lineWidth=1;
  for(let i=0;i<=steps;i++){const y=pad.top+chartH-(chartH*i/steps);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillText(money(Math.round(max*i/steps)),6,y+4);}
  ctx.strokeStyle='#cfd5dd';ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(width-pad.right,pad.top+chartH);ctx.stroke();
  const step=chartW/Math.max(1,data.labels.length),yFor=v=>pad.top+chartH-(v/max)*chartH;
  if(type==='bar'){
    const barW=Math.max(2,step*0.62);data.values.forEach((v,i)=>{const x=pad.left+i*step+(step-barW)/2,y=yFor(v);ctx.fillStyle='#0b78e3';ctx.fillRect(x,y,barW,pad.top+chartH-y);});
  }else{
    ctx.strokeStyle='#0b78e3';ctx.lineWidth=3;ctx.beginPath();
    data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
    ctx.fillStyle='#0b78e3';data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();});
  }
  const labelEvery=data.labels.length>24?Math.ceil(data.labels.length/12):data.labels.length>12?2:1;
  ctx.fillStyle='#68717d';ctx.font='11px Arial';
  data.labels.forEach((label,i)=>{if(i%labelEvery!==0)return;const x=pad.left+i*step+step/2;ctx.save();ctx.translate(x,height-12);ctx.rotate(-0.35);ctx.textAlign='right';ctx.fillText(label,0,0);ctx.restore();});
}

function downloadBlob(content,mime,fileName){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function xmlEscape(value){
  return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function exportPivotExcel(){
  const rows=pivotExportRows();
  const headers=["STT","Chi Nhánh","Thời gian","Mã Hoá đơn","Hoá đơn Thu/Chi","Mã sản phẩm","Tên sản phẩm","Mã Khách hàng","Tên Khách hàng","Tổng tiền"];
  const xmlEscapeXlsx=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const worksheetRows=[
    '<row>'+headers.map(h=>'<c t="inlineStr"><is><t>'+xmlEscapeXlsx(h)+'</t></is></c>').join('')+'</row>',
    ...rows.map(r=>'<row>'+headers.map(h=>{
      const v=r[h];
      return typeof v==='number'
        ? '<c><v>'+v+'</v></c>'
        : '<c t="inlineStr"><is><t>'+xmlEscapeXlsx(v)+'</t></is></c>';
    }).join('')+'</row>')
  ].join('');
  // Generate a minimal XLSX package in the browser.
  const period=document.getElementById('pivotPeriod')?.value||'today';
  const xlsx=buildXlsxBlob(worksheetRows);
  const url=URL.createObjectURL(xlsx);
  const a=document.createElement('a');
  a.href=url;a.download='pivot_'+period+'.xlsx';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function buildXlsxBlob(worksheetRows){
  // Uses the browser's CompressionStream when available to package XLSX parts.
  // Fallback keeps the export dependency-free by using a CSV-compatible .xlsx name only when unavailable.
  const zipParts=[
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Pivot" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml','<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+worksheetRows+'</sheetData></worksheet>']
  ];
  return createStoredZipBlob(zipParts);
}

function createStoredZipBlob(parts){
  // Minimal ZIP writer (stored entries, no compression) for XLSX compatibility.
  const enc=new TextEncoder(), files=parts.map(([name,data])=>({name,data:enc.encode(data)}));
  const chunks=[], central=[]; let offset=0;
  const crcTable=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=buf=>{let c=0xFFFFFFFF;for(const b of buf)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const u16=n=>new Uint8Array([n&255,(n>>>8)&255]),u32=n=>new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);
  const concat=a=>{const len=a.reduce((n,x)=>n+x.length,0),o=new Uint8Array(len);let p=0;for(const x of a){o.set(x,p);p+=x.length;}return o;};
  for(const f of files){
    const nb=enc.encode(f.name),crc=crc32(f.data);
    const local=concat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(f.data.length),u32(f.data.length),u16(nb.length),u16(0),nb,f.data]);
    chunks.push(local);
    central.push(concat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(f.data.length),u32(f.data.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nb]));
    offset+=local.length;
  }
  const cent=concat(central),body=concat(chunks);
  const end=concat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cent.length),u32(body.length),u16(0)]);
  return new Blob([body,cent,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function exportPivotXML(){
  const rows=pivotExportRows();
  const headers=["STT","Chi Nhánh","Thời gian","Mã Hoá đơn","Hoá đơn Thu/Chi","Mã sản phẩm","Tên sản phẩm","Mã Khách hàng","Tên Khách hàng","Tổng tiền"];
  const rowXml=rows.map(r=>'<Row>'+headers.map(h=>{

    return '<Cell><Data ss:Type="'+type+'">'+xmlEscape(value)+'</Data></Cell>';
  }).join('')+'</Row>').join('');
  const xml='<?xml version="1.0" encoding="UTF-8"?>'
    +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
    +'xmlns:o="urn:schemas-microsoft-com:office:office" '
    +'xmlns:x="urn:schemas-microsoft-com:office:excel" '
    +'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    +'<Worksheet ss:Name="Pivot"><Table><Row>'+headers.map(h=>'<Cell><Data ss:Type="String">'+xmlEscape(h)+'</Data></Cell>').join('')+'</Row>'+rowXml+'</Table></Worksheet></Workbook>';
  const period=document.getElementById('pivotPeriod')?.value||'today';
  downloadBlob('\ufeff'+xml,'application/xml;charset=utf-8','pivot_'+period+'.xml');
