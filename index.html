<div class="login-screen" id="loginScreen">
  <section class="login-brand-panel" aria-label="Giới thiệu POS">
    <div class="login-brand-mark">🌿 POS🍀</div>
    <div class="login-brand-slogan">Quản lý spa gọn gàng,<br>vận hành thông suốt.</div>
    <div class="login-brand-copy">Bán hàng, khách hàng, liệu trình, kho, nhân sự và sổ quỹ trong một hệ thống thống nhất.</div>
    <div class="login-brand-points">
      <span class="login-brand-point">🛒 Bán hàng</span>
      <span class="login-brand-point">👥 Khách hàng</span>
      <span class="login-brand-point">📦 Kho</span>
      <span class="login-brand-point">💰 Sổ quỹ</span>
    </div>
  </section>
  <section class="login-form-panel">
    <div class="login-panel">
      <div class="login-brand">
        <div class="login-logo">POS🍀</div>
        <div class="login-subtitle">Đăng nhập để tiếp tục</div>
      </div>
      <form class="login-form" id="loginForm" onsubmit="event.preventDefault();login()">
        <div class="login-field">
          <label class="login-label" for="loginUsername">Tên đăng nhập</label>
          <input class="login-input" id="loginUsername" autocomplete="username" placeholder="Nhập tên đăng nhập" aria-describedby="loginUsernameError">
          <div class="login-field-error" id="loginUsernameError" role="alert"></div>
        </div>
        <div class="login-field">
          <label class="login-label" for="loginPassword">Mật khẩu</label>
          <div class="login-input-wrap">
            <input class="login-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" aria-describedby="loginPasswordError">
            <button type="button" class="login-icon" onclick="togglePassword()" aria-label="Hiện hoặc ẩn mật khẩu" title="Hiện/ẩn mật khẩu">◉</button>
          </div>
          <div class="login-field-error" id="loginPasswordError" role="alert"></div>
        </div>
        <div class="login-error" id="loginError" role="alert"></div>
        <label class="login-remember" style="display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13px;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="rememberLogin" style="width:16px;height:16px;accent-color:var(--primary)">
          Ghi nhớ tên đăng nhập

        <button class="login-button" type="submit">Đăng nhập</button>
      </form>
    </div>

        <button class="logout-btn" onclick="logout()">↪ Đăng xuất</button>
      </div>
    </div>
  </div>

 if(!['thu','chi'].includes(type)||value<=0||!fundIdForPayment(normalizedPaymentMethod)||!normalizedCategory||!subject?.trim()||!note?.trim()||!referenceId?.trim()||!createdBy||!shiftId||!/^\d{4}-\d{2}-\d{2}$/.test(date)){

 }

 const prefix=type==='thu'?'PT':'PC';

 const id=nextAutoCode(prefix,6,key,state.cashbook,'id');

 state.cashbook.push(row);auditCashbook(type==='thu'?'Lập phiếu thu':'Lập phiếu chi',null,row,'Tạo chứng từ');return row;

function validateDiscountApproval(discount, baseAmount, context=''){
 const d=Math.max(0,Number(discount)||0), base=Math.max(0,Number(baseAmount)||0);
 if(d<=0)return true;
 const pct=base>0?(d/base*100):100;
 const limit=discountLimitPercent(state.currentUser?.role);
 if(pct<=limit+0.000001)return true;
 if(state.currentUser?.role==='Admin'||state.currentUser?.permissions?.includes('Phê duyệt giao dịch nhạy cảm'))return true;
 const pin=prompt('Giảm giá '+pct.toFixed(2)+'% vượt mức '+limit+'%. Nhập PIN quản lý để phê duyệt:');
 if(!managerApprovalPinValid(pin)){alert('Giảm giá vượt ngưỡng. PIN quản lý không hợp lệ.');return false;}
 state.approvalLogs=Array.isArray(state.approvalLogs)?state.approvalLogs:[];
 state.approvalLogs.push({id:'APR'+Date.now(),action:'Giảm giá lớn',amount:d,details:context,approvedBy:'PIN quản lý',approvedAt:new Date().toISOString()});
 return true;
}

 if(!sensitive)return true;

 if(state.currentUser?.role==='Admin'||state.currentUser?.permissions?.includes('Phê duyệt giao dịch nhạy cảm'))return true;

async function accountFromSupabaseAuth(authUser, typedUsername){
 const {data:profile,error:profileError}=await supabaseClient
   .from('profiles')
   .select('id,employee_id,full_name,username,role_id,is_active')
   .eq('id',authUser.id)
   .maybeSingle();
 if(profileError)throw new Error('Không đọc được hồ sơ profiles: '+profileError.message);
 if(!profile)throw new Error('Tài khoản đã xác thực nhưng chưa có hồ sơ trong profiles.');
 if(profile.is_active!==true)throw new Error('Tài khoản đã bị khóa. Vui lòng liên hệ quản trị viên.');
 let roleName='';
 const {data:roleData,error:roleError}=await supabaseClient
   .from('roles')
   .select('name')
   .eq('id',profile.role_id)
   .maybeSingle();
 if(!roleError&&roleData)roleName=roleData.name||'';
 const role=backendRoleName(profile.role_id,roleName);
 const account={
   id:profile.id,
   authUserId:authUser.id,
   employeeId:profile.employee_id,
   name:profile.full_name||profile.username||typedUsername,
   username:profile.username||typedUsername,
   role,
   roleId:profile.role_id,
   status:'Hoạt động',
   permissions:defaultPermissions(role),
   isSupabaseAuth:true
 };
 const idx=state.accounts.findIndex(a=>String(a.id)===String(account.id));
 if(idx>=0)state.accounts[idx]={...state.accounts[idx],...account};
 else state.accounts.push(account);
 return account;
}
async function login(){
 clearLoginErrors();
 const username=(document.getElementById('loginUsername')?.value||'').trim();
 const password=document.getElementById('loginPassword')?.value||'';
 const rememberLogin=document.getElementById('rememberLogin');
 if(rememberLogin?.checked&&username)localStorage.setItem('spa_pos_remember_username',username);
 else localStorage.removeItem('spa_pos_remember_username');
 if(!username){
   showLoginFieldError('loginUsername','loginUsernameError','Vui lòng nhập tên đăng nhập.');
   return;
 }
 if(!password){
   showLoginFieldError('loginPassword','loginPasswordError','Vui lòng nhập mật khẩu.');
   return;
 }
 const submit=document.querySelector('#loginForm button[type="submit"]');
 if(submit){submit.disabled=true;submit.textContent='Đang xác thực...';}
 try{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email:username,password});
   if(!error&&data?.user){
     try{
       const account=await accountFromSupabaseAuth(data.user,username);
       activateLoggedInUser(account);
       return;
     }catch(profileError){
       await supabaseClient.auth.signOut();
       showLoginFieldError('loginUsername','loginUsernameError',profileError.message||'Không thể tải hồ sơ người dùng.');
       return;
     }
   }
   const demoAdmin=state.accounts.find(a=>a.isDemo&&String(a.username||'').toLowerCase()==='admin');
   if(username.toLowerCase()==='admin'&&demoAdmin&&demoAdmin.password===password){
     activateLoggedInUser(demoAdmin);
     return;
   }
   showLoginFieldError('loginPassword','loginPasswordError','Tên đăng nhập hoặc mật khẩu không đúng.');
 }catch(e){
   showLoginFieldError('loginPassword','loginPasswordError','Không thể kết nối dịch vụ đăng nhập. Vui lòng thử lại.');
   console.error('Supabase login error:',e);
 }finally{
   if(submit){submit.disabled=false;submit.textContent='Đăng nhập';}
 }
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}

function peekAutoCode(prefix,width,storageKey,collection,field){
  const nums=(collection||[]).map(x=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return 0;
    const n=Number(raw.slice(prefix.length));
    return Number.isFinite(n)?n:0;
  });
  const stored=Number(localStorage.getItem(storageKey)||0);
  return prefix+String(Math.max(0,...nums,stored)+1).padStart(width,'0');
}
function nextAutoCode(prefix,width,storageKey,collection,field){
  const code=peekAutoCode(prefix,width,storageKey,collection,field);
  localStorage.setItem(storageKey,String(Number(code.slice(prefix.length))));
  return code;
}
function syncAutoCodeCounter(storageKey,prefix,collection,field){
  const max=(collection||[]).reduce((n,x)=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return n;
    const value=Number(raw.slice(prefix.length));
    return Number.isFinite(value)?Math.max(n,value):n;
  },0);
  const stored=Number(localStorage.getItem(storageKey)||0);
  if(max>stored)localStorage.setItem(storageKey,String(max));
}

function getPackageSessions(product){
 const explicit=Number(product?.sessions||product?.totalSessions||product?.sessionCount);
 return Number.isInteger(explicit)&&explicit>0?explicit:1;
}
function getPackageValidDays(product){
 const n=Number(product?.validDays);
 return Number.isFinite(n)&&n>0?n:0;
}
function getPackageSessionValue(product){
 const v=Number(product?.sessionValue);
 if(Number.isFinite(v)&&v>=0)return v;
 const sessions=getPackageSessions(product);
 return sessions>0?Number(product?.pre||product?.price||0)/sessions:0;
}
function packageExpiryDate(product,fromDate=new Date()){
 const days=getPackageValidDays(product);if(!days)return '';
 const d=new Date(fromDate);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);
}
function findCommissionRate(productCode){
 const r=(state.commissionRules||[]).find(x=>x.productCode===productCode);
 return Math.max(0,Number(r?.rate)||0);
}
function materialRulesForService(serviceCode){return (state.serviceMaterials||[]).filter(x=>x.serviceCode===serviceCode);}
function materialStockCheck(serviceCode,multiplier=1){
 for(const r of materialRulesForService(serviceCode)){
   const m=(state.materials||[]).find(x=>x.code===r.materialCode);
   if(m&&Number(m.stock||0)<Number(r.quantity)*multiplier)return {ok:false,material:m,required:Number(r.quantity)*multiplier};
 }
 return {ok:true};
}
function restoreMaterialUsage(referenceId){
 (state.materialMovements||[]).filter(x=>x.referenceId===referenceId&&!x.reversed).forEach(mv=>{
   const m=(state.materials||[]).find(x=>x.code===mv.materialCode);
   if(m)m.stock=Number(m.stock||0)-Number(mv.quantity||0);
   mv.reversed=true;
 });
}

function openShift(){
 if(!hasPermission('Mở ca'))return alert('Bạn không có quyền mở ca.');
 state.shifts=Array.isArray(state.shifts)?state.shifts:[];const today=localDateKey(new Date());
 if(state.shifts.some(x=>x.date===today&&x.status==='Đang mở'))return alert('Đã có ca đang mở hôm nay.');
 const prev=([...state.shifts].filter(x=>x.status==='Đã chốt'&&x.actualCash!==undefined).sort((a,b)=>new Date(b.closedAt||0)-new Date(a.closedAt||0))[0]); const inherited=prev?Number(prev.actualCash||0):0;
 openModal('Mở ca','<div class="form-grid"><div><label>Tiền đầu ca</label><input id="openingCash" class="field" type="number" min="0" placeholder="'+money(inherited)+'" value="'+inherited+'"><small>Đầu ca mặc định kế thừa tiền thực tế cuối ca trước: '+money(inherited)+' ₫</small></div><div class="full"><label>Lý do nếu sửa đầu ca</label><textarea id="shiftNote" class="field"></textarea></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveOpenShift()">Mở ca</button>');
}
function saveOpenShift(){
 if(!hasPermission('Mở ca'))return alert('Bạn không có quyền mở ca.');
 state.shifts=Array.isArray(state.shifts)?state.shifts:[];
 const prev=[...state.shifts].filter(x=>x.status==='Đã chốt'&&x.actualCash!==undefined).sort((a,b)=>new Date(b.closedAt||0)-new Date(a.closedAt||0))[0];
 const inherited=prev?Number(prev.actualCash||0):0;
 const raw=document.getElementById('openingCash').value.trim();
 const amount=raw===''?inherited:Number(raw);
 if(!Number.isFinite(amount)||amount<0)return alert('Tiền đầu ca không hợp lệ.');
 const note=document.getElementById('shiftNote').value.trim();
 const manual=raw!==''&&amount!==inherited;
 if(manual&&!note)return alert('Sửa tiền đầu ca phải nhập lý do.');
 if(manual&&!hasPermission('Phê duyệt'))return alert('Sửa tiền đầu ca phải được phê duyệt.');
 const today=localDateKey(new Date());
 state.shifts.push({id:nextAutoCode('CA',6,'spa_next_shift_id',state.shifts,'id'),date:today,openedAt:new Date().toISOString(),openedBy:state.currentUser?.id||'',openedByName:state.currentUser?.name||state.currentUser?.username||'',openingCash:amount,inheritedOpeningCash:inherited,openingCashOverride:manual,openingCashReason:manual?note:'',openingCashApprovedBy:manual?(state.currentUser?.id||''):'',status:'Đang mở',note,totalIncome:0,totalExpense:0});
 auditCashbook('Mở ca',null,{openingCash:amount,inheritedOpeningCash:inherited,openingCashOverride:manual},manual?note:'Kế thừa cuối ca trước'); saveState();closeModal();shiftClosePage(document.getElementById('content'));alert('Đã mở ca. Tiền đầu ca: '+money(amount)+' ₫.');
}
function cashbookPeriodRange(mode,from,to){
 const now=new Date(), today=localDateKey(now);
 if(mode==='day'){const d=from||today;return [d,d];}
 if(mode==='month'){const d=from||today;const p=d.slice(0,7);return [p+'-01',new Date(Number(p.slice(0,4)),Number(p.slice(5,7)),0).toISOString().slice(0,10)];}
 if(mode==='quarter'){const d=from||today,y=Number(d.slice(0,4)),m=Number(d.slice(5,7)),q=Math.floor((m-1)/3)*3+1;return [`${y}-${String(q).padStart(2,'0')}-01`,new Date(y,q+2,0).toISOString().slice(0,10)];}
 return [from||'0000-01-01',to||today];
}
function cashbookSummaryPage(c){
 if(!hasPermission('Xem quỹ')){c.innerHTML='<div class="empty">Bạn không có quyền xem quỹ.</div>';return;}
 const mode=state.cashbookSummaryMode||'month', today=localDateKey(new Date()), from=state.cashbookSummaryFrom||today,to=state.cashbookSummaryTo||today;
 const [rangeStart,rangeEnd]=cashbookPeriodRange(mode,from,to);
 const funds=(state.funds||[]).filter(f=>f.active!==false);
 const rows=funds.map(f=>{
   const opening=fundOpening(f)+((state.cashbook||[]).filter(x=>x.fundId===f.id&&String(x.txnDate||'')>=fundOpeningDate(f)&&String(x.txnDate||'')<rangeStart).reduce((s,x)=>s+(x.type==='thu'?1:-1)*Number(x.amount||0),0));
   const tx=(state.cashbook||[]).filter(x=>x.fundId===f.id&&String(x.txnDate||'')>=rangeStart&&String(x.txnDate||'')<=rangeEnd);
   const thu=tx.filter(x=>x.type==='thu'&&x.category!=='Chuyển quỹ').reduce((s,x)=>s+Number(x.amount||0),0);
   const chi=tx.filter(x=>x.type==='chi'&&x.category!=='Chuyển quỹ').reduce((s,x)=>s+Number(x.amount||0),0);
   const netInternal=tx.reduce((s,x)=>s+(x.type==='thu'?1:-1)*(x.category==='Chuyển quỹ'?Number(x.amount||0):0),0);
   const end=fundBalance(f.id);
   const endInPeriod=opening+thu-chi+netInternal;
   return {f,opening,thu,chi,end:endInPeriod};
 });
 const total=rows.reduce((a,r)=>({opening:a.opening+r.opening,thu:a.thu+r.thu,chi:a.chi+r.chi,end:a.end+r.end}),{opening:0,thu:0,chi:0,end:0});
 const trs=rows.map(r=>`<tr><td>${esc(r.f.name)}</td><td style="text-align:right">${money(r.opening)} ₫</td><td style="text-align:right">${money(r.thu)} ₫</td><td style="text-align:right">${money(r.chi)} ₫</td><td style="text-align:right">${money(r.end)} ₫</td></tr>`).join('');
 c.innerHTML=`<div class="page-title">Báo cáo tổng hợp các quỹ</div><div class="card report"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><label>Kỳ<select class="field" onchange="state.cashbookSummaryMode=this.value;cashbookSummaryPage(document.getElementById('content'))"><option value="day" ${mode==='day'?'selected':''}>Ngày</option><option value="month" ${mode==='month'?'selected':''}>Tháng</option><option value="quarter" ${mode==='quarter'?'selected':''}>Quý</option><option value="custom" ${mode==='custom'?'selected':''}>Tùy chọn</option></select></label><label>Từ ngày<input class="field" type="date" value="${esc(from)}" onchange="state.cashbookSummaryFrom=this.value;cashbookSummaryPage(document.getElementById('content'))"></label><label>Đến ngày<input class="field" type="date" value="${esc(to)}" onchange="state.cashbookSummaryTo=this.value;cashbookSummaryPage(document.getElementById('content'))"></label></div><p class="dashboard-note">Kỳ: ${rangeStart} → ${rangeEnd}. Chuyển quỹ nội bộ không được tính vào tổng thu/chi toàn bộ.</p><table><thead><tr><th>Quỹ</th><th>Đầu kỳ</th><th>Tổng thu</th><th>Tổng chi</th><th>Cuối kỳ</th></tr></thead><tbody>${trs}<tr><th>TỔNG CỘNG</th><th style="text-align:right">${money(total.opening)} ₫</th><th style="text-align:right">${money(total.thu)} ₫</th><th style="text-align:right">${money(total.chi)} ₫</th><th style="text-align:right">${money(total.end)} ₫</th></tr></tbody></table></div>`;
}
function cashbookCategoryReportPage(c){
 if(!hasPermission('Xem quỹ')){c.innerHTML='<div class="empty">Bạn không có quyền xem quỹ.</div>';return;}
 const mode=state.cashbookCatMode||'month',today=localDateKey(new Date()),from=state.cashbookCatFrom||today,to=state.cashbookCatTo||today;
 const [rangeStart,rangeEnd]=cashbookPeriodRange(mode,from,to), cats=CASH_CATEGORIES.filter(x=>x!=='Chuyển quỹ');
 const tx=(state.cashbook||[]).filter(x=>String(x.txnDate||'')>=rangeStart&&String(x.txnDate||'')<=rangeEnd&&x.category!=='Chuyển quỹ');
 const funds=(state.funds||[]).filter(f=>f.active!==false);
 const catsRows=cats.map(cat=>{const vals=funds.map(f=>tx.filter(x=>x.fundId===f.id&&x.category===cat).reduce((s,x)=>s+(x.type==='thu'?1:-1)*Number(x.amount||0),0));return {cat,vals,total:vals.reduce((s,v)=>s+v,0)}});
 const fundRows=funds.map((f,i)=>({f,total:catsRows.reduce((s,r)=>s+r.vals[i],0)}));
 const detail=(title,items)=>items.length?items.map(x=>`<tr><td>${esc(x.txnDate||'')}</td><td>${esc(x.id)}</td><td>${esc(x.category||'')}</td><td>${esc(fundById(x.fundId)?.name||'—')}</td><td>${money(x.amount||0)} ₫</td><td>${esc(x.note||x.subject||'')}</td></tr>`).join(''):'<tr><td colspan="6">Không có phiếu.</td></tr>';
 const trs=catsRows.map(r=>`<tr><td>${esc(r.cat)}</td>${r.vals.map((v,i)=>`<td style="text-align:right"><button class="btn btn-link" onclick="showCashbookCategoryDrill(${JSON.stringify(r.cat)},${JSON.stringify(funds[i]?.id||'')},${JSON.stringify(rangeStart)},${JSON.stringify(rangeEnd)})">${money(v)} ₫</button></td>`).join('')}<td style="text-align:right">${money(r.total)} ₫</td></tr>`).join('');
 const net=catsRows.reduce((s,r)=>s+r.total,0), fundCells=fundRows.map(r=>`<td style="text-align:right">${money(r.total)} ₫</td>`).join('');
 c.innerHTML=`<div class="page-title">Tổng hợp thu chi theo category</div><div class="card report"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><label>Kỳ<select class="field" onchange="state.cashbookCatMode=this.value;cashbookCategoryReportPage(document.getElementById('content'))"><option value="day" ${mode==='day'?'selected':''}>Ngày</option><option value="month" ${mode==='month'?'selected':''}>Tháng</option><option value="quarter" ${mode==='quarter'?'selected':''}>Quý</option><option value="custom" ${mode==='custom'?'selected':''}>Tùy chọn</option></select></label><label>Từ ngày<input class="field" type="date" value="${esc(from)}" onchange="state.cashbookCatFrom=this.value;cashbookCategoryReportPage(document.getElementById('content'))"></label><label>Đến ngày<input class="field" type="date" value="${esc(to)}" onchange="state.cashbookCatTo=this.value;cashbookCategoryReportPage(document.getElementById('content'))"></label></div><p class="dashboard-note">Kỳ: ${rangeStart} → ${rangeEnd}. Chuyển quỹ nội bộ được loại trừ.</p><table><thead><tr><th>Category</th>${funds.map(f=>`<th>${esc(f.name)}</th>`).join('')}<th>Tổng</th></tr></thead><tbody>${trs}<tr><th>Dòng tiền thuần</th>${fundCells}<th style="text-align:right">${money(net)} ₫</th></tr></tbody></table></div><div id="cashbookCatDrill" class="card report" style="margin-top:15px;display:none"></div>`;
}
function showCashbookCategoryDrill(category,fundId,from,to){
 const rows=(state.cashbook||[]).filter(x=>x.category===category&&x.fundId===fundId&&String(x.txnDate||'')>=from&&String(x.txnDate||'')<=to);
 const box=document.getElementById('cashbookCatDrill');if(!box)return;box.style.display='block';box.innerHTML=`<h3>Phiếu cấu thành — ${esc(category)}</h3><table><thead><tr><th>Ngày</th><th>Số chứng từ</th><th>Category</th><th>Quỹ</th><th>Số tiền</th><th>Diễn giải</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.txnDate||'')}</td><td>${esc(x.id)}</td><td>${esc(x.category||'')}</td><td>${esc(fundById(x.fundId)?.name||'—')}</td><td>${money(x.amount||0)} ₫</td><td>${esc(x.note||x.subject||'')}</td></tr>`).join(''):'<tr><td colspan="6">Không có phiếu.</td></tr>'}</tbody></table>`;
}
function getCashbookReportData(){
 const fundId=state.cashbookDetailFundId||state.funds?.find(f=>f.active!==false)?.id||'';
 const mode=state.cashbookDetailMode||'month', today=localDateKey(new Date()), from=state.cashbookDetailFrom||today,to=state.cashbookDetailTo||today;
 const [rangeStart,rangeEnd]=cashbookPeriodRange(mode,from,to), f=fundById(fundId);
 if(!f)return null;
 const opening=fundOpening(f)+((state.cashbook||[]).filter(x=>x.fundId===fundId&&String(x.txnDate||'')>=fundOpeningDate(f)&&String(x.txnDate||'')<rangeStart).reduce((sum,x)=>sum+(x.type==='thu'?1:-1)*Number(x.amount||0),0));
 const rows=(state.cashbook||[]).filter(x=>x.fundId===fundId&&String(x.txnDate||'')>=rangeStart&&String(x.txnDate||'')<=rangeEnd).sort((a,b)=>String(a.txnDate||'').localeCompare(String(b.txnDate||''))||String(a.id).localeCompare(String(b.id)));
 let running=opening,totalThu=0,totalChi=0;
 const detail=rows.map(x=>{const thu=x.type==='thu'?Number(x.amount||0):0,chi=x.type==='chi'?Number(x.amount||0):0;totalThu+=thu;totalChi+=chi;running+=thu-chi;return {date:x.txnDate||'',receipt:x.type==='thu'?x.id:'',payment:x.type==='chi'?x.id:'',note:x.note||x.subject||'',thu,chi,balance:running};});
 return {fund:f,rangeStart,rangeEnd,opening,totalThu,totalChi,endBalance:opening+totalThu-totalChi,rows:detail,createdAt:localDateKey(new Date()),createdBy:state.currentUser?.name||state.currentUser?.username||'Người lập'};
}

function exportCashbookExcel(){
 if(!hasPermission('Xuất Excel'))return alert('Bạn không có quyền xuất báo cáo.');
 const d=getCashbookReportData();if(!d)return alert('Chưa có quỹ để xuất sổ.');

function openCloseShift(){

 const cashIncome=cash.filter(x=>x.type==='thu'&&normalizePaymentMethod(x.paymentMethod||'Tiền mặt')==='Tiền mặt').reduce((a,x)=>a+Number(x.amount||0),0);
 const cashExpense=cash.filter(x=>x.type==='chi'&&normalizePaymentMethod(x.paymentMethod||'Tiền mặt')==='Tiền mặt').reduce((a,x)=>a+Number(x.amount||0),0);

function recalcDenomTotal(){

 return total;
}

 products.filter(p=>p.type!=='Dịch vụ'&&p.type!=='Gói dịch vụ, liệu trình').forEach(p=>{const code=p.code||p.id; const qtyIn=(state.imports||[]).filter(x=>x.status!=='Đã hủy'&&x.productCode===code).reduce((a,x)=>a+Number(x.quantity||0),0); const qtySold=valid.reduce((a,x)=>a+(x.items||[]).filter(i=>(i.code||i.productCode||i.productId)===code).reduce((q,i)=>q+Number(i.qty||i.quantity||0),0),0); const qtyRet=returns.filter(r=>r.status!=='Đã hủy'&&valid.some(inv=>inv.id===r.invoiceId)).reduce((a,x)=>a+(x.items||[]).filter(i=>(i.code||i.productCode||i.productId)===code).reduce((q,i)=>q+Number(i.qty||i.quantity||0),0),0); const expected=qtyIn-qtySold+qtyRet; const actual=Number(p.stock||0); if(Math.abs(expected-actual)>.001){stockDiff++;stockDetails.push({id:code,ref:code,message:'Tồn kỳ vọng '+expected+', tồn hệ thống '+actual+' (nhập '+qtyIn+' − bán '+qtySold+' + trả '+qtyRet+').' });}});

function runDataChecks(){
 const books=Array.isArray(state.cashbook)?state.cashbook:[];
 const invoices=Array.isArray(state.invoices)?state.invoices:[];
 const returns=Array.isArray(state.returns)?state.returns:[];
 const details=[];
 const validInvoices=invoices.filter(inv=>inv.status!=='Đã hủy'&&inv.status!=='Hủy');
 const returnByInvoice=new Map();
 returns.filter(r=>r.status!=='Đã hủy').forEach(r=>returnByInvoice.set(r.invoiceId,(returnByInvoice.get(r.invoiceId)||0)+Number(r.refundAmount||r.amount||0)));
 const cashRelevant=books.filter(x=>['Thu bán hàng','Thu nợ khách','Chi hoàn tiền trả hàng','Chi hoàn tiền hủy đơn'].includes(x.category));
 const expectedTotal=validInvoices.reduce((sum,inv)=>sum+invoicePaymentTotal(inv)-Number(returnByInvoice.get(inv.id)||0),0);
 const actualTotal=cashRelevant.reduce((sum,x)=>sum+(x.category.startsWith('Thu ')?1:-1)*Number(x.amount||0),0);
 if(Math.abs(expectedTotal-actualTotal)>0.001){
   validInvoices.forEach(inv=>{
     const expected=invoicePaymentTotal(inv)-Number(returnByInvoice.get(inv.id)||0);
     const returnIds=returns.filter(r=>r.invoiceId===inv.id&&r.status!=='Đã hủy').map(r=>r.id);
     const actual=cashRelevant.filter(x=>x.referenceId===inv.id||returnIds.includes(x.referenceId)).reduce((sum,x)=>sum+(x.category.startsWith('Thu ')?1:-1)*Number(x.amount||0),0);
     if(Math.abs(expected-actual)>0.001)details.push({id:inv.id,ref:inv.id,message:'Hóa đơn '+money(expected)+' ₫ nhưng cashbook theo referenceId là '+money(actual)+' ₫.'});
   });
   cashRelevant.filter(x=>!validInvoices.some(inv=>inv.id===x.referenceId)&&!returns.some(r=>r.id===x.referenceId)).forEach(x=>details.push({id:x.id,ref:x.referenceId,message:'Dòng cashbook không truy được hóa đơn/phiếu trả hợp lệ.'}));
 }
 const check1={name:'1. Thanh toán hóa đơn ↔ cashbook',ok:Math.abs(expectedTotal-actualTotal)<=0.001,diffText:money(expectedTotal-actualTotal)+' ₫',details};
 const refundDetails=[];
 books.filter(x=>['Chi hoàn tiền trả hàng','Chi hoàn tiền hủy đơn'].includes(x.category)).forEach(x=>{
   const ok=returns.some(r=>r.id===x.referenceId&&r.status!=='Đã hủy')||invoices.some(inv=>inv.id===x.referenceId&&inv.status!=='Đã hủy'&&x.category==='Chi hoàn tiền hủy đơn');
   if(!ok)refundDetails.push({id:x.id,ref:x.referenceId,message:'referenceId không trỏ tới phiếu trả hoặc hóa đơn tồn tại.'});
 });
 const check2={name:'2. Phiếu hoàn có referenceId hợp lệ',ok:refundDetails.length===0,diffText:refundDetails.length+' dòng lỗi',details:refundDetails};
 const fundDetails=[];
 let allOpening=0,allNet=0;
 (state.funds||[]).filter(f=>f.active!==false).forEach(f=>{
   const opening=fundOpening(f), movements=fundMovements(f.id), thu=movements.filter(x=>x.type==='thu').reduce((a,x)=>a+Number(x.amount||0),0), chi=movements.filter(x=>x.type==='chi').reduce((a,x)=>a+Number(x.amount||0),0), end=opening+thu-chi, actual=fundBalance(f.id), diff=end-actual;
   allOpening+=opening;allNet+=thu-chi;
   if(Math.abs(diff)>0.001)fundDetails.push({id:f.id,ref:f.id,message:'Quỹ '+f.name+': công thức cuối kỳ lệch '+money(diff)+' ₫.'});
 });
 const allEnd=allOpening+allNet, allActual=(state.funds||[]).filter(f=>f.active!==false).reduce((a,f)=>a+fundBalance(f.id),0);
 if(Math.abs(allEnd-allActual)>0.001)fundDetails.push({id:'ALL',ref:'—',message:'Tổng toàn bộ quỹ lệch '+money(allEnd-allActual)+' ₫.'});
 const check3={name:'3. Đầu kỳ + thu − chi = cuối kỳ',ok:fundDetails.length===0,diffText:money(allEnd-allActual)+' ₫',details:fundDetails};
 const transferGroups=new Map();
 books.filter(x=>x.category==='Chuyển quỹ').forEach(x=>{const k=x.transferCode||x.referenceId||x.id;(transferGroups.get(k)||transferGroups.set(k,[]).get(k)).push(x);});
 const transferDetails=[];
 transferGroups.forEach((rows,k)=>{
   const thu=rows.filter(x=>x.type==='thu'),chi=rows.filter(x=>x.type==='chi'),t=thu.reduce((a,x)=>a+Number(x.amount||0),0),q=chi.reduce((a,x)=>a+Number(x.amount||0),0);
   if(rows.length!==2||thu.length!==1||chi.length!==1||Math.abs(t-q)>0.001)transferDetails.push({id:k,ref:k,message:'Cặp chuyển quỹ thiếu một chân hoặc số tiền không bằng nhau.'});
 });
 const check4={name:'4. Cặp chuyển quỹ đủ hai chân',ok:transferDetails.length===0,diffText:transferDetails.length+' cặp lỗi',details:transferDetails};
 const missingDetails=[];
 books.forEach(x=>{
   const missing=[];
   if(!x.fundId)missing.push('fundId'); if(!x.category)missing.push('category'); if(!x.shiftId&&normalizePaymentMethod(x.paymentMethod)==='Tiền mặt')missing.push('shiftId');
   if(missing.length)missingDetails.push({id:x.id,ref:x.referenceId,message:'Thiếu: '+missing.join(', ')});
 });
 const check5={name:'5. Trường bắt buộc của cashbook',ok:missingDetails.length===0,diffText:missingDetails.length+' dòng lỗi',details:missingDetails};
 return [check1,check2,check3,check4,check5];
}

function attendancePage(c){
 const emp=state.currentUser?.employeeId?state.employees.find(e=>e.id===state.currentUser.employeeId):state.employees.find(e=>e.accountId===state.currentUser?.id);
 const name=emp?.name||state.currentUser?.name||'Nhân viên';

 const todayRec=(state.attendance||[]).find(x=>x.employeeId===emp?.id&&x.date===today);
 const status=todayRec?.outAt?'Đã ra ca':todayRec?.inAt?'Đang làm việc':'Chưa vào ca';
 const rows=recs.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.inAt||'—')+'</td><td>'+esc(x.outAt||'—')+'</td><td>'+esc(x.status||'—')+'</td></tr>').join('');
 c.innerHTML='<div class="attendance-wrap"><div class="page-title">Chấm công <span style="float:right"><button type="button" class="btn btn-secondary attendance-switch" onclick="attendanceMonthlyPage(document.getElementById(\'content\'))">Bảng công tháng</button>'+esc(name)+'</span></div><div class="attendance-clock"><div id="attendanceClock"></div><div>'+new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})+'</div></div><div class="card attendance-shift"><b>Ca hành chính 08:00 – 17:30</b><div>'+status+'</div></div><button class="attendance-punch '+(todayRec?.inAt&&!todayRec?.outAt?'out':'in')+'" onclick="punchAttendance()">'+(todayRec?.inAt&&!todayRec?.outAt?'Ra ca':'Vào ca')+'</button><div class="attendance-verify">✓ Đang ở trong phạm vi: Văn phòng</div><div class="attendance-summary"><div>Giờ vào<br><b>'+(todayRec?.inAt||'—')+'</b></div><div>Giờ ra<br><b>'+(todayRec?.outAt||'—')+'</b></div><div>Tổng giờ làm<br><b>'+(todayRec?.hours||'—')+'</b></div></div><div class="card"><h3>Lịch sử gần đây</h3><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Giờ vào</th><th>Giờ ra</th><th>Trạng thái</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">Chưa có dữ liệu</td></tr>')+'</tbody></table></div></div></div>';
 setInterval(()=>{const el=document.getElementById('attendanceClock');if(el)el.textContent=new Date().toLocaleTimeString('vi-VN')},1000);
}
function punchAttendance(){
 const emp=state.currentUser?.employeeId?state.employees.find(e=>e.id===state.currentUser.employeeId):state.employees.find(e=>e.accountId===state.currentUser?.id);
 if(!emp)return alert('Tài khoản chưa liên kết hồ sơ nhân viên.');
 const date=localDateKey(new Date()), now=new Date(), time=now.toLocaleTimeString('vi-VN');
 let rec=state.attendance.find(x=>x.employeeId===emp.id&&x.date===date);
 if(!rec){rec={id:'ATT'+Date.now(),employeeId:emp.id,date,inAt:time,status:'Đúng giờ'};state.attendance.push(rec);}
 else if(rec.inAt&&!rec.outAt){rec.outAt=time;const a=rec.inAt.split(':').map(Number),b=time.split(':').map(Number);rec.hours=(((b[0]*60+b[1])-(a[0]*60+a[1]))/60).toFixed(2);rec.status='Đủ công';}
 else return alert('Hôm nay đã chấm công đủ.');
 saveState();renderPage();
}
function fundSummaryForType(type){
 const funds=(state.funds||[]).filter(f=>f.active!==false);
 const ids=type==='cash'?['FUND-CASH']:type==='bank'?['FUND-BANK']:type==='wallet'?['FUND-WALLET']:['FUND-CASH','FUND-BANK','FUND-WALLET'];
 const selected=funds.filter(f=>ids.includes(f.id));
 const opening=selected.reduce((s,f)=>s+fundOpening(f),0);
 const tx=(state.cashbook||[]).filter(x=>ids.includes(x.fundId));
 const thu=tx.filter(x=>x.type==='thu').reduce((s,x)=>s+Number(x.amount||0),0);
 const chi=tx.filter(x=>x.type==='chi').reduce((s,x)=>s+Number(x.amount||0),0);
 return {opening,thu,chi,closing:opening+thu-chi};
}

}

function cashierDraftDefaults(number){return {id:'draft-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),number:Number(number)||1,cart:[],customerCode:'KH000001',employeeId:state.currentUser?.employeeId||state.currentUser?.id||'',consultantId:'',orderDiscount:0,debtDueDate:'',payments:[{method:'Tiền mặt',amount:0,tendered:0}]};}
function normalizeCashierInvoiceNumbers(){(state.cashierInvoices||[]).forEach((d,i)=>{d.number=i+1;});state.cashierNextInvoiceNo=(state.cashierInvoices||[]).length+1;}
function ensureCashierInvoices(){
 state.cashierInvoices=Array.isArray(state.cashierInvoices)?state.cashierInvoices:[];
 if(!state.cashierInvoices.length)state.cashierInvoices.push({id:'draft-'+Date.now(),number:1,cart:JSON.parse(JSON.stringify(state.cashierCart||[])),customerCode:state.cashierCustomerCode||'KH000001',employeeId:state.cashierEmployeeId||state.currentUser?.id||'',consultantId:state.cashierConsultantId||'',orderDiscount:Number(state.cashierOrderDiscount)||0,debtDueDate:state.cashierDebtDueDate||'',payments:JSON.parse(JSON.stringify(state.cashierPayments?.length?state.cashierPayments:[{method:'Tiền mặt',amount:0,tendered:0}]))});
 state.cashierActiveInvoice=Math.min(Math.max(0,Number(state.cashierActiveInvoice)||0),state.cashierInvoices.length-1);
}
function saveActiveCashierInvoice(){ensureCashierInvoices();const d=state.cashierInvoices[state.cashierActiveInvoice];if(!d)return;const due=document.getElementById('cashierDebtDueDate');d.cart=JSON.parse(JSON.stringify(state.cashierCart||[]));d.customerCode=state.cashierCustomerCode||'KH000001';d.employeeId=state.cashierEmployeeId||'';d.consultantId=state.cashierConsultantId||'';d.orderDiscount=Number(state.cashierOrderDiscount)||0;d.debtDueDate=due?due.value:(state.cashierDebtDueDate||'');d.payments=JSON.parse(JSON.stringify(state.cashierPayments||[{method:'Tiền mặt',amount:0,tendered:0}]));}
function loadActiveCashierInvoice(){ensureCashierInvoices();const d=state.cashierInvoices[state.cashierActiveInvoice];if(!d)return;state.cashierCart=JSON.parse(JSON.stringify(d.cart||[]));state.cashierCustomerCode=d.customerCode||'KH000001';state.cashierEmployeeId=d.employeeId||state.currentUser?.employeeId||state.currentUser?.id||'';state.cashierConsultantId=d.consultantId||'';state.cashierOrderDiscount=Number(d.orderDiscount)||0;state.cashierDebtDueDate=d.debtDueDate||'';state.cashierPayments=JSON.parse(JSON.stringify(d.payments?.length?d.payments:[{method:'Tiền mặt',amount:0,tendered:0}]));}
function switchCashierInvoice(index){saveActiveCashierInvoice();if(!state.cashierInvoices[index])return;state.cashierActiveInvoice=index;loadActiveCashierInvoice();saveState();renderAll();}
function startNewCashierInvoice(){saveActiveCashierInvoice();normalizeCashierInvoiceNumbers();state.cashierInvoices.push(cashierDraftDefaults(state.cashierInvoices.length+1));state.cashierActiveInvoice=state.cashierInvoices.length-1;loadActiveCashierInvoice();saveState();renderAll();const search=document.getElementById('cashierSearch');if(search)search.focus();}
function closeCashierInvoice(index){saveActiveCashierInvoice();const d=state.cashierInvoices[index];if(!d)return;if((d.cart||[]).length){if(!confirm('Hóa đơn này đang có sản phẩm. Bạn có chắc muốn đóng hóa đơn?'))return;}state.cashierInvoices.splice(index,1);if(!state.cashierInvoices.length){state.cashierNextInvoiceNo=1;saveState();exitCashier();return;}normalizeCashierInvoiceNumbers();if(index<state.cashierActiveInvoice)state.cashierActiveInvoice--;else if(state.cashierActiveInvoice>=state.cashierInvoices.length)state.cashierActiveInvoice=state.cashierInvoices.length-1;loadActiveCashierInvoice();saveState();renderAll();}

function isCashierFavorite(p){return !!p.favorite||!!p.isFavorite||Number(p.saleCount||p.soldCount||0)>=5;}
function renderCashierProducts(keyword){const box=document.getElementById('cashierProducts');if(!box)return;const q=(keyword||'').toLowerCase();const active=state.cashierCategory||'Tất cả';const products=state.products.filter(p=>{const text=(p.name+' '+p.code+' '+(p.barcode||'')).toLowerCase();const group=getCashierProductGroup(p);return text.includes(q)&&(active==='Tất cả'||active===group||(active==='Hay dùng'&&isCashierFavorite(p)));});box.innerHTML=products.map(p=>{const stock=typeof p.stock==='number'?p.stock:null,group=getCashierProductGroup(p),cls=group==='Dịch vụ'?'service':group==='Gói liệu trình'?'package':group==='Mỹ phẩm'?'cosmetic':'';const duration=p.duration||p.durationMinutes||p.minutes;return '<button type="button" class="cashier-product-card '+cls+'" onclick="addToCashierCart(\''+escJs(p.code)+'\')">'+(group==='Gói liệu trình'?'<span class="cashier-product-badge">Gói</span>':'')+'<div class="cashier-product-group">'+esc(group)+'</div><div class="cashier-product-name" title="'+esc(p.name)+'">'+esc(p.name)+'</div><div class="cashier-product-meta">'+esc(p.code)+(p.barcode?' · '+esc(p.barcode):'')+'</div>'+(group==='Dịch vụ'&&duration?'<div class="cashier-product-duration">⏱ '+esc(String(duration).replace('minutes',' phút'))+'</div>':'')+'<div class="cashier-product-bottom"><span class="cashier-stock">'+(stock===null||stock==='---'?'':('Tồn '+money(stock)))+'</span><b class="cashier-product-price">'+money(p.price)+' ₫</b></div></button>';}).join('')||'<div class="cashier-empty">Không tìm thấy sản phẩm, dịch vụ hoặc gói phù hợp</div>';}
function setCashierCategory(category){state.cashierCategory=category||'Tất cả';document.querySelectorAll('.cashier-category-btn').forEach(b=>b.classList.toggle('active',b.dataset.category===state.cashierCategory));renderCashierProducts(document.getElementById('cashierSearch')?.value||'');}
function handleCashierBarcodeEnter(e){if(e.key!=='Enter')return;const value=String(e.target.value||'').trim();if(!value)return;const p=state.products.find(x=>String(x.barcode||'')===value||String(x.code||'')===value);if(!p){alert('Không tìm thấy mã barcode/mã hàng: '+value);return;}addToCashierCart(p.code);e.target.value='';e.preventDefault();}
function addToCashierCart(code){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const p=state.products.find(x=>x.code===code); if(!p)return;
  const item=state.cashierCart.find(x=>x.code===code);
  if(item)item.qty++;
  else state.cashierCart.push({code:p.code,name:p.name,price:Number(p.price)||0,qty:1,discount:0,vat:Number(p.vat)||10});
  renderCashierCart();
}
function changeCashierQty(code,delta){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const item=state.cashierCart.find(x=>x.code===code); if(!item)return;
  const product=state.products.find(x=>x.code===code);
  if(delta>0 && typeof product?.stock==='number' && item.qty+delta>product.stock)return alert('Số lượng vượt tồn kho.');
  item.qty+=delta;
  if(item.qty<=0)state.cashierCart=state.cashierCart.filter(x=>x.code!==code);
  renderCashierCart();
}
function cashierTotals(){
 const cart=state.cashierCart||[];
 const subtotal=cart.reduce((sum,x)=>sum+(Number(x.price)||0)*(Number(x.qty)||0),0);
 const lineDiscount=cart.reduce((sum,x)=>sum+Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0)),0);
 const orderDiscount=Math.min(Math.max(0,Number(state.cashierOrderDiscount)||0),Math.max(0,subtotal-lineDiscount));
 const netBeforeOrder=cart.reduce((sum,x)=>{
   const gross=(Number(x.price)||0)*(Number(x.qty)||0);
   const lineDiscount=Math.min(Math.max(0,Number(x.discount)||0),gross);
   return sum+Math.max(0,gross-lineDiscount);
 },0);
 const total=Math.max(0,netBeforeOrder-orderDiscount);
 const vat=cart.reduce((sum,x)=>{
   const gross=Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0)-Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0)));
   const rate=Math.max(0,Number(x.vat)||0);
   const allocatedDiscount=netBeforeOrder>0?orderDiscount*(gross/netBeforeOrder):0;
   const taxable=Math.max(0,gross-allocatedDiscount);
   return sum+(rate>0?taxable-(taxable/(1+rate/100)):0);
 },0);
 return {subtotal,lineDiscount,orderDiscount,total,vat};
}

function refreshCashierPaymentSummary(){
 const payments=state.cashierPayments||[], total=cashierTotals().total;
 const paid=payments.reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0);
 const cashTender=payments.filter(p=>normalizePaymentMethod(p.method)==='Tiền mặt').reduce((s,p)=>s+Math.max(0,Number(p.tendered)||0),0);
 const cashAllocated=payments.filter(p=>normalizePaymentMethod(p.method)==='Tiền mặt').reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0);
 const change=Math.max(0,cashTender-cashAllocated);
 const debt=Math.max(0,total-paid);
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 set('cashierTendered',money(cashTender)+' ₫');
 set('cashierChange',money(change)+' ₫');
 set('cashierDebt',money(debt)+' ₫');
 const wrap=document.getElementById('cashierDebtDueWrap');
 if(wrap){wrap.style.display=debt>0?'block':'none';if(debt>0){const d=document.getElementById('cashierDebtDueDate');if(d&&!d.value)d.value=state.cashierDebtDueDate||localDateKey(new Date(Date.now()+7*86400000));}}
}
function fillCashierPaymentRemaining(index=0){
 const total=cashierTotals().total, payments=state.cashierPayments||[];
 if(!payments[index])return;
 const assigned=payments.reduce((s,p,i)=>s+(i===index?0:Math.max(0,Number(p.amount)||0)),0);
 payments[index].amount=Math.max(0,total-assigned);
 if(normalizePaymentMethod(payments[index].method)==='Tiền mặt' && !(Number(payments[index].tendered)>0))payments[index].tendered=payments[index].amount;
 renderCashierPayments();
}

 if(!hasPermission('Sử dụng thu ngân'))return alert('Bạn không có quyền sử dụng Thu ngân.');

 const t=cashierTotals(),payments=(state.cashierPayments||[]).filter(p=>Number(p.amount)>0);
 const paid=payments.reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0);
 if(paid>t.total+0.000001)return alert('Tổng tiền thanh toán không được vượt quá tổng hóa đơn.');
 const cashTender=payments.filter(p=>normalizePaymentMethod(p.method)==='Tiền mặt').reduce((s,p)=>s+Math.max(0,Number(p.tendered)||0),0);
 const cashAllocated=payments.filter(p=>normalizePaymentMethod(p.method)==='Tiền mặt').reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0);
 if(cashTender+0.000001<cashAllocated)return alert('Tiền mặt khách đưa phải lớn hơn hoặc bằng số tiền thanh toán bằng tiền mặt.');
 const customer=state.customers.find(x=>x.code===state.cashierCustomerCode)||state.customers[0];

 for(const x of cart){const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number'&&p.stock<x.qty)return alert('Không đủ tồn kho cho '+p.name+'.');}
 cart.forEach(x=>{const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number')p.stock-=x.qty;});
 const first=payments[0]||{method:'Tiền mặt'};

 const netBeforeOrder=cart.reduce((s,x)=>s+Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0)-Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0))),0);

 cart.forEach(x=>{const product=state.products.find(p=>p.code===x.code);if(product?.type==='Gói dịch vụ, liệu trình')return;const rule=commissionRules.find(r=>r.productCode===x.code),rate=Number(rule?.rate)||0;if(rate>0&&employee?.id){const revenue=Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0)-(Number(x.discount)||0));state.serviceCommissions.push({id:nextAutoCode('HH',6,'spa_next_commission_id',state.serviceCommissions,'id'),invoiceId:invoice.id,employeeId:employee.id,productCode:x.code,productName:x.name,revenue,rate,amount:revenue*rate/100,createdAt:new Date().toISOString(),status:'Đang ghi nhận'});}});
 state.lastCashierInvoiceId=invoice.id;

 const originalId=inv.originalInvoiceId||inv.id;
 const type=action==='Hủy'?'Đã hủy':action==='Thay thế'?'Đã thay thế':'Đã điều chỉnh';
 inv.eInvoiceStatus=type;inv.eInvoiceAction=action;inv.eInvoiceReason=reason.trim();inv.approvalLog={type:action,approvedAt:new Date().toISOString(),approvedBy:state.currentUser?.username||'manager'};

 saveState();renderAll();alert('Đã ghi nhận '+action+' hóa đơn mô phỏng.');
}

function exportEInvoice(id){
 const inv=state.invoices.find(x=>x.id===id);if(!inv)return alert('Không tìm thấy đơn bán hàng.');
 if(inv.status!=='Đã thanh toán')return alert('Chỉ đơn đã thanh toán mới được xuất hóa đơn điện tử.');
 if(['Đã cấp mã','Đã điều chỉnh','Đã thay thế','Đã hủy'].includes(inv.eInvoiceStatus))return alert('Hóa đơn đã được cấp mã hoặc đã xử lý. Không xuất trực tiếp lần nữa.');
 if(!hasSellerProfile()&&!inv.sellerSnapshot)return alert('Chưa cấu hình hồ sơ đơn vị bán.');

function cancelInvoice(id){
 if(!hasPermission('Hủy hóa đơn'))return alert('Bạn không có quyền hủy hóa đơn.');
 const inv=state.invoices.find(x=>x.id===id),reason=document.getElementById('cancelReason')?.value.trim();
 if(!inv||!reason)return alert('Vui lòng nhập lý do hủy.');
 if(inv.status==='Đã hủy')return alert('Hóa đơn đã hủy.');

 if(!requiresApproval('Hủy hóa đơn',{amount:Number(inv.total||0),details:reason}))return alert('Hủy hóa đơn cần được phê duyệt.');

 const shift=requireOpenShift('hủy hóa đơn');if(!shift)return;
 const refund=Math.max(0,Number(inv.paid||0));
 const items=getInvoiceItems(inv);
 items.forEach(x=>{const p=state.products.find(z=>z.code===x.code);if(p&&typeof p.stock==='number')p.stock+=Number(x.qty||0);});
 (state.therapyCards||[]).filter(x=>x.invoiceId===inv.id).forEach(x=>{x.status='Đã hủy';x.cancelledAt=new Date().toISOString();x.remainingSessions=0;(x.usageHistory||[]).filter(u=>u.status==='Đã thực hiện').forEach(u=>{restoreMaterialUsage(u.id);(state.serviceCommissions||[]).filter(cm=>cm.usageId===u.id&&!cm.reversed).forEach(cm=>{cm.status='Đã hoàn tác';cm.reversed=true;});});});
 (state.serviceCommissions||[]).filter(x=>x.invoiceId===inv.id).forEach(x=>{x.status='Đã hủy';x.cancelledAt=new Date().toISOString();x.amount=0;});
 if(refund>0){
  const parts=Array.isArray(inv.paymentBreakdown)&&inv.paymentBreakdown.length?inv.paymentBreakdown.filter(p=>(p.source||'sale')==='sale'&&Number(p.amount)>0):[{method:inv.paymentMethod||'Tiền mặt',amount:refund}];
  const partTotal=parts.reduce((s,p)=>s+Number(p.amount||0),0);
  parts.forEach(p=>addCashMovement({type:'chi',amount:partTotal>0?refund*(Number(p.amount||0)/partTotal):refund,paymentMethod:p.method,subject:inv.customerName||inv.customer||'',referenceId:inv.id,note:'Hoàn tiền do hủy hóa đơn '+inv.id}));
}
 inv.paid=0;inv.status='Đã hủy';inv.cancelReason=reason;inv.cancelledAt=new Date().toISOString();inv.cancelledBy=state.currentUser?.username||'';inv.cancelRefundAmount=refund;inv.cancelledShiftId=shift.id;
 auditSensitive('Hủy hóa đơn',inv.id,{status:'Đã thanh toán',total:inv.total},{status:inv.status,cancelRefundAmount:refund},reason);
 saveState();closeModal();applyInvoiceFilters();alert(refund>0?'Đã hủy hóa đơn, hoàn kho và hoàn tiền.':'Đã hủy hóa đơn và hoàn kho.');
}

function collectDebt(id){
 if(!hasPermission('Xem thanh toán'))return alert('Bạn không có quyền thu nợ.');
 const shift=requireOpenShift('thu nợ');if(!shift)return;
 const inv=state.invoices.find(x=>x.id===id),amount=Number(document.getElementById('debtAmount')?.value)||0,method=normalizePaymentMethod(document.getElementById('debtMethod')?.value||'Tiền mặt');
 if(!inv||inv.status==='Đã hủy')return;
 const debt=Math.max(0,Number(inv.total||0)-Number(inv.paid||0)-invoiceReturnedAmount(inv));
 if(amount<=0||amount>debt)return alert('Số tiền thu không hợp lệ.');
 if(inv.customerCode==='KH000001')return alert('Khách lẻ không được ghi nợ.');
 inv.paid=Number(inv.paid||0)+amount;inv.paymentMethod=method;inv.payment=method;
 inv.paymentBreakdown=Array.isArray(inv.paymentBreakdown)?inv.paymentBreakdown:[];inv.paymentBreakdown.push({method,amount,source:'debt'});
 inv.status=inv.paid>=Math.max(0,Number(inv.total||0)-invoiceReturnedAmount(inv))?'Đã thanh toán':'Còn nợ';
 inv.debtHistory=Array.isArray(inv.debtHistory)?inv.debtHistory:[];inv.debtHistory.push({amount,method,createdAt:new Date().toISOString(),employee:state.currentUser?.name||'',shiftId:shift.id});
 addCashMovement({type:'thu',amount,paymentMethod:method,subject:inv.customerName||inv.customer||'',referenceId:inv.id,note:'Thu nợ hóa đơn '+inv.id});
 saveState();closeModal();applyInvoiceFilters();alert('Đã thu nợ '+money(amount)+' ₫.');
}

function createAccount(){
  if(!hasPermission('Quản lý tài khoản')) return alert('Bạn không có quyền quản lý tài khoản.');
  const name=document.getElementById('accountName').value.trim();
  const username=document.getElementById('accountUsername').value.trim();
  const password=document.getElementById('accountPassword').value;
  const role=document.getElementById('accountRole').value;
  if(!name||!username||!password){alert('Vui lòng nhập đầy đủ thông tin bắt buộc.');return;}
  if(!validatePassword(password)){alert(passwordPolicyMessage());return;}
  if(state.accounts.some(a=>a.username.toLowerCase()===username.toLowerCase())){alert('Tên đăng nhập đã tồn tại.');return;}
  const id=nextAutoCode('NV',4,'spa_next_employee_id',state.accounts,'id');
  state.accounts.push({id,name,username,password,role,status:'Hoạt động',permissions:defaultPermissions(role)});
  saveState();
  closeModal();
  adminAccountPage(document.getElementById('content'));
}

 state.stockMovements.push(movement);
 state[cfg.arr].push({id:code,date,subject,productCode:p.code,productName:p.name,quantity:qty,price,note:document.getElementById('stockDocNote').value.trim(),status:'Đã hoàn thành',createdAt:new Date().toISOString(),movementId:movement.id});

function getDashboardPeriodRange(period){
  const now=new Date();
  const start=new Date(now);
  const end=new Date(now);
  end.setHours(23,59,59,999);
  start.setHours(0,0,0,0);
  if(period==='yesterday'){
    start.setDate(start.getDate()-1); end.setDate(end.getDate()-1);
  }else if(period==='7days'){
    start.setDate(start.getDate()-6);
  }else if(period==='month'){
    start.setDate(1);
  }else if(period==='lastMonth'){
    start.setMonth(start.getMonth()-1,1); end.setMonth(end.getMonth(),0); end.setHours(23,59,59,999);
  }else if(period==='quarter'){
    start.setMonth(Math.floor(now.getMonth()/3)*3,1);
  }else if(period==='lastQuarter'){
    const q=Math.floor(now.getMonth()/3)-1;
    const year=now.getFullYear()+(q<0?-1:0);
    const normalized=(q+4)%4;
    start.setFullYear(year,normalized*3,1);
    end.setFullYear(year,normalized*3+3,0); end.setHours(23,59,59,999);
  }else if(period==='year'){
    start.setMonth(0,1);
  }
  return {start,end};
}

function dashboardInvoices(period){
  const range=getDashboardPeriodRange(period);
  return state.invoices.filter(x=>{
    const d=x.createdAt?new Date(x.createdAt):new Date();
    return d>=range.start && d<=range.end;
  });
}

  const returnedAmount=returns.reduce((a,r)=>a+Number(r.refundAmount||r.amount||0),0);

  const cash=(state.cashbook||[]).filter(x=>{const d=new Date(x.createdAt||0);const range=getDashboardPeriodRange(period);return d>=range.start&&d<=range.end;});
  const legacyIncome=validSales.filter(x=>!hasCashMovement(x.id,'thu')).reduce((a,x)=>a+Number(x.paid||0),0);
  const legacyExpense=rows.filter(x=>(x.type||'')==='Chi'&&!hasCashMovement(x.id,'chi')).reduce((a,x)=>a+Number(x.total||0),0);
  const income=cash.filter(x=>x.type==='thu').reduce((a,x)=>a+Number(x.amount||0),0)+legacyIncome;
  const expense=cash.filter(x=>x.type==='chi').reduce((a,x)=>a+Number(x.amount||0),0)+legacyExpense;
  const debt=validSales.reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.paid||0)-invoiceReturnedAmount(x)),0);
  document.getElementById('dashboardRevenue').innerText=money(revenue)+' ₫';

  document.getElementById('cashRevenue').innerText=money(paymentRevenue('Tiền mặt'))+' ₫';

}
function getChartBuckets(period,granularity){
  const rows=dashboardInvoices(period), range=getDashboardPeriodRange(period);
  let labels=[],values=[],customers=[];
  if(granularity==='hour'){
    labels=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+'h');
    values=Array(24).fill(0); customers=Array(24).fill(0);
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;values[d.getHours()]+=Number(x.total||0);customers[d.getHours()]+=1;});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=d.getHours();values[idx]-=Number(r.refundAmount||r.amount||0);});
  }else if(granularity==='weekday'){
    labels=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
    values=Array(7).fill(0); customers=Array(7).fill(0);
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]+=Number(x.total||0);customers[idx]+=1;});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]-=Number(r.refundAmount||r.amount||0);});
  }else{
    const cursor=new Date(range.start), end=new Date(range.end), map=new Map();
    while(cursor<=end){
      const key=localDateKey(cursor);
      labels.push(cursor.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}));map.set(key,labels.length-1);
      values.push(0);customers.push(0);cursor.setDate(cursor.getDate()+1);
    }
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=map.get(localDateKey(d));if(idx!==undefined){values[idx]+=Number(x.total||0);customers[idx]+=1;}});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=map.get(localDateKey(d));if(idx!==undefined)values[idx]-=Number(r.refundAmount||r.amount||0);});
  }
  return {labels,values,customers};
}
function drawChart(canvasId,emptyId,type,data){
  const canvas=document.getElementById(canvasId),empty=document.getElementById(emptyId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,width=canvas.clientWidth||700,height=260;
  canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const hasData=data.values.some(v=>v>0);if(empty)empty.style.display=hasData?'none':'flex';
  const pad={left:58,right:18,top:18,bottom:40},chartW=Math.max(10,width-pad.left-pad.right),chartH=height-pad.top-pad.bottom;
  const max=Math.max(1,...data.values),steps=4;
  ctx.font='12px Arial';ctx.fillStyle='#7b8490';ctx.strokeStyle='#e7ebf0';ctx.lineWidth=1;
  for(let i=0;i<=steps;i++){const y=pad.top+chartH-(chartH*i/steps);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillText(money(Math.round(max*i/steps)),6,y+4);}
  ctx.strokeStyle='#cfd5dd';ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(width-pad.right,pad.top+chartH);ctx.stroke();
  const step=chartW/Math.max(1,data.labels.length),yFor=v=>pad.top+chartH-(v/max)*chartH;
  if(type==='bar'){
    const barW=Math.max(2,step*0.62);data.values.forEach((v,i)=>{const x=pad.left+i*step+(step-barW)/2,y=yFor(v);ctx.fillStyle='#0b78e3';ctx.fillRect(x,y,barW,pad.top+chartH-y);});
  }else{
    ctx.strokeStyle='#0b78e3';ctx.lineWidth=3;ctx.beginPath();
    data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
    ctx.fillStyle='#0b78e3';data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();});
  }
  const labelEvery=data.labels.length>24?Math.ceil(data.labels.length/12):data.labels.length>12?2:1;
  ctx.fillStyle='#68717d';ctx.font='11px Arial';
  data.labels.forEach((label,i)=>{if(i%labelEvery!==0)return;const x=pad.left+i*step+step/2;ctx.save();ctx.translate(x,height-12);ctx.rotate(-0.35);ctx.textAlign='right';ctx.fillText(label,0,0);ctx.restore();});
}

function refreshDashboardCharts(){
  const period=document.getElementById('chartPeriod')?.value||'today';
  const granularity=document.getElementById('chartGranularity')?.value||'day';

 }).filter(x=>x.qty>0);

 packagePlans.forEach(plan=>{

   (state.serviceCommissions||[]).filter(x=>x.therapyCardId===card.id&&!x.reversed).forEach(x=>{x.status='Đã hoàn tác do trả gói';x.reversed=true;x.reversedAt=new Date().toISOString();});

 });

function invoiceRevenueFields(data){
 const items=Array.isArray(data?.items)?data.items:[];
 let grossExVat=0,vatAmount=0;
 items.forEach(x=>{
  const gross=Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0));
  const discount=Math.min(Math.max(0,Number(x.discount)||0),gross);
  const net=Math.max(0,gross-discount);
  const rate=Math.max(0,Number(x.vat)||0);
  if(rate>0){grossExVat+=net/(1+rate/100);vatAmount+=net-grossExVat;}
  else grossExVat+=net;
 });
 // Trường hợp chứng từ cũ không có items: amount được coi là tổng tiền hàng trước VAT.
 if(!items.length){
   const total=Number(data?.total)||0, tax=Number(data?.tax)||0;
   grossExVat=Math.max(0,Number(data?.amount)||Math.max(0,total-tax));
   vatAmount=Math.max(0,tax);
 }
 const commercialDiscount=Math.max(0,Number(data?.commercialDiscount)||0);
 const discountAmount=Math.max(0,Number(data?.discount)||0);
 const otherDeduction=Math.max(0,Number(data?.otherDeduction)||0);
 const netRevenue=Math.max(0,grossExVat-commercialDiscount-discountAmount-otherDeduction);

function multiLineTotals(){
 const rows=[...document.querySelectorAll('.invoice-line-row')];
 let amount=0,discount=0,tax=0;
 rows.forEach(r=>{
  const p=state.products[Number(r.querySelector('.line-product')?.value)];
  const qty=Math.max(0,Number(r.querySelector('.line-qty')?.value)||0);
  const price=Math.max(0,Number(r.querySelector('.line-rate')?.value)||0);
  const lineGross=qty*price;
  const lineDiscount=Math.min(Math.max(0,Number(r.querySelector('.line-discount')?.value)||0),lineGross);
  const lineTotal=Math.max(0,lineGross-lineDiscount);
  const vat=Number(p?.vat??10);
  amount+=lineGross;discount+=lineDiscount;tax+=vat>0?lineTotal-(lineTotal/(1+vat/100)):0;
 });
 return {amount,discount,total:Math.max(0,amount-discount),tax};
}

}
