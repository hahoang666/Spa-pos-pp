.chip-expense{background:#fff0f0;color:#c53b40}
.cashier-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,1fr);gap:14px;height:calc(100vh - 130px)}.cashier-products-panel,.cashier-order-panel{display:flex;flex-direction:column;min-height:0}.cashier-toolbar{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px}.cashier-products{padding:12px;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cashier-product{padding:12px;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--border);min-height:105px}.cashier-product-code{font-size:11px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cashier-order-head{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.cashier-meta{padding:12px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr;gap:8px}.cashier-meta label,.cashier-order-discount label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#667085}.cashier-cart{flex:1;overflow:auto;padding:8px}.cashier-line{padding:10px 4px;border-bottom:1px solid var(--border)}.cashier-line-main,.cashier-line-sub,.summary-row{display:flex;justify-content:space-between;align-items:center}.cashier-line-sub{font-size:11px;color:#667085;margin-top:5px}.cashier-line-discount{display:flex;gap:8px;align-items:center;margin-top:7px}.cashier-line-discount label{font-size:11px;color:#667085}.cashier-line-discount .field{width:120px}.cashier-summary{border-top:1px solid var(--border);padding:12px}.cashier-order-discount{margin:8px 0}.payment-box{border-top:1px solid var(--border);padding-top:9px;margin-top:8px}.cashier-payment-row{display:grid;grid-template-columns:1.1fr .9fr .9fr auto;gap:6px;margin-bottom:6px}.held-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}

const PAYMENT_METHODS=['Tiền mặt','Chuyển khoản','Ví điện tử','Thẻ'];
function localDateKey(date){
 const d=date instanceof Date?date:new Date(date);
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function normalizePaymentMethod(value){
 const v=(value||'').trim();
 if(v==='Ngân hàng') return 'Chuyển khoản';
 if(v==='Khác') return 'Thẻ';
 return PAYMENT_METHODS.includes(v)?v:'Tiền mặt';
}
function paymentOptions(selected){
 return PAYMENT_METHODS.map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('');
}

function defaultPermissions(role){
  if(role==='Admin') return [...allPermissions];
  if(role==='Quản lý') return allPermissions.filter(p=>!['Quản lý tài khoản','Phân quyền User'].includes(p));
  return ['Xem Dashboard','Xem hóa đơn','Tạo hóa đơn','Xem thanh toán','Sử dụng thu ngân','Xem khách hàng','Thêm khách hàng','Xem sản phẩm'];
}
function hasPermission(permission){
  const u=state.currentUser;
  if(!u) return false;
  if(u.role==='Admin') return true;
  return Array.isArray(u.permissions) && u.permissions.includes(permission);
}
function accountPermissions(account){
  if(!Array.isArray(account.permissions)) account.permissions=defaultPermissions(account.role);
  return account.permissions;
}

function passwordStrength(password){
 const p=String(password||'');
 const checks=[p.length>=8,/[A-Z]/.test(p),/[a-z]/.test(p),/[0-9]/.test(p),/[^A-Za-z0-9]/.test(p)];
 return {valid:checks.every(Boolean),score:checks.filter(Boolean).length};
}
function passwordPolicyMessage(){

}

 return r.valid;
}

function login(){
 const username=document.getElementById('loginUsername').value.trim();
 const password=document.getElementById('loginPassword').value;
 const error=document.getElementById('loginError');
 if(!username||!password){error.textContent='Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';error.classList.add('show');return;}
 const account=state.accounts.find(a=>a.username.toLowerCase()===username.toLowerCase());
 if(!account){error.textContent='Tên đăng nhập hoặc mật khẩu không đúng.';error.classList.add('show');return;}
 const now=Date.now();
 if(account.lockedUntil && now<account.lockedUntil){
   const mins=Math.ceil((account.lockedUntil-now)/60000);
   error.textContent='Tài khoản đang bị khóa tạm thời. Thử lại sau '+mins+' phút.';
   error.classList.add('show');return;
 }
 if(account.status!=='Hoạt động'){error.textContent='Tài khoản đã bị khóa. Vui lòng liên hệ Admin.';error.classList.add('show');return;}
 if(account.password!==password){
   account.failedLoginAttempts=(account.failedLoginAttempts||0)+1;
   if(account.failedLoginAttempts>=5){
     account.lockedUntil=Date.now()+15*60*1000;
     account.failedLoginAttempts=0;
     saveState();
     error.textContent='Sai mật khẩu quá 5 lần. Tài khoản bị khóa tạm thời 15 phút.';
   }else{
     saveState();
     error.textContent='Tên đăng nhập hoặc mật khẩu không đúng. Còn '+(5-account.failedLoginAttempts)+' lần thử.';
   }
   error.classList.add('show');return;
 }
 account.failedLoginAttempts=0; account.lockedUntil=null; saveState();
 error.classList.remove('show');
 ['spa_pos_username','spa_pos_remember_username','spa_pos_role','spa_pos_user_id','spa_pos_user_name'].forEach(k=>localStorage.removeItem(k));
 document.getElementById('loginScreen').style.display='none';
 state.currentUser=account;state.section='Tổng quan';state.page='Tổng quan';renderAll();
}

function money(n){return new Intl.NumberFormat('vi-VN').format(n||0)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function peekAutoCode(prefix,width,storageKey,collection,field){
  const nums=(collection||[]).map(x=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return 0;
    const n=Number(raw.slice(prefix.length));
    return Number.isFinite(n)?n:0;
  });
  const stored=Number(localStorage.getItem(storageKey)||0);
  return prefix+String(Math.max(0,...nums,stored)+1).padStart(width,'0');
}
function nextAutoCode(prefix,width,storageKey,collection,field){
  const code=peekAutoCode(prefix,width,storageKey,collection,field);
  localStorage.setItem(storageKey,String(Number(code.slice(prefix.length))));
  return code;
}
function syncAutoCodeCounter(storageKey,prefix,collection,field){
  const max=(collection||[]).reduce((n,x)=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return n;
    const value=Number(raw.slice(prefix.length));
    return Number.isFinite(value)?Math.max(n,value):n;
  },0);
  const stored=Number(localStorage.getItem(storageKey)||0);
  if(max>stored)localStorage.setItem(storageKey,String(max));
}

  const box=document.getElementById('cashierProducts'); if(!box)return;

function addToCashierCart(code){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const p=state.products.find(x=>x.code===code); if(!p)return;
  const item=state.cashierCart.find(x=>x.code===code);
  if(item)item.qty++;
  else state.cashierCart.push({code:p.code,name:p.name,price:Number(p.price)||0,qty:1,discount:0,vat:Number(p.vat)||10});
  renderCashierCart();
}
function changeCashierQty(code,delta){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const item=state.cashierCart.find(x=>x.code===code); if(!item)return;
  const product=state.products.find(x=>x.code===code);
  if(delta>0 && typeof product?.stock==='number' && item.qty+delta>product.stock)return alert('Số lượng vượt tồn kho.');
  item.qty+=delta;
  if(item.qty<=0)state.cashierCart=state.cashierCart.filter(x=>x.code!==code);
  renderCashierCart();
}
function cashierTotals(){
 const cart=state.cashierCart||[];
 const subtotal=cart.reduce((sum,x)=>sum+(Number(x.price)||0)*(Number(x.qty)||0),0);
 const lineDiscount=cart.reduce((sum,x)=>sum+Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0)),0);
 const orderDiscount=Math.min(Math.max(0,Number(state.cashierOrderDiscount)||0),Math.max(0,subtotal-lineDiscount));
 const total=Math.max(0,subtotal-lineDiscount-orderDiscount);
 return {subtotal,lineDiscount,orderDiscount,total,vat:total-(total/1.1)};
}
function updateCashierLineDiscount(code,value){
 const item=state.cashierCart.find(x=>x.code===code);if(!item)return;
 item.discount=Math.min(Math.max(0,Number(value)||0),(Number(item.price)||0)*Number(item.qty||0));
 renderCashierCart();
}
function renderCashierCart(){
 const box=document.getElementById('cashierCart');if(!box)return;
 const cart=state.cashierCart||[];
 box.innerHTML=cart.length?cart.map(x=>'<div class="cashier-line"><div class="cashier-line-main"><b>'+esc(x.name)+'</b><span>'+money((x.price*x.qty)-(x.discount||0))+' ₫</span></div><div class="cashier-line-sub"><span>'+money(x.price)+' ₫ × '+x.qty+' · VAT '+Number(x.vat||10)+'%</span><div style="display:flex;gap:6px"><button class="btn btn-secondary" onclick="changeCashierQty(\''+esc(x.code)+'\',-1)">−</button><span>'+x.qty+'</span><button class="btn btn-secondary" onclick="changeCashierQty(\''+esc(x.code)+'\',1)">+</button></div></div><div class="cashier-line-discount"><label>Giảm dòng</label><input class="field" type="number" min="0" value="'+(Number(x.discount)||0)+'" oninput="updateCashierLineDiscount(\''+esc(x.code)+'\',this.value)"></div></div>').join(''):'<div style="text-align:center;color:#98a2b3;padding:30px">Chưa có sản phẩm</div>';
 const t=cashierTotals();
 document.getElementById('cashierSubtotal').textContent=money(t.subtotal)+' ₫';
 document.getElementById('cashierLineDiscount').textContent=money(t.lineDiscount)+' ₫';
 document.getElementById('cashierOrderDiscount').value=t.orderDiscount;
 document.getElementById('cashierVat').textContent=money(t.vat)+' ₫';
 document.getElementById('cashierTotal').textContent=money(t.total)+' ₫';
 renderCashierPayments();
}

function renderCashierPayments(){
 const box=document.getElementById('cashierPayments');if(!box)return;
 const payments=state.cashierPayments||[];
 box.innerHTML=payments.map((p,i)=>'<div class="cashier-payment-row"><select class="field" onchange="updateCashierPayment('+i+',\'method\',this.value)">'+paymentOptions(normalizePaymentMethod(p.method))+'</select><input class="field" type="number" min="0" placeholder="Số tiền" value="'+(Number(p.amount)||0)+'" oninput="updateCashierPayment('+i+',\'amount\',this.value)"><input class="field" type="number" min="0" placeholder="Khách đưa" value="'+(Number(p.tendered)||0)+'" '+(normalizePaymentMethod(p.method)==='Tiền mặt'?'':'disabled')+' oninput="updateCashierPayment('+i+',\'tendered\',this.value)">'+(payments.length>1?'<button class="btn btn-secondary" onclick="removeCashierPaymentRow('+i+')">×</button>':'')+'</div>').join('');
 const total=cashierTotals().total,paid=payments.reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0),cashTender=payments.filter(p=>normalizePaymentMethod(p.method)==='Tiền mặt').reduce((s,p)=>s+Math.max(0,Number(p.tendered)||0),0);
 document.getElementById('cashierTendered').textContent=money(cashTender)+' ₫';
 document.getElementById('cashierChange').textContent=money(Math.max(0,cashTender-Math.min(total,paid)))+' ₫';
 document.getElementById('cashierDebt').textContent=money(Math.max(0,total-paid))+' ₫';
}
function updateCashierPayment(i,field,value){

function completeCashierSale(){
 if(!hasPermission('Sử dụng thu ngân'))return alert('Bạn không có quyền sử dụng Thu ngân.');
 const cart=state.cashierCart||[];if(!cart.length)return alert('Vui lòng thêm sản phẩm vào đơn hàng.');
 const t=cashierTotals(),payments=state.cashierPayments||[],paid=payments.reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0);
 if(paid>t.total)return alert('Tổng tiền thanh toán không được vượt quá tổng hóa đơn.');
 const customer=state.customers.find(x=>x.code===state.cashierCustomerCode)||state.customers[0];
 const employees=state.accounts.filter(a=>a.status==='Hoạt động');
 const employee=employees.find(x=>x.id===state.cashierEmployeeId)||state.currentUser;
 const consultant=employees.find(x=>x.id===state.cashierConsultantId);
 for(const x of cart){const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number'&&p.stock<x.qty)return alert('Không đủ tồn kho cho '+p.name+'.');}
 cart.forEach(x=>{const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number')p.stock-=x.qty;});
 const first=payments[0]||{method:'Tiền mặt'};
 const invoice=createInvoice({type:'Thu',customer:customer.name,customerCode:customer.code,customerName:customer.name,customerType:customer.code==='KH000001'?'Mới':'Cũ',phone:customer.phone||'',productCode:cart[0].code,productName:cart.length===1?cart[0].name:cart.map(x=>x.name).join(', '),amount:t.subtotal,discount:t.lineDiscount+t.orderDiscount,total:t.total,tax:t.vat,paid,paymentMethod:normalizePaymentMethod(first.method),paymentBreakdown:payments.map(x=>({method:normalizePaymentMethod(x.method),amount:Number(x.amount)||0})),employeeId:employee?.id||'',employeeName:employee?.name||'',consultantId:consultant?.id||'',consultantName:consultant?.name||'',status:paid>=t.total?'Đã thanh toán':'Còn nợ',items:cart.map(x=>({code:x.code,name:x.name,qty:x.qty,price:x.price,discount:x.discount||0,vat:x.vat||10}))});
 state.lastCashierInvoiceId=invoice.id; state.cashierCart=[];state.cashierOrderDiscount=0;state.cashierPayments=[{method:'Tiền mặt',amount:0,tendered:0}];saveState();alert('Thanh toán thành công. '+(paid<t.total?'Hóa đơn được ghi nhận là Còn nợ.':''));renderAll();
}

function printInvoice(id){

 if(!inv)return alert('Không tìm thấy hóa đơn.');
 const items=Array.isArray(inv.items)&&inv.items.length?inv.items:[{code:inv.productCode,name:inv.productName,qty:1,price:inv.amount,discount:inv.discount||0,vat:10}];

function applyInvoiceFilters(){
 const f=document.querySelectorAll('.invoice-filter');
 const period=f[0]?.value||'today', status=f[1]?.value||'all', employee=f[4]?.value||'all', payment=f[7]?.value||'all';
 const q=(document.getElementById('commonSearch')?.value||'').toLowerCase().trim();
 let rows=dashboardInvoices(period);
 if(status!=='all') rows=rows.filter(x=>(x.status||'')===status);
 if(employee!=='all') rows=rows.filter(x=>(x.employeeName||x.employee||'')===employee);
 if(payment!=='all') rows=rows.filter(x=>normalizePaymentMethod(x.paymentMethod)===payment);
 if(q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 const body=document.getElementById('invoiceTableBody');
 const totalPages=Math.max(1,Math.ceil(rows.length/state.invoicePageSize));state.invoicePage=Math.min(state.invoicePage,totalPages);const pageRows=rows.slice((state.invoicePage-1)*state.invoicePageSize,state.invoicePage*state.invoicePageSize);if(body) body.innerHTML=pageRows.length?pageRows.map(invoiceTableRow).join(''):'<tr><td colspan="13"><div class="empty">Không có dữ liệu phù hợp</div></td></tr>';const pg=document.getElementById('invoicePagination');if(pg)pg.innerHTML='<button class="btn btn-secondary" onclick="changeInvoicePage(-1)" '+(state.invoicePage<=1?'disabled':'')+'>‹</button> Trang '+state.invoicePage+'/'+totalPages+' <button class="btn btn-secondary" onclick="changeInvoicePage(1)" '+(state.invoicePage>=totalPages?'disabled':'')+'>›</button>';applyColumnVisibility();
}

function viewInvoice(id){

 openModal('Chi tiết hóa đơn '+esc(inv.id),'<div class="form-grid"><div><label>Khách hàng</label><input class="field" readonly value="'+esc(inv.customerName||inv.customer||'')+'"></div><div><label>Nhân viên</label><input class="field" readonly value="'+esc(inv.employeeName||'')+'"></div><div><label>Thời gian</label><input class="field" readonly value="'+esc(inv.time||'')+'"></div><div><label>Trạng thái</label><input class="field" readonly value="'+esc(inv.status||'')+'"></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Mã SP</th><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Giảm</th><th>VAT</th><th>Thành tiền</th></tr></thead><tbody>'+itemRows+'</tbody></table></div><div class="summary" style="margin-top:12px"><div class="summary-box"><div class="summary-row"><span>Tổng</span><b>'+money(total)+' ₫</b></div><div class="summary-row"><span>Đã trả</span><b>'+money(paid)+' ₫</b></div><div class="summary-row"><span>Còn nợ</span><b>'+money(debt)+' ₫</b></div></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Đóng</button><button class="btn btn-primary" onclick="printInvoice(\''+esc(inv.id)+'\');closeModal()">In hóa đơn</button>');

function openCancelInvoice(id){

 openModal('Hủy hóa đơn '+esc(inv.id),'<div><label>Lý do hủy *</label><textarea id="cancelReason" class="field" rows="4" placeholder="Nhập lý do hủy..."></textarea></div>','<button class="btn btn-secondary" onclick="closeModal()">Không</button><button class="btn btn-danger" onclick="cancelInvoice(\''+esc(inv.id)+'\')">Xác nhận hủy</button>');

function cancelInvoice(id){
 if(!hasPermission('Hủy hóa đơn'))return alert('Bạn không có quyền hủy hóa đơn.');
 const inv=state.invoices.find(x=>x.id===id),reason=document.getElementById('cancelReason')?.value.trim();
 if(!inv||!reason)return alert('Vui lòng nhập lý do hủy.');
 inv.status='Đã hủy';inv.cancelReason=reason;inv.cancelledAt=new Date().toISOString();inv.cancelledBy=state.currentUser?.username||'';

function openCollectDebt(id){
 if(!hasPermission('Xem thanh toán'))return alert('Bạn không có quyền thu nợ.');
 const inv=state.invoices.find(x=>x.id===id);if(!inv)return;
 const debt=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
 if(debt<=0)return alert('Hóa đơn không còn nợ.');
 openModal('Thu nợ '+esc(inv.id),'<div class="form-grid"><div><label>Còn nợ</label><input class="field" readonly value="'+money(debt)+' ₫"></div><div><label>Phương thức</label><select id="debtMethod" class="field">'+paymentOptions('Tiền mặt')+'</select></div><div class="full"><label>Số tiền thu *</label><input id="debtAmount" class="field" type="number" min="0.01" max="'+debt+'" step="0.01" value="'+debt+'"></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="collectDebt(\''+esc(id)+'\')">Thu nợ</button>');
}
function collectDebt(id){
 if(!hasPermission('Xem thanh toán'))return alert('Bạn không có quyền thu nợ.');
 const inv=state.invoices.find(x=>x.id===id),amount=Number(document.getElementById('debtAmount')?.value)||0,method=normalizePaymentMethod(document.getElementById('debtMethod')?.value||'Tiền mặt');
 if(!inv)return;
 const debt=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
 if(amount<=0||amount>debt)return alert('Số tiền thu không hợp lệ.');
 inv.paid=Number(inv.paid||0)+amount;inv.paymentMethod=method;inv.payment=method;
 inv.paymentBreakdown=Array.isArray(inv.paymentBreakdown)?inv.paymentBreakdown:[];inv.paymentBreakdown.push({method,amount});
 inv.status=inv.paid>=inv.total?'Đã thanh toán':'Còn nợ';
 inv.debtHistory=Array.isArray(inv.debtHistory)?inv.debtHistory:[];inv.debtHistory.push({amount,method,createdAt:new Date().toISOString(),employee:state.currentUser?.name||''});
 saveState();closeModal();applyInvoiceFilters();alert('Đã thu nợ '+money(amount)+' ₫.');
}

 const csv=[head,...rows.map(x=>[x.id,x.time,x.customerName||x.customer,x.phone,x.amount,x.discount,x.total,x.tax,x.paid,Math.max(0,(x.total||0)-(x.paid||0)),x.status,x.paymentMethod])];
 const blob=new Blob(['\ufeff'+csv.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});

function setTheme(theme){
  const themes={
    green:{primary:'#3b6f63',hover:'#2f5c52',soft:'#edf7f3'},
    blue:{primary:'#0875e5',hover:'#0664c4',soft:'#eff6ff'},
    purple:{primary:'#7c3aed',hover:'#6d28d9',soft:'#f5f3ff'},
    orange:{primary:'#ea580c',hover:'#c2410c',soft:'#fff7ed'}
  };
  const t=themes[theme]||themes.green;
  document.documentElement.style.setProperty('--primary',t.primary);
  document.documentElement.style.setProperty('--primary-hover',t.hover);
  document.documentElement.style.setProperty('--primary-soft',t.soft);
  localStorage.setItem('spa_pos_theme',theme);
  document.querySelectorAll('.theme-swatch').forEach(el=>{
    el.classList.toggle('active',el.dataset.theme===theme);
  });
}
function loadTheme(){
  setTheme(localStorage.getItem('spa_pos_theme')||'green');
}

function savePermissions(id){
  if(!hasPermission('Phân quyền User')) return alert('Bạn không có quyền phân quyền User.');
  const account=state.accounts.find(a=>a.id===id);
  if(!account) return;
  if(account.role==='Admin'){closeModal();return;}
  account.permissions=[...document.querySelectorAll('.permission-check:checked')].map(x=>x.value);
  saveState();
  closeModal();
  adminPermissionsPage(document.getElementById('content'));
}

function createAccount(){
  if(!hasPermission('Quản lý tài khoản')) return alert('Bạn không có quyền quản lý tài khoản.');
  const name=document.getElementById('accountName').value.trim();
  const username=document.getElementById('accountUsername').value.trim();
  const password=document.getElementById('accountPassword').value;
  const role=document.getElementById('accountRole').value;
  if(!name||!username||!password){alert('Vui lòng nhập đầy đủ thông tin bắt buộc.');return;}
  if(!validatePassword(password)){alert(passwordPolicyMessage());return;}
  if(state.accounts.some(a=>a.username.toLowerCase()===username.toLowerCase())){alert('Tên đăng nhập đã tồn tại.');return;}
  const id=nextAutoCode('NV',4,'spa_next_employee_id',state.accounts,'id');
  state.accounts.push({id,name,username,password,role,status:'Hoạt động',permissions:defaultPermissions(role)});
  saveState();
  closeModal();
  adminAccountPage(document.getElementById('content'));
}

function deleteAccount(id){

}

function reportPage(c){
 const invoices=(state.invoices||[]).filter(x=>x.status!=='Đã hủy');
 const revenue=invoices.reduce((sum,x)=>sum+Number(x.total||0),0);
 const count=invoices.length;
 const customers=new Set(invoices.map(x=>x.customerCode||x.customerName||x.customer).filter(Boolean)).size;
 const avg=count?revenue/count:0;
 const paid=invoices.filter(x=>x.status==='Đã thanh toán').reduce((sum,x)=>sum+Number(x.total||0),0);
 const debt=invoices.filter(x=>x.status==='Còn nợ').reduce((sum,x)=>sum+Number(x.total||0)-Number(x.paid||0),0);
 const cancelled=(state.invoices||[]).filter(x=>x.status==='Đã hủy').length;
 const byPayment=PAYMENT_METHODS.map(method=>({method,total:invoices.filter(x=>normalizePaymentMethod(x.paymentMethod)===method).reduce((sum,x)=>sum+Number(x.total||0),0)}));
 const rows=byPayment.map(x=>`<tr><td>${x.method}</td><td style="text-align:right">${money(x.total)} ₫</td></tr>`).join('');
 c.innerHTML=`
  <div class="page-title">${esc(state.page)}</div>
  <div class="kpis">
   <div class="kpi">Doanh thu<div class="n">${money(revenue)} ₫</div></div>
   <div class="kpi">Số hóa đơn<div class="n">${count}</div></div>
   <div class="kpi">Khách hàng<div class="n">${customers}</div></div>

function getDashboardPeriodRange(period){
  const now=new Date();
  const start=new Date(now);
  const end=new Date(now);
  end.setHours(23,59,59,999);
  start.setHours(0,0,0,0);
  if(period==='yesterday'){
    start.setDate(start.getDate()-1); end.setDate(end.getDate()-1);
  }else if(period==='7days'){
    start.setDate(start.getDate()-6);
  }else if(period==='month'){
    start.setDate(1);
  }else if(period==='lastMonth'){
    start.setMonth(start.getMonth()-1,1); end.setMonth(end.getMonth(),0); end.setHours(23,59,59,999);
  }else if(period==='quarter'){
    start.setMonth(Math.floor(now.getMonth()/3)*3,1);
  }else if(period==='lastQuarter'){
    const q=Math.floor(now.getMonth()/3)-1;
    const year=now.getFullYear()+(q<0?-1:0);
    const normalized=(q+4)%4;
    start.setFullYear(year,normalized*3,1);
    end.setFullYear(year,normalized*3+3,0); end.setHours(23,59,59,999);
  }else if(period==='year'){
    start.setMonth(0,1);
  }
  return {start,end};
}

function dashboardInvoices(period){
  const range=getDashboardPeriodRange(period);
  return state.invoices.filter(x=>{
    const d=x.createdAt?new Date(x.createdAt):new Date();
    return d>=range.start && d<=range.end;
  });
}

function getChartBuckets(period,granularity){
  const rows=dashboardInvoices(period), range=getDashboardPeriodRange(period);
  let labels=[],values=[],customers=[];
  if(granularity==='hour'){
    labels=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+'h');
    values=Array(24).fill(0); customers=Array(24).fill(0);
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;values[d.getHours()]+=Number(x.total||0);customers[d.getHours()]+=1;});
  }else if(granularity==='weekday'){
    labels=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
    values=Array(7).fill(0); customers=Array(7).fill(0);
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]+=Number(x.total||0);customers[idx]+=1;});
  }else{
    const cursor=new Date(range.start), end=new Date(range.end), map=new Map();
    while(cursor<=end){
      const key=localDateKey(cursor);
      labels.push(cursor.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}));map.set(key,labels.length-1);
      values.push(0);customers.push(0);cursor.setDate(cursor.getDate()+1);
    }
    rows.forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=map.get(localDateKey(d));if(idx!==undefined){values[idx]+=Number(x.total||0);customers[idx]+=1;}});
  }
  return {labels,values,customers};
}
function drawChart(canvasId,emptyId,type,data){
  const canvas=document.getElementById(canvasId),empty=document.getElementById(emptyId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,width=canvas.clientWidth||700,height=260;
  canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const hasData=data.values.some(v=>v>0);if(empty)empty.style.display=hasData?'none':'flex';
  const pad={left:58,right:18,top:18,bottom:40},chartW=Math.max(10,width-pad.left-pad.right),chartH=height-pad.top-pad.bottom;
  const max=Math.max(1,...data.values),steps=4;
  ctx.font='12px Arial';ctx.fillStyle='#7b8490';ctx.strokeStyle='#e7ebf0';ctx.lineWidth=1;
  for(let i=0;i<=steps;i++){const y=pad.top+chartH-(chartH*i/steps);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillText(money(Math.round(max*i/steps)),6,y+4);}
  ctx.strokeStyle='#cfd5dd';ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(width-pad.right,pad.top+chartH);ctx.stroke();
  const step=chartW/Math.max(1,data.labels.length),yFor=v=>pad.top+chartH-(v/max)*chartH;
  if(type==='bar'){
    const barW=Math.max(2,step*0.62);data.values.forEach((v,i)=>{const x=pad.left+i*step+(step-barW)/2,y=yFor(v);ctx.fillStyle='#0b78e3';ctx.fillRect(x,y,barW,pad.top+chartH-y);});
  }else{
    ctx.strokeStyle='#0b78e3';ctx.lineWidth=3;ctx.beginPath();
    data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
    ctx.fillStyle='#0b78e3';data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();});
  }
  const labelEvery=data.labels.length>24?Math.ceil(data.labels.length/12):data.labels.length>12?2:1;
  ctx.fillStyle='#68717d';ctx.font='11px Arial';
  data.labels.forEach((label,i)=>{if(i%labelEvery!==0)return;const x=pad.left+i*step+step/2;ctx.save();ctx.translate(x,height-12);ctx.rotate(-0.35);ctx.textAlign='right';ctx.fillText(label,0,0);ctx.restore();});
}

 <div class="summary"><div class="summary-box"><div class="summary-row"><span>Thành tiền</span><b id="sum">0 ₫</b></div><div class="summary-row"><span>VAT</span><b id="tax">0 ₫</b></div><div class="summary-row total"><span>Tổng thanh toán</span><b id="grand">0 ₫</b></div></div></div>`,
 `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveInvoice()">Lưu hóa đơn</button>`);
 ['qty','rate','discount'].forEach(id=>document.getElementById(id).addEventListener('input',calcInvoice));
 document.getElementById('productSelect').addEventListener('change',function(){
   const product=state.products[Number(this.value)];
   const rate=document.getElementById('rate');
   if(product&&rate){
     rate.value=Number(product.price)||0;
     rate.dataset.productCode=product.code;
   }
   calcInvoice();
 });
 const firstProduct=state.products[Number(document.getElementById('productSelect').value)||0];
 if(firstProduct){
   document.getElementById('rate').value=Number(firstProduct.price)||0;
   document.getElementById('rate').dataset.productCode=firstProduct.code;
 }
 calcInvoice();
}
function calcInvoice(){
 const q=Number(document.getElementById('qty').value)||0,r=Number(document.getElementById('rate').value)||0,d=Number(document.getElementById('discount').value)||0;
 const amount=q*r;const grand=Math.max(0,amount-d);const tax=grand-(grand/1.1);
 document.getElementById('sum').innerText=money(amount)+' ₫';document.getElementById('tax').innerText=money(tax)+' ₫';document.getElementById('grand').innerText=money(grand)+' ₫';
}
function createInvoice(data){
 const now=new Date();
 const invoiceId=nextAutoCode('HD',6,'spa_next_invoice_id',state.invoices,'id');
 const total=Number(data.total)||0;
 const tax=Number.isFinite(Number(data.tax))?Number(data.tax):total-(total/1.1);
 const paymentMethod=normalizePaymentMethod(data.paymentMethod);
 const paid=Number(data.paid ?? total);
 const status=data.status|| (data.cancelled ? 'Đã hủy' : paid>=total ? 'Đã thanh toán' : paid>0 ? 'Còn nợ' : 'Còn nợ');
 const invoice={
   id:invoiceId,
   createdAt:now.toISOString(),
   time:now.toLocaleString('vi-VN'),
   branch:data.branch||'Chi nhánh chính',
   type:data.type||'Thu',
   customer:data.customer||'Khách lẻ',
   customerCode:data.customerCode||'',
   customerName:data.customerName||data.customer||'Khách lẻ',
   customerType:data.customerType||'',
   phone:data.phone||'',
   productCode:data.productCode||'',
   productName:data.productName||'',
   amount:Number(data.amount)||total,
   discount:Number(data.discount)||0,
   total,
   tax,
   vat:10,
   paid,
   paymentMethod,
   payment:paymentMethod,
   paymentBreakdown:Array.isArray(data.paymentBreakdown)?data.paymentBreakdown:[],
   employeeId:data.employeeId||'',employeeName:data.employeeName||'',consultantId:data.consultantId||'',consultantName:data.consultantName||'',
   items:Array.isArray(data.items)?data.items:[],
   status:data.status||'Đã thanh toán'
 };
 state.invoices.unshift(invoice);
 saveState();
 return invoice;
}
function addInvoiceLineRow(){
 const wrap=document.getElementById('invoiceLines');if(!wrap)return;
 const idx=wrap.children.length;
 const opts=state.products.map((p,i)=>'<option value="'+i+'">'+esc(p.code)+' - '+esc(p.name)+' - '+money(p.price)+' ₫</option>').join('');
 const row=document.createElement('div');row.className='invoice-line-row';row.style='display:grid';row.style.gridTemplateColumns='2fr .7fr 1fr .8fr auto';row.style.gap='7px';row.style.marginBottom='7px';
 row.innerHTML='<select class="field line-product">'+opts+'</select><input class="field line-qty" type="number" min="1" value="1"><input class="field line-rate" type="number" min="0" step="0.01" value="'+(state.products[0]?.price||0)+'"><input class="field line-discount" type="number" min="0" value="0"><button class="btn btn-secondary line-remove">×</button>';
 row.querySelector('.line-product').addEventListener('change',e=>{const p=state.products[Number(e.target.value)];row.querySelector('.line-rate').value=p?.price||0;});
 row.querySelector('.line-remove').addEventListener('click',()=>{if(wrap.children.length>1)row.remove();});
 wrap.appendChild(row);
}
function openMultiLineInvoice(){
 if(!hasPermission('Tạo hóa đơn'))return alert('Bạn không có quyền tạo hóa đơn.');
 const customers=state.customers.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+' - '+esc(x.code)+'</option>').join('');
 openModal('Tạo hóa đơn','<div class="form-grid"><div><label>Khách hàng</label><select id="multiCustomer" class="field">'+customers+'</select></div><div><label>Phương thức</label><select id="multiPay" class="field">'+paymentOptions('Tiền mặt')+'</select></div><div class="full"><label>Sản phẩm</label><div id="invoiceLines"></div><button class="btn btn-secondary" onclick="addInvoiceLineRow()">＋ Thêm sản phẩm</button></div></div><div class="summary"><div class="summary-box"><div class="summary-row"><span>Tổng</span><b id="multiTotal">0 ₫</b></div><div class="summary-row"><span>VAT</span><b id="multiTax">0 ₫</b></div></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveMultiLineInvoice()">Lưu hóa đơn</button>');
 addInvoiceLineRow();
}
function saveMultiLineInvoice(){
 const rows=[...document.querySelectorAll('.invoice-line-row')];if(!rows.length)return;
 const items=rows.map(r=>{const p=state.products[Number(r.querySelector('.line-product').value)];const qty=Number(r.querySelector('.line-qty').value)||0,price=Number(r.querySelector('.line-rate').value)||0,discount=Number(r.querySelector('.line-discount').value)||0;return {code:p?.code||'',name:p?.name||'',qty,price,discount,vat:10};});
 if(items.some(x=>!x.code||x.qty<1||x.price<=0||x.discount>x.qty*x.price))return alert('Dữ liệu sản phẩm không hợp lệ.');
 const amount=items.reduce((a,x)=>a+x.qty*x.price,0),discount=items.reduce((a,x)=>a+x.discount,0),total=amount-discount,tax=total-total/1.1;
 const c=state.customers[Number(document.getElementById('multiCustomer').value)||0]||state.customers[0];
 createInvoice({type:'Thu',customer:c.name,customerCode:c.code,customerName:c.name,phone:c.phone||'',productCode:items[0].code,productName:items.map(x=>x.name).join(', '),amount,discount,total,tax,paid:total,paymentMethod:document.getElementById('multiPay').value,items,status:'Đã thanh toán'});
 closeModal();state.section='Đơn hàng';state.page='Hóa đơn';renderAll();alert('Đã tạo hóa đơn thành công.');
}
function deleteProduct(code){
 if(!hasPermission('Xóa sản phẩm'))return alert('Bạn không có quyền xóa sản phẩm.');
 const p=state.products.find(x=>x.code===code);if(!p)return;
 const used=state.invoices.some(i=>(Array.isArray(i.items)?i.items:[]).some(it=>it.code===code)||i.productCode===code);
 if(used){p.status='Ngừng kinh doanh';saveState();productPage(document.getElementById('content'));return alert('Sản phẩm đã có giao dịch nên được chuyển sang Ngừng kinh doanh.');}
 if(confirm('Xóa sản phẩm '+p.name+'?')){state.products=state.products.filter(x=>x.code!==code);saveState();productPage(document.getElementById('content'));}
}
function openProduct(code){
 const editing=!!code;
 const p=editing?state.products.find(x=>x.code===code):null;
 if(editing&&!p)return;
 const product=p||{code:nextAutoCode('SP',6,'spa_next_product_id',state.products,'code'),name:'',type:'Dịch vụ',group:'Mỹ phẩm',unit:'Cái',pre:0,vat:Number(document.getElementById('productVat').value)||0,price:0,cost:0,stock:'---',status:'Đang kinh doanh'};
 document.getElementById('productGroup')&&(document.getElementById('productGroup').value=product.group||'Mỹ phẩm');
 openModal(editing?'Sửa hàng hóa':'Thêm hàng hóa',`
   <div class="form-grid">
    <div><label>Mã hàng hóa</label><input id="productCode" class="field" value="${esc(product.code)}" readonly></div>
    <div><label>Nhóm hàng</label><select id="productGroup" class="field"><option value="Mỹ phẩm">Mỹ phẩm</option><option value="Dịch vụ">Dịch vụ</option><option value="Gói dịch vụ">Gói dịch vụ</option><option value="Khác">Khác</option></select></div><div><label>Đơn vị tính</label><select id="productUnit" class="field"><option>Chai</option><option>Hộp</option><option>Cái</option><option>Lần</option><option>Gói</option><option>Kg</option></select></div><div><label>Loại hàng</label><select id="productType" class="field"><option>Dịch vụ</option><option>Hàng hóa</option><option>Gói dịch vụ, liệu trình</option></select></div>
    <div class="full"><label>Tên hàng hóa</label><input id="productName" class="field" value="${esc(product.name)}"></div><div><label>Barcode</label><input id="productBarcode" class="field" value="${esc(product.barcode||"")}"></div>
    <div><label>VAT (%)</label><select id="productVat" class="field"><option>0</option><option>5</option><option>8</option><option selected>10</option></select></div>
    <div><label>Giá bán sau thuế</label><input id="productPrice" class="field" type="number" min="0" step="0.001" value="${Number(product.price)||0}" oninput="calculateProductPreTax()"></div>
    <div><label>Giá bán trước thuế</label><input id="productPre" class="field" type="text" value="${formatProductPreTax(Number(product.price)||0)}" readonly></div>
    <div><label>Trạng thái</label><select id="productStatus" class="field"><option>Đang kinh doanh</option><option>Ngừng kinh doanh</option></select></div><div><label>Giá vốn</label><input id="productCost" class="field" type="number" min="0" step="0.001" value="${Number(product.cost)||0}"></div>
   </div>`,
   `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveProduct('${esc(product.code)}',${editing})">Lưu</button>`
 );
}
function formatProductPreTax(price){
 const value=Number(price)||0;
 return (value/1.1).toFixed(3);
}
function calculateProductPreTax(){
 const price=Number(document.getElementById('productPrice')?.value)||0;
 const pre=document.getElementById('productPre');
 if(pre) pre.value=formatProductPreTax(price);
}
function saveProduct(code,editing){
  if(!hasPermission(editing?'Sửa sản phẩm':'Thêm sản phẩm')) return alert('Bạn không có quyền thực hiện thao tác này.');
 const name=document.getElementById('productName').value.trim();
 if(!name){alert('Vui lòng nhập tên hàng hóa.');return;}
 const rawPrice=document.getElementById('productPrice').value;
 if(rawPrice!==''&&Number(rawPrice)<0)return alert('Giá bán không được âm.');
 const rawCost=document.getElementById('productCost').value;
 if(rawCost!==''&&Number(rawCost)<0)return alert('Giá vốn không được âm.');
 const price=Number(rawPrice)||0;
 const data={
  name,
  barcode:(document.getElementById('productBarcode')?.value||'').trim(),
  type:document.getElementById('productType').value,
  pre:Number((price/1.1).toFixed(3)),
  vat:10,
  price,
  cost:Number(document.getElementById('productCost').value)||0,
  group:document.getElementById('productGroup').value,
  unit:document.getElementById('productUnit').value,
  status:document.getElementById('productStatus')?.value||'Đang kinh doanh'
 };
 if(editing){
  const p=state.products.find(x=>x.code===code);
  if(!p)return;
  Object.assign(p,data);
 }else{
  state.products.push({code,...data,stock:'---'});
 }
 saveState();
 closeModal();
 productPage(document.getElementById('content'));
}
function openPrice(){
 openModal('Tạo bảng giá',`
  <div class="form-grid">
   <div><label>Mã bảng giá</label><input id="priceListCode" class="field" value="${nextAutoCode('BG',6,'spa_next_price_list_id',state.priceLists||[],'code')}" readonly></div>
   <div><label>Tên bảng giá *</label><input id="priceListName" class="field" value="Bảng giá mới"></div>
   <div><label>Trạng thái</label><select id="priceListStatus" class="field"><option>Đang áp dụng</option><option>Ngừng áp dụng</option></select></div>
  </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="savePriceList()">Lưu</button>`
 )
}
function savePriceList(){
  if(!hasPermission('Thêm bảng giá')) return alert('Bạn không có quyền tạo bảng giá.');
 const code=document.getElementById('priceListCode').value.trim();
 const name=document.getElementById('priceListName').value.trim();
 if(!name)return alert('Vui lòng nhập Tên bảng giá.');
 if((state.priceLists||[]).some(x=>x.code===code))return alert('Mã bảng giá đã tồn tại.');
 state.priceLists=state.priceLists||[];
 state.priceLists.push({code,name,status:document.getElementById('priceListStatus').value,createdAt:new Date().toISOString()});
 saveState(); closeModal(); alert('Đã lưu bảng giá thành công.'); pricePage(document.getElementById('content'));
}
function openSupplier(){
 const code=nextAutoCode('NCC',5,'spa_next_supplier_id',state.suppliers,'code');
 openModal('Thêm nhà cung cấp',`
  <div class="form-grid">
   <div><label>Mã nhà cung cấp</label><input id="supplierCode" class="field" value="${code}" readonly></div>
   <div><label>Tên nhà cung cấp *</label><input id="supplierName" class="field"></div>
   <div><label>Điện thoại</label><input id="supplierPhone" class="field"></div>
   <div><label>Email</label><input id="supplierEmail" class="field"></div>
   <div class="full"><label>Ghi chú</label><textarea id="supplierNote" class="field" rows="3"></textarea></div>
  </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveSupplier()">Lưu</button>`
 )
}
function saveSupplier(){
  if(!hasPermission('Tạo nhà cung cấp')) return alert('Bạn không có quyền tạo nhà cung cấp.');
 const code=document.getElementById('supplierCode').value.trim();
 const name=document.getElementById('supplierName').value.trim();
 if(!name)return alert('Vui lòng nhập Tên nhà cung cấp.');
 if(state.suppliers.some(x=>x.code===code))return alert('Mã nhà cung cấp đã tồn tại.');
 state.suppliers.push({code,name,phone:document.getElementById('supplierPhone').value.trim(),email:document.getElementById('supplierEmail').value.trim(),note:document.getElementById('supplierNote').value.trim(),debt:0,buy:0,createdAt:new Date().toISOString()});
 saveState(); closeModal(); alert('Đã lưu nhà cung cấp thành công.'); supplierPage(document.getElementById('content'));
}
function openGeneric(){
 const code=nextAutoCode('CT',6,'spa_next_document_id',state.documents||[],'code');
 openModal('Tạo chứng từ',`
  <div class="form-grid">
   <div><label>Mã chứng từ</label><input id="documentCode" class="field" value="${code}" readonly></div>
   <div><label>Ngày chứng từ *</label><input id="documentDate" class="field" type="date" value="${localDateKey(new Date())}"></div>
   <div class="full"><label>Đối tượng *</label><input id="documentSubject" class="field" placeholder="Nhập đối tượng"></div>
   <div class="full"><label>Ghi chú</label><textarea id="documentNote" class="field" rows="3"></textarea></div>
  </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveGeneric()">Lưu nháp</button>`
 )
}
function saveGeneric(){
  if(!hasPermission('Tạo chứng từ')) return alert('Bạn không có quyền tạo chứng từ.');
 const code=document.getElementById('documentCode').value.trim();
 const date=document.getElementById('documentDate').value;
 const subject=document.getElementById('documentSubject').value.trim();
 if(!date)return alert('Vui lòng chọn Ngày chứng từ.');
 if(!subject)return alert('Vui lòng nhập Đối tượng.');
 state.documents=state.documents||[];
 if(state.documents.some(x=>x.code===code))return alert('Mã chứng từ đã tồn tại.');
 state.documents.push({code,date,subject,note:document.getElementById('documentNote').value.trim(),status:'Nháp',createdAt:new Date().toISOString()});
 saveState(); closeModal(); alert('Đã lưu chứng từ thành công.');
}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
loadTheme();
state.section='Tổng quan';
state.page='Tổng quan';
initLogin();
renderAll();
</script>
