const CASH_CATEGORIES=['Thu bán hàng','Thu nợ khách','Thu khác','Chi hoàn tiền trả hàng','Chi hoàn tiền hủy đơn','Chi nhập hàng','Chi vận hành','Chi lương/hoa hồng','Thừa quỹ','Thiếu quỹ','Chuyển quỹ','Phí ngân hàng/cà thẻ'];
function cashCategoryFor({type,subject='',referenceId='',category=''}){if(CASH_CATEGORIES.includes(category))return category;const sub=String(subject||'').toLowerCase();if(sub.includes('thừa quỹ'))return 'Thừa quỹ';if(sub.includes('thiếu quỹ'))return 'Thiếu quỹ';if(sub.includes('trả hàng'))return 'Chi hoàn tiền trả hàng';if(sub.includes('hủy đơn'))return 'Chi hoàn tiền hủy đơn';if(sub.includes('nhập hàng'))return 'Chi nhập hàng';if(sub.includes('lương')||sub.includes('hoa hồng'))return 'Chi lương/hoa hồng';if(sub.includes('ngân hàng')||sub.includes('cà thẻ'))return 'Phí ngân hàng/cà thẻ';if(type==='thu'&&referenceId)return 'Thu bán hàng';return type==='thu'?'Thu khác':'Chi vận hành';}

function addCashMovement({type,amount,paymentMethod='Tiền mặt',subject='',referenceId='',note='',category='',txnDate=''}) {
 const value=Number(amount)||0;
 const normalizedPaymentMethod=normalizePaymentMethod(paymentMethod);
 const normalizedCategory=cashCategoryFor({type,subject,referenceId,category});
 const date=txnDate||localTxnDate();
 const shiftId=getOpenShift()?.id||'';
 const createdBy=state.currentUser?.id||'';
 if(!['thu','chi'].includes(type)||value<=0||!fundIdForPayment(normalizedPaymentMethod)||!normalizedCategory||!subject?.trim()||!note?.trim()||!referenceId?.trim()||!createdBy||!shiftId||!/^\d{4}-\d{2}-\d{2}$/.test(date)){
   alert('Không thể lưu giao dịch quỹ: thiếu trường bắt buộc hoặc số tiền không hợp lệ.'); return null;
 }

 const prefix=type==='thu'?'PT':'PC';
 const key=type==='thu'?'spa_next_receipt_id':'spa_next_payment_id';
 const id=nextAutoCode(prefix,6,key,state.cashbook,'id');
 const row={id,type,amount:value,subject:subject.trim(),category:normalizedCategory,paymentMethod:normalizedPaymentMethod,fundId:fundIdForPayment(normalizedPaymentMethod),referenceId:referenceId.trim(),note:note.trim(),txnDate:date,createdAt:new Date().toISOString(),createdBy,shiftId,status:'Hoàn thành'};
 state.cashbook.push(row);return row;

 if(!from||!to||from===to)return alert('Quỹ nguồn và quỹ đích phải khác nhau.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return alert('Ngày chuyển quỹ không hợp lệ.');
 if(!Number.isFinite(amount)||amount<=0)return alert('Số tiền chuyển phải lớn hơn 0.');
 if(!note)return alert('Bắt buộc nhập diễn giải.');
 if(date<fundOpeningDate(fundById(from))||date<fundOpeningDate(fundById(to)))return alert('Ngày chuyển phải từ ngày bắt đầu sử dụng của cả hai quỹ.');
 const available=fundBalanceAsOf(from,date);
 if(amount>available)return alert('Số dư quỹ nguồn không đủ. Số dư có thể chuyển: '+money(available)+' ₫.');

 const shiftId=getOpenShift()?.id||'';const createdBy=state.currentUser?.id||'';
 if(!shiftId||!createdBy)return alert('Cần có người lập và ca đang mở.');
 const mk=(id,type,fundId,subject)=>({id,type,amount,subject,category:'Chuyển quỹ',paymentMethod:'Chuyển quỹ',fundId,referenceId:transferCode,note,txnDate:date,createdAt:new Date().toISOString(),createdBy,shiftId,status:'Hoàn thành',transferCode});
 state.cashbook.push(mk(nextAutoCode('PC',6,'spa_next_payment_id',state.cashbook),'chi',from,'Chuyển quỹ đến '+(fundById(to)?.name||to)));
 state.cashbook.push(mk(nextAutoCode('PT',6,'spa_next_receipt_id',state.cashbook),'thu',to,'Chuyển quỹ từ '+(fundById(from)?.name||from)));
 saveState();alert('Đã chuyển '+money(amount)+' ₫. Mã chuyển: '+transferCode);cashbookPage(document.getElementById('content'));
}

 const pin=prompt('Giảm giá '+pct.toFixed(2)+'% vượt mức '+limit+'%. Nhập PIN quản lý để phê duyệt:');

 if(!account){error.textContent='Tên đăng nhập hoặc mật khẩu không đúng.';error.classList.add('show');return;}

function peekAutoCode(prefix,width,storageKey,collection,field){
  const nums=(collection||[]).map(x=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return 0;
    const n=Number(raw.slice(prefix.length));
    return Number.isFinite(n)?n:0;
  });
  const stored=Number(localStorage.getItem(storageKey)||0);
  return prefix+String(Math.max(0,...nums,stored)+1).padStart(width,'0');
}
function nextAutoCode(prefix,width,storageKey,collection,field){
  const code=peekAutoCode(prefix,width,storageKey,collection,field);
  localStorage.setItem(storageKey,String(Number(code.slice(prefix.length))));
  return code;
}
function syncAutoCodeCounter(storageKey,prefix,collection,field){
  const max=(collection||[]).reduce((n,x)=>{
    const raw=String(x?.[field]||'');
    if(!raw.toUpperCase().startsWith(prefix.toUpperCase())) return n;
    const value=Number(raw.slice(prefix.length));
    return Number.isFinite(value)?Math.max(n,value):n;
  },0);
  const stored=Number(localStorage.getItem(storageKey)||0);
  if(max>stored)localStorage.setItem(storageKey,String(max));
}

 }

function undoTherapySession(cardId,usageId){

function cashbookPeriodRange(mode,from,to){
 const now=new Date(), today=localDateKey(now);
 if(mode==='day'){const d=from||today;return [d,d];}
 if(mode==='month'){const d=from||today;const p=d.slice(0,7);return [p+'-01',new Date(Number(p.slice(0,4)),Number(p.slice(5,7)),0).toISOString().slice(0,10)];}
 if(mode==='quarter'){const d=from||today,y=Number(d.slice(0,4)),m=Number(d.slice(5,7)),q=Math.floor((m-1)/3)*3+1;return [`${y}-${String(q).padStart(2,'0')}-01`,new Date(y,q+2,0).toISOString().slice(0,10)];}
 return [from||'0000-01-01',to||today];
}

function openCloseShift(){
 if(!hasPermission('Chốt quỹ'))return alert('Bạn không có quyền chốt quỹ.');
 const sh=getOpenShift();if(!sh)return alert('Không có ca đang mở.');
 const start=new Date(sh.openedAt),cash=(state.cashbook||[]).filter(x=>x.shiftId===sh.id||(new Date(x.createdAt||0)>=start&&!x.shiftId));
 const income=cash.filter(x=>x.type==='thu').reduce((a,x)=>a+Number(x.amount||0),0);
 const expense=cash.filter(x=>x.type==='chi').reduce((a,x)=>a+Number(x.amount||0),0);
 const cashIncome=cash.filter(x=>x.type==='thu'&&normalizePaymentMethod(x.paymentMethod||'Tiền mặt')==='Tiền mặt').reduce((a,x)=>a+Number(x.amount||0),0);
 const cashExpense=cash.filter(x=>x.type==='chi'&&normalizePaymentMethod(x.paymentMethod||'Tiền mặt')==='Tiền mặt').reduce((a,x)=>a+Number(x.amount||0),0);
 const expected=(Number(sh.openingCash)||0)+cashIncome-cashExpense;
 openModal('Chốt quỹ','<div class="form-grid"><div><label>Tiền mặt dự kiến</label><input class="field" value="'+money(expected)+' ₫" disabled></div><div><label>Tiền mặt thực tế *</label><input id="actualCash" class="field" type="number" min="0"></div><div><label>Tổng thu</label><input class="field" value="'+money(income)+' ₫" disabled></div><div><label>Tổng chi</label><input class="field" value="'+money(expense)+' ₫" disabled></div><div class="full"><label>Ghi chú</label><textarea id="closeNote" class="field"></textarea></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveCloseShift()">Chốt quỹ</button>');
 window._closingShift={sh,income,expense,expected};
}
function saveCloseShift(){
 if(!hasPermission('Chốt quỹ'))return alert('Bạn không có quyền chốt quỹ.');
 const d=Number(document.getElementById('actualCash').value);if(!Number.isFinite(d)||d<0)return alert('Tiền thực tế không hợp lệ.'); const note=document.getElementById('closeNote').value.trim(); const diff=d-x.expected; if(Math.abs(diff)>0.000001&&!note)return alert('Bắt buộc ghi chú khi thừa hoặc thiếu quỹ.');
 const x=window._closingShift;if(!x)return;
 if(Math.abs(diff)>0.000001){ addCashMovement({type:diff>0?'thu':'chi',amount:Math.abs(diff),paymentMethod:'Tiền mặt',subject:diff>0?'Thừa quỹ':'Thiếu quỹ',referenceId:x.sh.id,note:note}); } Object.assign(x.sh,{closedAt:new Date().toISOString(),closedBy:state.currentUser?.id||'',totalIncome:x.income,totalExpense:x.expense,expectedCash:x.expected,actualCash:d,difference:d-x.expected,status:'Đã chốt',closeNote:note});
 saveState();window._closingShift=null;closeModal();shiftClosePage(document.getElementById('content'));alert('Đã chốt quỹ.');
}

function saveMaterialRule(){

 const sc=document.getElementById('mrService').value,mc=document.getElementById('mrMaterial').value,q=Number(document.getElementById('mrQty').value),p=state.products.find(x=>x.code===sc),m=(state.materials||[]).find(x=>x.code===mc);

 state.serviceMaterials=Array.isArray(state.serviceMaterials)?state.serviceMaterials:[];

function consumeMaterialsForService(serviceCode, multiplier=1, refId=''){
 const rules=(state.serviceMaterials||[]).filter(x=>x.serviceCode===serviceCode);
 if(!rules.length)return;
 state.materialMovements=Array.isArray(state.materialMovements)?state.materialMovements:[];
 rules.forEach(r=>{
   const m=(state.materials||[]).find(x=>x.code===r.materialCode); if(!m)return;
   const qty=Number(r.quantity)*Number(multiplier);
   m.stock=Number(m.stock||0)-qty;
   state.materialMovements.push({id:nextAutoCode('XK',6,'spa_next_material_movement_id',state.materialMovements,'id'),materialCode:m.code,quantity:-qty,reason:'Sử dụng dịch vụ',referenceId:refId,createdAt:new Date().toISOString()});
 });
}

function saveInvoice(){

function addToCashierCart(code){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const p=state.products.find(x=>x.code===code); if(!p)return;
  const item=state.cashierCart.find(x=>x.code===code);
  if(item)item.qty++;
  else state.cashierCart.push({code:p.code,name:p.name,price:Number(p.price)||0,qty:1,discount:0,vat:Number(p.vat)||10});
  renderCashierCart();
}
function changeCashierQty(code,delta){
  if(!hasPermission('Sử dụng thu ngân')) return alert('Bạn không có quyền sử dụng Thu ngân.');
  const item=state.cashierCart.find(x=>x.code===code); if(!item)return;
  const product=state.products.find(x=>x.code===code);
  if(delta>0 && typeof product?.stock==='number' && item.qty+delta>product.stock)return alert('Số lượng vượt tồn kho.');
  item.qty+=delta;
  if(item.qty<=0)state.cashierCart=state.cashierCart.filter(x=>x.code!==code);
  renderCashierCart();
}
function cashierTotals(){
 const cart=state.cashierCart||[];
 const subtotal=cart.reduce((sum,x)=>sum+(Number(x.price)||0)*(Number(x.qty)||0),0);
 const lineDiscount=cart.reduce((sum,x)=>sum+Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0)),0);
 const orderDiscount=Math.min(Math.max(0,Number(state.cashierOrderDiscount)||0),Math.max(0,subtotal-lineDiscount));
 const netBeforeOrder=cart.reduce((sum,x)=>{
   const gross=(Number(x.price)||0)*(Number(x.qty)||0);
   const lineDiscount=Math.min(Math.max(0,Number(x.discount)||0),gross);
   return sum+Math.max(0,gross-lineDiscount);
 },0);
 const total=Math.max(0,netBeforeOrder-orderDiscount);
 const vat=cart.reduce((sum,x)=>{
   const gross=Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0)-Math.min(Math.max(0,Number(x.discount)||0),(Number(x.price)||0)*(Number(x.qty)||0)));
   const rate=Math.max(0,Number(x.vat)||0);
   const allocatedDiscount=netBeforeOrder>0?orderDiscount*(gross/netBeforeOrder):0;
   const taxable=Math.max(0,gross-allocatedDiscount);
   return sum+(rate>0?taxable-(taxable/(1+rate/100)):0);
 },0);
 return {subtotal,lineDiscount,orderDiscount,total,vat};
}

function applyInvoiceFilters(){
 const f=document.querySelectorAll('.invoice-filter');
 const period=f[0]?.value||'today', status=f[1]?.value||'all', employee=f[2]?.value||'all', payment=f[3]?.value||'all';
 const q=(document.getElementById('commonSearch')?.value||'').toLowerCase().trim();
 let rows=dashboardInvoices(period);
 if(status!=='all') rows=rows.filter(x=>(x.status||'')===status);
 if(employee!=='all') rows=rows.filter(x=>(x.employeeName||x.employee||'')===employee);
 if(payment!=='all') rows=rows.filter(x=>normalizePaymentMethod(x.paymentMethod)===payment);
 if(q) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 const body=document.getElementById('invoiceTableBody');
 const totalPages=Math.max(1,Math.ceil(rows.length/state.invoicePageSize));state.invoicePage=Math.min(state.invoicePage,totalPages);const pageRows=rows.slice((state.invoicePage-1)*state.invoicePageSize,state.invoicePage*state.invoicePageSize);if(body) body.innerHTML=pageRows.length?pageRows.map(invoiceTableRow).join(''):'<tr><td colspan="13"><div class="empty">Không có dữ liệu phù hợp</div></td></tr>';const pg=document.getElementById('invoicePagination');if(pg)pg.innerHTML='<button class="btn btn-secondary" onclick="changeInvoicePage(-1)" '+(state.invoicePage<=1?'disabled':'')+'>‹</button> Trang '+state.invoicePage+'/'+totalPages+' <button class="btn btn-secondary" onclick="changeInvoicePage(1)" '+(state.invoicePage>=totalPages?'disabled':'')+'>›</button>';applyColumnVisibility();
}
function changeInvoicePage(d){state.invoicePage=Math.max(1,state.invoicePage+d);applyInvoiceFilters();}

 const items=Array.isArray(inv.items)&&inv.items.length?inv.items:[{code:inv.productCode,name:inv.productName,qty:1,price:inv.amount,discount:inv.discount||0,vat:10}];
 const paid=Number(inv.paid)||0,total=Number(inv.total)||0,debt=Math.max(0,total-paid);
 const itemRows=items.map(x=>'<tr><td>'+esc(x.code||'')+'</td><td>'+esc(x.name||'')+'</td><td>'+x.qty+'</td><td>'+money(x.price||0)+' ₫</td><td>'+money(x.discount||0)+' ₫</td><td>'+Number(x.vat||10)+'%</td><td>'+money((Number(x.price)||0)*(Number(x.qty)||0)-(Number(x.discount)||0))+' ₫'+'</td></tr>').join('');

}
function openCancelInvoice(id){
 if(!hasPermission('Hủy hóa đơn'))return alert('Bạn không có quyền hủy hóa đơn.');
 const inv=state.invoices.find(x=>x.id===id);if(!inv||inv.status==='Đã hủy')return;
 openModal('Hủy hóa đơn '+esc(inv.id),'<div><label>Lý do hủy *</label><textarea id="cancelReason" class="field" rows="4" placeholder="Nhập lý do hủy..."></textarea></div>','<button class="btn btn-secondary" onclick="closeModal()">Không</button><button class="btn btn-danger" onclick="cancelInvoice(\''+esc(inv.id)+'\')">Xác nhận hủy</button>');
}
function cancelInvoice(id){
 if(!hasPermission('Hủy hóa đơn'))return alert('Bạn không có quyền hủy hóa đơn.');
 const inv=state.invoices.find(x=>x.id===id),reason=document.getElementById('cancelReason')?.value.trim();
 if(!inv||!reason)return alert('Vui lòng nhập lý do hủy.');
 if(inv.status==='Đã hủy')return alert('Hóa đơn đã hủy.');
 if(!requiresApproval('Hủy hóa đơn',{amount:Number(inv.total||0),details:reason}))return alert('Hủy hóa đơn cần được phê duyệt.');
 if(isTransactionClosed(inv))return alert('Hóa đơn thuộc ca đã chốt, không thể hủy.');
 const shift=requireOpenShift('hủy hóa đơn');if(!shift)return;
 const refund=Math.max(0,Number(inv.paid||0));
 const items=getInvoiceItems(inv);
 items.forEach(x=>{const p=state.products.find(z=>z.code===x.code);if(p&&typeof p.stock==='number')p.stock+=Number(x.qty||0);});
 (state.therapyCards||[]).filter(x=>x.invoiceId===inv.id).forEach(x=>{x.status='Đã hủy';x.cancelledAt=new Date().toISOString();x.remainingSessions=0;(x.usageHistory||[]).filter(u=>u.status==='Đã thực hiện').forEach(u=>{restoreMaterialUsage(u.id);(state.serviceCommissions||[]).filter(cm=>cm.usageId===u.id&&!cm.reversed).forEach(cm=>{cm.status='Đã hoàn tác';cm.reversed=true;});});});
 (state.serviceCommissions||[]).filter(x=>x.invoiceId===inv.id).forEach(x=>{x.status='Đã hủy';x.cancelledAt=new Date().toISOString();x.amount=0;});
 if(refund>0){
  const parts=Array.isArray(inv.paymentBreakdown)&&inv.paymentBreakdown.length?inv.paymentBreakdown.filter(p=>(p.source||'sale')==='sale'&&Number(p.amount)>0):[{method:inv.paymentMethod||'Tiền mặt',amount:refund}];
  const partTotal=parts.reduce((s,p)=>s+Number(p.amount||0),0);
  parts.forEach(p=>addCashMovement({type:'chi',amount:partTotal>0?refund*(Number(p.amount||0)/partTotal):refund,paymentMethod:p.method,subject:inv.customerName||inv.customer||'',referenceId:inv.id,note:'Hoàn tiền do hủy hóa đơn '+inv.id}));
}
 inv.paid=0;inv.status='Đã hủy';inv.cancelReason=reason;inv.cancelledAt=new Date().toISOString();inv.cancelledBy=state.currentUser?.username||'';inv.cancelRefundAmount=refund;inv.cancelledShiftId=shift.id;
 saveState();closeModal();applyInvoiceFilters();alert(refund>0?'Đã hủy hóa đơn, hoàn kho và hoàn tiền.':'Đã hủy hóa đơn và hoàn kho.');
}
function openCollectDebt(id){
 if(!hasPermission('Xem thanh toán'))return alert('Bạn không có quyền thu nợ.');
 const inv=state.invoices.find(x=>x.id===id);if(!inv)return;
 const debt=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
 if(debt<=0)return alert('Hóa đơn không còn nợ.');
 openModal('Thu nợ '+esc(inv.id),'<div class="form-grid"><div><label>Còn nợ</label><input class="field" readonly value="'+money(debt)+' ₫"></div><div><label>Phương thức</label><select id="debtMethod" class="field">'+paymentOptions('Tiền mặt')+'</select></div><div class="full"><label>Số tiền thu *</label><input id="debtAmount" class="field" type="number" min="0.01" max="'+debt+'" step="0.01" value="'+debt+'"></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="collectDebt(\''+esc(id)+'\')">Thu nợ</button>');
}
function collectDebt(id){
 if(!hasPermission('Xem thanh toán'))return alert('Bạn không có quyền thu nợ.');
 const shift=requireOpenShift('thu nợ');if(!shift)return;
 const inv=state.invoices.find(x=>x.id===id),amount=Number(document.getElementById('debtAmount')?.value)||0,method=normalizePaymentMethod(document.getElementById('debtMethod')?.value||'Tiền mặt');
 if(!inv||inv.status==='Đã hủy')return;
 const debt=Math.max(0,Number(inv.total||0)-Number(inv.paid||0)-invoiceReturnedAmount(inv));
 if(amount<=0||amount>debt)return alert('Số tiền thu không hợp lệ.');
 if(inv.customerCode==='KH000001')return alert('Khách lẻ không được ghi nợ.');
 inv.paid=Number(inv.paid||0)+amount;inv.paymentMethod=method;inv.payment=method;
 inv.paymentBreakdown=Array.isArray(inv.paymentBreakdown)?inv.paymentBreakdown:[];inv.paymentBreakdown.push({method,amount,source:'debt'});
 inv.status=inv.paid>=Math.max(0,Number(inv.total||0)-invoiceReturnedAmount(inv))?'Đã thanh toán':'Còn nợ';
 inv.debtHistory=Array.isArray(inv.debtHistory)?inv.debtHistory:[];inv.debtHistory.push({amount,method,createdAt:new Date().toISOString(),employee:state.currentUser?.name||'',shiftId:shift.id});
 addCashMovement({type:'thu',amount,paymentMethod:method,subject:inv.customerName||inv.customer||'',referenceId:inv.id,note:'Thu nợ hóa đơn '+inv.id});
 saveState();closeModal();applyInvoiceFilters();alert('Đã thu nợ '+money(amount)+' ₫.');
}
function exportInvoicesExcel(){
 if(!hasPermission('Xuất Excel'))return alert('Bạn không có quyền xuất Excel.');
 const rows=dashboardInvoices(document.querySelector('.invoice-filter')?.value||'today');
 const head=['Mã hóa đơn','Thời gian','Khách hàng','SĐT','Tổng tiền hàng','Giảm giá','Tổng','VAT','Đã trả','Còn nợ','Trạng thái','Phương thức'];
 const csv=[head,...rows.map(x=>[x.id,x.time,x.customerName||x.customer,x.phone,x.amount,x.discount,x.total,x.tax,x.paid,Math.max(0,(x.total||0)-(x.paid||0)),x.status,x.paymentMethod])];
 const blob=new Blob(['\ufeff'+csv.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoa-don-'+localDateKey(new Date())+'.csv';a.click();URL.revokeObjectURL(a.href);
}

   const hist=purchases.filter(i=>i.customerCode===x.code||i.customerName===x.name);
   const spent=hist.reduce((a,i)=>a+Number(i.total||0),0);
   const debt=hist.reduce((a,i)=>a+Math.max(0,Number(i.total||0)-Number(i.paid||0)),0);
   const type=hist.length?'Khách hàng cũ':'Khách hàng mới';

function saveCustomer(code){
 const existing=state.customers.find(x=>x.code===code);
 if(existing&&!hasPermission('Sửa khách hàng'))return alert('Bạn không có quyền sửa khách hàng.');
 if(!existing&&!hasPermission('Thêm khách hàng'))return alert('Bạn không có quyền thêm khách hàng.');
 const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),taxCode=document.getElementById('customerTaxCode')?.value.trim()||'';
 if(taxCode&&!/^\d{10}(\d{3})?$/.test(taxCode))return alert('Mã số thuế phải gồm 10 hoặc 13 chữ số.');
 if(!name)return alert('Vui lòng nhập Tên khách hàng.');
 if(phone&&state.customers.some(x=>x.phone===phone&&x.code!==code))return alert('Số điện thoại đã tồn tại.');
 const data={code,name,phone,dob:document.getElementById('customerDob').value,companyName:document.getElementById('customerCompanyName')?.value.trim()||'',taxCode,address:document.getElementById('customerAddress')?.value.trim()||'',email:document.getElementById('customerEmail')?.value.trim()||'',note:document.getElementById('customerNote').value.trim(),allergyNote:document.getElementById('customerAllergy').value.trim(),createdAt:existing?.createdAt||new Date().toISOString()};
 if(existing)Object.assign(existing,data);else state.customers.push({...data,debt:0});
 saveState();closeModal();customerPage(document.getElementById('content'));alert(existing?'Đã cập nhật khách hàng.':'Đã thêm khách hàng.');
}
function deleteCustomer(code){

}
function viewCustomer(code){
 const c=state.customers.find(x=>x.code===code);if(!c)return;
 const hist=state.invoices.filter(i=>(i.customerCode===code||i.customerName===c.name)&&i.status!=='Đã hủy');

function setTheme(theme){
  const themes={
    green:{primary:'#3b6f63',hover:'#2f5c52',soft:'#edf7f3'},
    blue:{primary:'#0875e5',hover:'#0664c4',soft:'#eff6ff'},
    purple:{primary:'#7c3aed',hover:'#6d28d9',soft:'#f5f3ff'},
    orange:{primary:'#ea580c',hover:'#c2410c',soft:'#fff7ed'}
  };
  const t=themes[theme]||themes.green;
  document.documentElement.style.setProperty('--primary',t.primary);
  document.documentElement.style.setProperty('--primary-hover',t.hover);
  document.documentElement.style.setProperty('--primary-soft',t.soft);
  localStorage.setItem('spa_pos_theme',theme);
  document.querySelectorAll('.theme-swatch').forEach(el=>{
    el.classList.toggle('active',el.dataset.theme===theme);
  });
}

function arDueAmount(inv){
 const total=Math.max(0,Number(inv?.total||0));
 const paid=Math.max(0,Number(inv?.paid||0));
 const returned=Math.max(0,invoiceReturnedAmount(inv));
 return Math.max(0,total-paid-returned);
}
function arDueDate(inv){
 return inv?.dueDate || inv?.createdAt || '';
}
function arAgeBucket(inv){
 const due=arDueDate(inv); if(!due)return 'Trong hạn';
 const d=new Date(due); if(Number.isNaN(d.getTime()))return 'Trong hạn';
 const diff=Math.floor((Date.now()-d.getTime())/86400000);
 if(diff<=0)return 'Trong hạn';
 if(diff<=30)return 'Quá 1–30 ngày';
 if(diff<=60)return '31–60 ngày';
 return 'Trên 60 ngày';
}

function getDashboardPeriodRange(period){
  const now=new Date();
  const start=new Date(now);
  const end=new Date(now);
  end.setHours(23,59,59,999);
  start.setHours(0,0,0,0);
  if(period==='yesterday'){
    start.setDate(start.getDate()-1); end.setDate(end.getDate()-1);
  }else if(period==='7days'){
    start.setDate(start.getDate()-6);
  }else if(period==='month'){
    start.setDate(1);
  }else if(period==='lastMonth'){
    start.setMonth(start.getMonth()-1,1); end.setMonth(end.getMonth(),0); end.setHours(23,59,59,999);
  }else if(period==='quarter'){
    start.setMonth(Math.floor(now.getMonth()/3)*3,1);
  }else if(period==='lastQuarter'){
    const q=Math.floor(now.getMonth()/3)-1;
    const year=now.getFullYear()+(q<0?-1:0);
    const normalized=(q+4)%4;
    start.setFullYear(year,normalized*3,1);
    end.setFullYear(year,normalized*3+3,0); end.setHours(23,59,59,999);
  }else if(period==='year'){
    start.setMonth(0,1);
  }
  return {start,end};
}

function dashboardInvoices(period){
  const range=getDashboardPeriodRange(period);
  return state.invoices.filter(x=>{
    const d=x.createdAt?new Date(x.createdAt):new Date();
    return d>=range.start && d<=range.end;
  });
}

function refreshDashboard(){
  const period=document.getElementById('dashboardPeriod')?.value||'today';
  const rows=dashboardInvoices(period);
  const validSales=rows.filter(x=>(x.type||'Thu')==='Thu'&&x.status!=='Đã hủy');
  const returns=(state.returns||[]).filter(r=>{const d=new Date(r.createdAt||0),range=getDashboardPeriodRange(period);return d>=range.start&&d<=range.end&&r.status!=='Đã hủy';});
  const returnedAmount=returns.reduce((a,r)=>a+Number(r.refundAmount||r.amount||0),0);
  const revenue=validSales.reduce((a,x)=>a+Number(x.total||0),0)-returnedAmount;
  const cash=(state.cashbook||[]).filter(x=>{const d=new Date(x.createdAt||0);const range=getDashboardPeriodRange(period);return d>=range.start&&d<=range.end;});
  const legacyIncome=validSales.filter(x=>!hasCashMovement(x.id,'thu')).reduce((a,x)=>a+Number(x.paid||0),0);
  const legacyExpense=rows.filter(x=>(x.type||'')==='Chi'&&!hasCashMovement(x.id,'chi')).reduce((a,x)=>a+Number(x.total||0),0);
  const income=cash.filter(x=>x.type==='thu').reduce((a,x)=>a+Number(x.amount||0),0)+legacyIncome;
  const expense=cash.filter(x=>x.type==='chi').reduce((a,x)=>a+Number(x.amount||0),0)+legacyExpense;
  const debt=validSales.reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.paid||0)-invoiceReturnedAmount(x)),0);
  document.getElementById('dashboardRevenue').innerText=money(revenue)+' ₫';
  const paymentRevenue=(method)=>validSales.reduce((sum,x)=>{if(Array.isArray(x.paymentBreakdown)&&x.paymentBreakdown.length)return sum+x.paymentBreakdown.filter(p=>(p.source||'sale')==='sale'&&normalizePaymentMethod(p.method)===method).reduce((a,p)=>a+Number(p.amount||0),0);return sum+(!hasCashMovement(x.id,'thu')&&normalizePaymentMethod(x.paymentMethod)===method?Number(x.paid||0):0);},0);
  document.getElementById('cashRevenue').innerText=money(paymentRevenue('Tiền mặt'))+' ₫';
  document.getElementById('bankRevenue').innerText=money(paymentRevenue('Chuyển khoản'))+' ₫';
  document.getElementById('ewalletRevenue').innerText=money(paymentRevenue('Ví điện tử'))+' ₫';
  document.getElementById('otherRevenue').innerText=money(paymentRevenue('Thẻ'))+' ₫';
  document.getElementById('dashboardInvoices').innerText=rows.filter(x=>x.status!=='Đã hủy').length;
  const customerRows=validSales.filter(x=>x.customerCode);
  const uniqueCustomers=new Map();customerRows.forEach(x=>{if(!uniqueCustomers.has(x.customerCode))uniqueCustomers.set(x.customerCode,x);});
  document.getElementById('dashboardCustomers').innerText=uniqueCustomers.size+' khách';
  let oldCount=0,newCount=0;uniqueCustomers.forEach((x,code)=>{const hadPrior=(state.invoices||[]).some(i=>i!==x&&i.status!=='Đã hủy'&&(i.type||'Thu')==='Thu'&&i.customerCode===code);if(hadPrior)oldCount++;else newCount++;});
  document.getElementById('oldCustomers').innerText=oldCount;document.getElementById('newCustomers').innerText=newCount;
  document.getElementById('dashboardDebt').innerText=money(debt)+' ₫';
  document.getElementById('totalIncome').innerText=money(income)+' ₫';
  document.getElementById('totalExpense').innerText=money(expense)+' ₫';
  if(document.getElementById('chartPeriod'))document.getElementById('chartPeriod').value=period;
  if(document.getElementById('pivotPeriod'))document.getElementById('pivotPeriod').value=period;
  refreshDashboardCharts();
}
function getChartBuckets(period,granularity){
  const rows=dashboardInvoices(period), range=getDashboardPeriodRange(period);
  let labels=[],values=[],customers=[];
  if(granularity==='hour'){
    labels=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+'h');
    values=Array(24).fill(0); customers=Array(24).fill(0);
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;values[d.getHours()]+=Number(x.total||0);customers[d.getHours()]+=1;});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=d.getHours();values[idx]-=Number(r.refundAmount||r.amount||0);});
  }else if(granularity==='weekday'){
    labels=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
    values=Array(7).fill(0); customers=Array(7).fill(0);
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]+=Number(x.total||0);customers[idx]+=1;});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=(d.getDay()+6)%7;values[idx]-=Number(r.refundAmount||r.amount||0);});
  }else{
    const cursor=new Date(range.start), end=new Date(range.end), map=new Map();
    while(cursor<=end){
      const key=localDateKey(cursor);
      labels.push(cursor.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}));map.set(key,labels.length-1);
      values.push(0);customers.push(0);cursor.setDate(cursor.getDate()+1);
    }
    rows.filter(x=>x.status!=='Đã hủy').forEach(x=>{const d=x.createdAt?new Date(x.createdAt):null;if(!d)return;const idx=map.get(localDateKey(d));if(idx!==undefined){values[idx]+=Number(x.total||0);customers[idx]+=1;}});
    (state.returns||[]).forEach(r=>{const d=r.createdAt?new Date(r.createdAt):null;if(!d)return;const idx=map.get(localDateKey(d));if(idx!==undefined)values[idx]-=Number(r.refundAmount||r.amount||0);});
  }
  return {labels,values,customers};
}
function drawChart(canvasId,emptyId,type,data){
  const canvas=document.getElementById(canvasId),empty=document.getElementById(emptyId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,width=canvas.clientWidth||700,height=260;
  canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const hasData=data.values.some(v=>v>0);if(empty)empty.style.display=hasData?'none':'flex';
  const pad={left:58,right:18,top:18,bottom:40},chartW=Math.max(10,width-pad.left-pad.right),chartH=height-pad.top-pad.bottom;
  const max=Math.max(1,...data.values),steps=4;
  ctx.font='12px Arial';ctx.fillStyle='#7b8490';ctx.strokeStyle='#e7ebf0';ctx.lineWidth=1;
  for(let i=0;i<=steps;i++){const y=pad.top+chartH-(chartH*i/steps);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(width-pad.right,y);ctx.stroke();ctx.fillText(money(Math.round(max*i/steps)),6,y+4);}
  ctx.strokeStyle='#cfd5dd';ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(width-pad.right,pad.top+chartH);ctx.stroke();
  const step=chartW/Math.max(1,data.labels.length),yFor=v=>pad.top+chartH-(v/max)*chartH;
  if(type==='bar'){
    const barW=Math.max(2,step*0.62);data.values.forEach((v,i)=>{const x=pad.left+i*step+(step-barW)/2,y=yFor(v);ctx.fillStyle='#0b78e3';ctx.fillRect(x,y,barW,pad.top+chartH-y);});
  }else{
    ctx.strokeStyle='#0b78e3';ctx.lineWidth=3;ctx.beginPath();
    data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
    ctx.fillStyle='#0b78e3';data.values.forEach((v,i)=>{const x=pad.left+i*step+step/2,y=yFor(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();});
  }
  const labelEvery=data.labels.length>24?Math.ceil(data.labels.length/12):data.labels.length>12?2:1;
  ctx.fillStyle='#68717d';ctx.font='11px Arial';
  data.labels.forEach((label,i)=>{if(i%labelEvery!==0)return;const x=pad.left+i*step+step/2;ctx.save();ctx.translate(x,height-12);ctx.rotate(-0.35);ctx.textAlign='right';ctx.fillText(label,0,0);ctx.restore();});
}

function refreshDashboardCharts(){
  const period=document.getElementById('chartPeriod')?.value||'today';
  const granularity=document.getElementById('chartGranularity')?.value||'day';
  const data=getChartBuckets(period,granularity);
  drawChart('barChart','barEmpty','bar',data);drawChart('lineChart','lineEmpty','line',{labels:data.labels,values:data.customers});
  const rows=dashboardInvoices(period);
  const revenue=rows.filter(x=>(x.type||'Thu')==='Thu'&&x.status!=='Đã hủy').reduce((a,x)=>a+Number(x.total||0),0)-(state.returns||[]).filter(r=>{const d=new Date(r.createdAt||0),range=getDashboardPeriodRange(period);return r.status!=='Đã hủy'&&d>=range.start&&d<=range.end;}).reduce((a,r)=>a+Number(r.refundAmount||r.amount||0),0);
  const range=getDashboardPeriodRange(period);const returnCount=(state.returns||[]).filter(r=>{const d=new Date(r.createdAt||0);return r.status!=='Đã hủy'&&d>=range.start&&d<=range.end;}).length;
  if(document.getElementById('chartRevenue'))document.getElementById('chartRevenue').innerText=money(revenue)+' ₫';
  if(document.getElementById('chartInvoiceCount'))document.getElementById('chartInvoiceCount').innerText=rows.filter(x=>x.status!=='Đã hủy').length;
  if(document.getElementById('chartReturnCount'))document.getElementById('chartReturnCount').innerText=returnCount;
}

function returnableQty(invoice,code){

 return Math.max(0,sold-returned);
}

function loadReturnItems(){
 const inv=state.invoices.find(x=>x.id===document.getElementById('returnInvoice')?.value),box=document.getElementById('returnItems');if(!box)return;
 if(!inv){box.innerHTML='<div class="empty">Chọn hóa đơn để xem sản phẩm có thể trả.</div>';return;}
 box.innerHTML='<div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>SL đã mua</th><th>SL có thể trả</th><th>SL trả</th><th>Đơn giá</th><th>Hoàn tiền</th></tr></thead><tbody>'+getInvoiceItems(inv).map((x,i)=>{const max=returnableQty(inv,x.code);return '<tr><td>'+esc(x.name)+'<br><small>'+esc(x.code)+'</small></td><td>'+x.qty+'</td><td>'+max+'</td><td><input class="field return-qty" data-code="'+esc(x.code)+'" data-max="'+max+'" data-price="'+Number(x.price||0)+'" data-discount="'+Number(x.discount||0)+'" type="number" min="0" max="'+max+'" value="0" step="1"></td><td>'+money(x.price||0)+' ₫</td><td class="return-line-total">0 ₫</td></tr>';}).join('')+'</tbody></table></div>';
 box.querySelectorAll('.return-qty').forEach(el=>el.addEventListener('input',updateReturnTotals));
}
function updateReturnTotals(){
 let total=0;
 document.querySelectorAll('.return-qty').forEach(el=>{const q=Math.min(Math.max(0,Number(el.value)||0),Number(el.dataset.max)||0);el.value=q;const lineGross=q*Number(el.dataset.price||0);const max=Number(el.dataset.max)||0;const lineDiscount=max>0?Math.min(Number(el.dataset.discount||0),Number(el.dataset.price||0)*max)*(q/max):0;const line=Math.max(0,lineGross-lineDiscount);total+=line;const cell=el.closest('tr')?.querySelector('.return-line-total');if(cell)cell.textContent=money(line)+' ₫';});
}
function saveReturn(){
 if(!hasPermission('Tạo trả hàng'))return alert('Bạn không có quyền tạo trả hàng.');
 const shift=requireOpenShift('trả hàng');if(!shift)return;
 const inv=state.invoices.find(x=>x.id===document.getElementById('returnInvoice')?.value);
 if(!inv)return alert('Vui lòng chọn hóa đơn gốc.');
 if(inv.status==='Đã hủy')return alert('Hóa đơn đã hủy không thể trả hàng.');
 if(Number(inv.paid||0)<=0)return alert('Hóa đơn chưa thanh toán nên chưa thể hoàn tiền.');
 if(isTransactionClosed(inv))return alert('Hóa đơn thuộc ca đã chốt, không thể tạo trả hàng.');
 const sold=getInvoiceItems(inv);
 const lineBase=sold.map(x=>({code:x.code,qty:Number(x.qty)||0,price:Number(x.price)||0,discount:Number(x.discount)||0}));
 const totalLineNet=lineBase.reduce((s,x)=>s+Math.max(0,x.qty*x.price-x.discount),0);
 const orderDiscount=Math.max(0,Number(inv.discount||0)-lineBase.reduce((s,x)=>s+Number(x.discount||0),0));
 const rows=[...document.querySelectorAll('.return-qty')];
 const items=rows.map(el=>{
   const q=Math.min(Math.max(0,Number(el.value)||0),Number(el.dataset.max)||0);
   const max=Number(el.dataset.max)||0,price=Number(el.dataset.price)||0,discount=Number(el.dataset.discount)||0;
   const original=sold.find(x=>x.code===el.dataset.code)||{};
   const p=state.products.find(x=>x.code===el.dataset.code);
   const isPackage=p?.type==='Gói dịch vụ, liệu trình';
   const lineGross=q*price;
   const lineDiscount=max>0?Math.min(discount,lineGross)*(q/max):0;
   const vatRate=Math.max(0,Number(original.vat??original.taxRate??inv.vat??0));
   const lineNet=Math.max(0,lineGross-lineDiscount);
   const orderDisc=totalLineNet>0?orderDiscount*(lineNet/totalLineNet):0;
   const netExVat=Math.max(0,lineNet-orderDisc);
   const vatAmount=vatRate>0?Math.round(netExVat-(netExVat/(1+vatRate/100))):0;
   return {code:el.dataset.code,qty:q,price,discount:lineDiscount,vat:vatRate,vatRate,amountExVat:Math.max(0,netExVat-vatAmount),vatAmount,refund:netExVat,isPackage};
 }).filter(x=>x.qty>0);
 if(!items.length)return alert('Vui lòng chọn ít nhất một sản phẩm để trả.');

 const packagePlans=[];
 for(const item of items.filter(x=>x.isPackage)){
   const card=(state.therapyCards||[]).find(c=>c.invoiceId===inv.id&&c.productCode===item.code&&c.status!=='Đã hủy'&&Number(c.remainingSessions||0)>0);
   if(!card)return alert('Không tìm thấy thẻ liệu trình còn buổi tương ứng với gói trên hóa đơn. Không thể hoàn tiền gói.');
   const refund=Math.round(Math.max(0,Number(card.remainingSessions||0)*Number(card.sessionValue||0)));
   if(refund<=0)return alert('Thẻ gói không còn số dư để hoàn.');
   packagePlans.push({item,card,refund});
   item.packageRefund=refund;
   item.amountExVat=refund;
   item.vatAmount=Math.round(refund*(Number(card.vatRate)||0)/100);
   item.refund=refund+item.vatAmount;
 }

 let amount=0;
 items.forEach(x=>{ amount+=x.isPackage?Number(x.packageRefund||0)+Number(x.vatAmount||0):Math.max(0,Number(x.refund||0)); });
 if(amount<=0)return alert('Số tiền hoàn không hợp lệ.');

 const alreadyReturned=invoiceReturnedAmount(inv);
 const maxRefund=invoicePaymentTotal(inv);
 if(alreadyReturned+amount>maxRefund+0.000001)return alert('Tổng tiền hoàn vượt quá số tiền khách thực trả.');

 const method=normalizePaymentMethod(document.getElementById('returnMethod').value);
 const retId=nextAutoCode('TH',6,'spa_next_return_id',state.returns||[],'id');
 const ret={id:retId,invoiceId:inv.id,customerCode:inv.customerCode||'',customerName:inv.customerName||inv.customer||'',items,amount,type:'Chi',status:'Đã hoàn tiền',refundAmount:amount,paymentMethod:method,note:document.getElementById('returnNote').value.trim(),createdAt:new Date().toISOString(),createdBy:state.currentUser?.id||'',shiftId:shift.id,packageReturns:packagePlans.map(x=>({therapyCardId:x.card.id,refundAmount:x.refund,remainingSessions:x.card.remainingSessions}))};

 packagePlans.forEach(plan=>{
   const card=plan.card;
   (state.serviceCommissions||[]).filter(x=>x.therapyCardId===card.id&&!x.reversed).forEach(x=>{x.status='Đã hoàn tác do trả gói';x.reversed=true;x.reversedAt=new Date().toISOString();});
   card.remainingSessions=0;
   card.status='Đã hủy';
   card.canceledAt=new Date().toISOString();
   card.cancelReason='Trả gói - hoàn giá trị các buổi chưa dùng';
   card.unearnedRevenue=0;
   card.returnedAt=retId;
   card.returnedRefundAmount=plan.refund;
   card.revenueLedger=Array.isArray(card.revenueLedger)?card.revenueLedger:[];
   card.revenueLedger.push({id:nextAutoCode('DT',6,'spa_next_revenue_transfer_id',card.revenueLedger,'id'),type:'cancel',amount:plan.refund,reason:'Trả gói - hoàn số dư chưa thực hiện',createdAt:new Date().toISOString(),returnId:retId});
 });

 const originalHasEInvoice=['Đã cấp mã','Đã điều chỉnh','Đã thay thế'].includes(inv.eInvoiceStatus);
 if(originalHasEInvoice){
   const returnedExVat=items.reduce((sum,x)=>sum+Number(x.amountExVat||0),0);
   const returnedVat=items.reduce((sum,x)=>sum+Number(x.vatAmount||0),0);
   createInvoice({
     type:'Điều chỉnh giảm',customer:inv.customer,customerCode:inv.customerCode,customerName:inv.customerName,customerType:inv.customerType,phone:inv.phone,
     productCode:items[0]?.code||'',productName:items.map(x=>x.code).join(', '),
     amount:-returnedExVat,discount:0,total:-(returnedExVat+returnedVat),tax:-returnedVat,paid:0,paymentMethod:inv.paymentMethod,
     paymentBreakdown:[],employeeId:inv.employeeId,employeeName:inv.employeeName,consultantId:inv.consultantId,consultantName:inv.consultantName,
     status:'Đã điều chỉnh',items:items.map(x=>({...x,qty:-x.qty,amountExVat:-Number(x.amountExVat||0),vatAmount:-Number(x.vatAmount||0),refund:-Number(x.refund||0)})),
     originalInvoiceId:inv.originalInvoiceId||inv.id,relatedInvoiceId:inv.id,eInvoiceStatus:'Đã điều chỉnh',
     eInvoiceReason:'Điều chỉnh giảm do trả hàng '+retId
   });
 }

 state.returns=Array.isArray(state.returns)?state.returns:[];state.returns.push(ret);
 items.forEach(x=>{if(x.isPackage)return;const p=state.products.find(p=>p.code===x.code);if(p&&typeof p.stock==='number')p.stock+=x.qty;});
 inv.paid=Math.max(0,Number(inv.paid||0)-amount);
 const effectiveTotal=Math.max(0,Number(inv.total||0)-alreadyReturned-amount);
 inv.status=inv.paid>=effectiveTotal?'Đã thanh toán':'Còn nợ';
 addCashMovement({type:'chi',amount,paymentMethod:method,subject:inv.customerName||inv.customer||'',referenceId:ret.id,note:'Hoàn tiền trả hàng '+ret.id+' từ '+inv.id});
 saveState();closeModal();returnPage(document.getElementById('content'));alert('Đã tạo phiếu trả hàng '+ret.id+' và hoàn tiền '+money(amount)+' ₫.');
}

 const rows=(state.returns||[]).slice().reverse().map(r=>'<tr><td><b>'+esc(r.id)+'</b></td><td>'+esc(r.invoiceId)+'</td><td>'+esc(r.createdAt?new Date(r.createdAt).toLocaleString('vi-VN'):'')+'</td><td>'+esc(r.customerName||'')+'</td><td>'+money(r.amount||0)+' ₫</td><td>'+esc(r.paymentMethod||'')+'</td><td>'+esc(r.status||'')+'</td></tr>').join('');

 openModal('Tạo hóa đơn',`

  <div><label>Số lượng</label><input id="qty" class="field" type="number" value="1" min="1" max="9999"></div>

 ['qty','rate','discount','invoicePaid'].forEach(id=>document.getElementById(id)?.addEventListener('input',calcInvoice));

function calcInvoice(){
 const q=Number(document.getElementById('qty').value)||0,r=Number(document.getElementById('rate').value)||0,d=Number(document.getElementById('discount').value)||0;
 const amount=q*r;const grand=Math.max(0,amount-d);const product=state.products[Number(document.getElementById('productSelect').value)||0];const vat=Number(product?.vat)||0;const tax=vat>0?grand-(grand/(1+vat/100)):0;
 document.getElementById('sum').innerText=money(amount)+' ₫';document.getElementById('tax').innerText=money(tax)+' ₫';document.getElementById('grand').innerText=money(grand)+' ₫';
}
function getRevenueRecognitionConfig(){state.revenueRecognitionConfig=state.revenueRecognitionConfig||{expiredAction:'defer',expiredReason:'Chưa xử lý số dư thẻ hết hạn'};return state.revenueRecognitionConfig;}
function packageValueExVatFromInvoiceItem(item,product){const qty=Math.max(1,Number(item?.qty)||1),grossIncl=Math.max(0,(Number(item?.price)||0)*qty-Math.max(0,Number(item?.discount)||0)),rate=Math.max(0,Number(item?.vat??product?.vat)||0);return rate>0?grossIncl/(1+rate/100):grossIncl;}
function recognizeTherapyRevenue(card,amount,type,reason){const value=Math.max(0,Number(amount)||0);if(!value)return;card.revenueLedger=Array.isArray(card.revenueLedger)?card.revenueLedger:[];card.revenueLedger.push({id:nextAutoCode('DT',6,'spa_next_revenue_transfer_id',card.revenueLedger,'id'),type,amount:value,reason:reason||'',createdAt:new Date().toISOString()});card.realizedRevenue=Math.max(0,Number(card.realizedRevenue)||0)+(type==='realize'?value:-value);card.unearnedRevenue=Math.max(0,Number(card.unearnedRevenue)||0)+(type==='realize'?-value:value);}
function syncExpiredTherapyCards(){const today=localDateKey(new Date()),cfg=getRevenueRecognitionConfig();(state.therapyCards||[]).forEach(card=>{if(card.expiresAt&&card.expiresAt<today&&card.status!=='Đã xử lý hết hạn'&&Number(card.remainingSessions)>0){if(cfg.expiredAction==='recognize'){const amount=Number(card.remainingSessions||0)*Number(card.sessionValue||0);recognizeTherapyRevenue(card,amount,'realize','Thẻ hết hạn - ghi nhận số dư theo cấu hình');card.remainingSessions=0;card.status='Đã xử lý hết hạn';card.expiredProcessedAt=new Date().toISOString();}else{card.status='Hết hạn - giữ số dư';card.expiredReason=cfg.expiredReason||'Thẻ hết hạn - giữ lại số dư';}}});}
function unearnedRevenueSummary(){syncExpiredTherapyCards();let unearned=0,realized=0;(state.therapyCards||[]).forEach(card=>{if(card.status==='Hết hạn - giữ số dư')return;unearned+=Math.max(0,Number(card.remainingSessions||0)*Number(card.sessionValue||0));realized+=Math.max(0,Number(card.realizedRevenue)||0);});return {unearned:Math.round(unearned),realized:Math.round(realized)};}
function createTherapyCardFromInvoice(invoice){const packageItems=(invoice.items||[]).filter(it=>{const p=state.products.find(x=>x.code===it.code);return p&&p.type==='Gói dịch vụ, liệu trình';});if(!packageItems.length)return [];state.therapyCards=Array.isArray(state.therapyCards)?state.therapyCards:[];const created=[];packageItems.forEach(it=>{const p=state.products.find(x=>x.code===it.code),sessions=getPackageSessions(p)*Math.max(1,Number(it.qty)||1),packageExVat=packageValueExVatFromInvoiceItem(it,p),sessionValue=sessions>0?packageExVat/sessions:getPackageSessionValue(p),card={id:nextAutoCode('LT',6,'spa_next_therapy_id',state.therapyCards,'id'),invoiceId:invoice.id,customerCode:invoice.customerCode,customerName:invoice.customerName||invoice.customer,productCode:it.code,productName:it.name,totalSessions:sessions,remainingSessions:sessions,sessionValue,unearnedRevenue:packageExVat,realizedRevenue:0,revenueLedger:[],expiresAt:packageExpiryDate(p),status:'Đang sử dụng',createdAt:new Date().toISOString(),createdBy:state.currentUser?.id||''};card.revenueLedger.push({id:nextAutoCode('DT',6,'spa_next_revenue_transfer_id',[],'id'),type:'defer',amount:packageExVat,reason:'Bán gói - ghi nhận doanh thu chưa thực hiện',createdAt:new Date().toISOString()});state.therapyCards.push(card);created.push(card);});return created;}

function invoiceRevenueFields(data){
 const items=Array.isArray(data?.items)?data.items:[];
 let grossExVat=0,vatAmount=0;
 items.forEach(x=>{
  const gross=Math.max(0,(Number(x.price)||0)*(Number(x.qty)||0));
  const discount=Math.min(Math.max(0,Number(x.discount)||0),gross);
  const net=Math.max(0,gross-discount);
  const rate=Math.max(0,Number(x.vat)||0);
  if(rate>0){grossExVat+=net/(1+rate/100);vatAmount+=net-grossExVat;}
  else grossExVat+=net;
 });
 // Trường hợp chứng từ cũ không có items: amount được coi là tổng tiền hàng trước VAT.
 if(!items.length){
   const total=Number(data?.total)||0, tax=Number(data?.tax)||0;
   grossExVat=Math.max(0,Number(data?.amount)||Math.max(0,total-tax));
   vatAmount=Math.max(0,tax);
 }
 const commercialDiscount=Math.max(0,Number(data?.commercialDiscount)||0);
 const discountAmount=Math.max(0,Number(data?.discount)||0);
 const otherDeduction=Math.max(0,Number(data?.otherDeduction)||0);
 const netRevenue=Math.max(0,grossExVat-commercialDiscount-discountAmount-otherDeduction);
 return {merchandiseAmountExVat:Math.round(grossExVat),vatAmount:Math.round(vatAmount),commercialDiscount:Math.round(commercialDiscount),discountAmount:Math.round(discountAmount),otherDeduction:Math.round(otherDeduction),returnedAmountExVat:0,netRevenue:Math.round(netRevenue)};
}
function invoiceNetRevenue(inv){
 if(!inv||inv.status==='Đã hủy')return 0;
 if(Number.isFinite(Number(inv.netRevenue)))return Math.max(0,Number(inv.netRevenue)-Number(inv.returnedAmountExVat||0));
 const f=invoiceRevenueFields(inv);
 return Math.max(0,f.netRevenue);
}
function reportNetRevenue(invoices){
 return (invoices||[]).filter(x=>(x.type||'Thu')==='Thu'&&x.status!=='Đã hủy').reduce((sum,x)=>sum+invoiceNetRevenue(x),0);
}
function createInvoice(data){
 const now=new Date();
 const invoiceId=nextAutoCode('HD',6,'spa_next_invoice_id',state.invoices,'id');
 const total=Number(data.total)||0;
 const tax=Number.isFinite(Number(data.tax))?Number(data.tax):0;
 const paymentMethod=normalizePaymentMethod(data.paymentMethod);
 const paid=Number(data.paid ?? total);
 const status=data.status|| (data.cancelled ? 'Đã hủy' : paid>=total ? 'Đã thanh toán' : paid>0 ? 'Còn nợ' : 'Còn nợ');
 const invoice={
   id:invoiceId,
   createdAt:now.toISOString(),
   time:now.toLocaleString('vi-VN'),
   branch:data.branch||'Chi nhánh chính',
   type:data.type||'Thu',
   customer:data.customer||'Khách lẻ',
   customerCode:data.customerCode||'',
   customerName:data.customerName||data.customer||'Khách lẻ',
   customerType:data.customerType||'',
   phone:data.phone||'',
   productCode:data.productCode||'',
   productName:data.productName||'',
   amount:Number(data.amount)||total,
   discount:Number(data.discount)||0,
   total,
   tax,
   vat:Number(data.vat??data.taxRate??10),
   paid,
   paymentMethod,
   payment:paymentMethod,
   paymentBreakdown:Array.isArray(data.paymentBreakdown)?data.paymentBreakdown:[],
   employeeId:data.employeeId||'',employeeName:data.employeeName||'',consultantId:data.consultantId||'',consultantName:data.consultantName||'',dueDate:data.dueDate||'',
   items:Array.isArray(data.items)?data.items:[],
   merchandiseAmountExVat:revenueFields.merchandiseAmountExVat,
   vatAmount:revenueFields.vatAmount,
   commercialDiscount:revenueFields.commercialDiscount,
   discountAmount:revenueFields.discountAmount,
   otherDeduction:revenueFields.otherDeduction,
   returnedAmountExVat:revenueFields.returnedAmountExVat,
   netRevenue:revenueFields.netRevenue,
   status:data.status||status,
   sellerSnapshot:data.sellerSnapshot||(hasSellerProfile()?{...state.sellerProfile}:null),
   eInvoiceStatus:data.eInvoiceStatus||'Chưa xuất',eInvoiceNumber:data.eInvoiceNumber||'',taxAuthorityCode:data.taxAuthorityCode||'',eInvoiceIssuedAt:data.eInvoiceIssuedAt||'',
 };
 state.invoices.unshift(invoice);
 saveState();
 return invoice;
}
function multiLineTotals(){
 const rows=[...document.querySelectorAll('.invoice-line-row')];
 let amount=0,discount=0,tax=0;
 rows.forEach(r=>{
  const p=state.products[Number(r.querySelector('.line-product')?.value)];
  const qty=Math.max(0,Number(r.querySelector('.line-qty')?.value)||0);
  const price=Math.max(0,Number(r.querySelector('.line-rate')?.value)||0);
  const lineGross=qty*price;
  const lineDiscount=Math.min(Math.max(0,Number(r.querySelector('.line-discount')?.value)||0),lineGross);
  const lineTotal=Math.max(0,lineGross-lineDiscount);
  const vat=Number(p?.vat??10);
  amount+=lineGross;discount+=lineDiscount;tax+=vat>0?lineTotal-(lineTotal/(1+vat/100)):0;
 });
 return {amount,discount,total:Math.max(0,amount-discount),tax};
}
function refreshMultiLineTotals(){
 const t=multiLineTotals();
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=money(v)+' ₫';};
 set('multiAmount',t.amount);set('multiDiscount',t.discount);set('multiTotal',t.total);set('multiTax',t.tax);
 const paid=Math.max(0,Number(document.getElementById('multiPaid')?.value)||0);
 set('multiDebt',Math.max(0,t.total-paid));set('multiChange',Math.max(0,paid-t.total));
 const status=document.getElementById('multiPaymentStatus');
 if(status)status.textContent=paid>=t.total&&t.total>0?'Đã thanh toán':paid>0?'Còn nợ':'Chưa thanh toán';
}
function addInvoiceLineRow(){
 const wrap=document.getElementById('invoiceLines');if(!wrap)return;
 const row=document.createElement('div');row.className='invoice-line-row';row.style='display:grid;grid-template-columns:2fr .7fr 1fr .8fr auto;gap:7px;margin-bottom:7px';
 const opts=state.products.filter(p=>p.status!=='Ngừng kinh doanh').map((p,i)=>'<option value="'+state.products.indexOf(p)+'">'+esc(p.code)+' - '+esc(p.name)+' - '+money(p.price)+' ₫</option>').join('');
 row.innerHTML='<select class="field line-product">'+opts+'</select><input class="field line-qty" type="number" min="1" value="1"><input class="field line-rate" type="number" min="0" step="0.01" value="0"><input class="field line-discount" type="number" min="0" value="0"><button type="button" class="btn btn-secondary line-remove">×</button>';
 const product=row.querySelector('.line-product');
 const rate=row.querySelector('.line-rate');
 const qty=row.querySelector('.line-qty');
 const disc=row.querySelector('.line-discount');
 const sync=()=>{const p=state.products[Number(product.value)];if(p&&document.activeElement!==rate)rate.value=Number(p.price)||0;refreshMultiLineTotals();};
 product.addEventListener('change',sync);
 [qty,rate,disc].forEach(el=>el.addEventListener('input',refreshMultiLineTotals));
 row.querySelector('.line-remove').addEventListener('click',()=>{if(wrap.children.length>1)row.remove();refreshMultiLineTotals();});
 wrap.appendChild(row);
 sync();
}

 const employees=(state.accounts||[]).filter(a=>a.status==='Hoạt động').map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name||a.username)+'</option>').join('');
 openModal('Tạo hóa đơn nhiều dòng','<div class="form-grid"><div><label>Khách hàng</label><select id="multiCustomer" class="field">'+customers+'</select></div><div><label>Nhân viên thực hiện *</label><select id="multiEmployee" class="field"><option value="">-- Chọn nhân viên --</option>'+employees+'</select></div><div><label>Phương thức</label><select id="multiPay" class="field">'+paymentOptions('Tiền mặt')+'</select></div><div><label>Khách thanh toán</label><input id="multiPaid" class="field" type="number" min="0" value="0" oninput="refreshMultiLineTotals()"></div><div><label>Ngày hẹn trả nợ</label><input id="multiDueDate" class="field" type="date"></div><div class="full"><label>Sản phẩm</label><div id="invoiceLines"></div><button type="button" class="btn btn-secondary" onclick="addInvoiceLineRow()">＋ Thêm sản phẩm</button></div></div><div class="summary"><div class="summary-box"><div class="summary-row"><span>Tiền hàng</span><b id="multiAmount">0 ₫</b></div><div class="summary-row"><span>Giảm giá</span><b id="multiDiscount">0 ₫</b></div><div class="summary-row"><span>VAT</span><b id="multiTax">0 ₫</b></div><div class="summary-row"><span>Tổng</span><b id="multiTotal">0 ₫</b></div><div class="summary-row"><span>Tiền thừa</span><b id="multiChange">0 ₫</b></div><div class="summary-row"><span>Còn nợ</span><b id="multiDebt">0 ₫</b></div><div class="summary-row"><span>Trạng thái</span><b id="multiPaymentStatus">Chưa thanh toán</b></div></div></div>','<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveMultiLineInvoice()">Lưu hóa đơn</button>');

function saveMultiLineInvoice(){
 const shift=requireOpenShift('tạo hóa đơn');if(!shift)return;
 const rows=[...document.querySelectorAll('.invoice-line-row')];if(!rows.length)return;
 const employeeId=document.getElementById('multiEmployee')?.value;
 if(!employeeId)return alert('Vui lòng chọn nhân viên thực hiện.');
 const employee=(state.employees||[]).find(a=>a.id===employeeId);
 const items=rows.map(r=>{const p=state.products[Number(r.querySelector('.line-product').value)];const qty=Number(r.querySelector('.line-qty').value)||0,price=Number(r.querySelector('.line-rate').value)||0,discount=Number(r.querySelector('.line-discount').value)||0;return {code:p?.code||'',name:p?.name||'',qty,price,discount,vat:Number(p?.vat??10)};});
 if(items.some(x=>!x.code||x.qty<1||x.price<0||x.discount>x.qty*x.price))return alert('Dữ liệu sản phẩm không hợp lệ.');
 for(const x of items){const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number'&&p.stock<x.qty)return alert('Không đủ tồn kho cho '+p.name+'.');}
 const t=multiLineTotals(),paid=Math.max(0,Number(document.getElementById('multiPaid')?.value)||0);
 if(paid>t.total)return alert('Tiền thanh toán không được vượt quá tổng hóa đơn.');
 if(!validateDiscountApproval(t.discount,Math.max(0,t.amount),'Hóa đơn nhiều dòng'))return;
 const c=state.customers[Number(document.getElementById('multiCustomer').value)||0]||state.customers[0];
 if(paid<t.total&&c?.code==='KH000001')return alert('Không cho phép ghi nợ cho Khách lẻ. Vui lòng chọn khách hàng có thông tin.');
 if(paid<t.total&&!document.getElementById('multiDueDate')?.value)return alert('Ghi nợ phải có ngày hẹn trả.');
 const hasPriorPurchase=(state.invoices||[]).some(x=>x.status!=='Đã hủy'&&(x.type||'Thu')==='Thu'&&x.customerCode===c.code);
 items.forEach(x=>{const p=state.products.find(z=>z.code===x.code);if(typeof p?.stock==='number')p.stock-=x.qty;});
 const invoice=createInvoice({type:'Thu',customer:c.name,customerCode:c.code,customerName:c.name,customerType:hasPriorPurchase?'Cũ':'Mới',phone:c.phone||'',productCode:items[0].code,productName:items.map(x=>x.name).join(', '),amount:t.amount,discount:t.discount,total:t.total,tax:t.tax,paid,paymentMethod:normalizePaymentMethod(document.getElementById('multiPay').value),paymentBreakdown:paid>0?[{method:normalizePaymentMethod(document.getElementById('multiPay').value),amount:paid,source:'sale'}]:[],employeeId:employee.id,employeeName:employee.name||employee.username,dueDate:paid<t.total?document.getElementById('multiDueDate').value:'',shiftId:shift.id,status:paid>=t.total?'Đã thanh toán':paid>0?'Còn nợ':'Còn nợ',items});
 items.forEach(x=>{ /* stock is already reduced below */ });
 createTherapyCardFromInvoice(invoice); addCashMovement({type:'thu',amount:paid,paymentMethod:document.getElementById('multiPay').value,subject:invoice.customerName||c.name,referenceId:invoice.id,note:'Thanh toán hóa đơn '+invoice.id});
 const multiRules=state.commissionRules||[];state.serviceCommissions=Array.isArray(state.serviceCommissions)?state.serviceCommissions:[];
 items.forEach(x=>{const product=state.products.find(p=>p.code===x.code);if(product?.type==='Gói dịch vụ, liệu trình')return;const rule=multiRules.find(r=>r.productCode===x.code),rate=Number(rule?.rate)||0;if(rate>0&&employee?.id){const revenue=Math.max(0,x.qty*x.price-x.discount);state.serviceCommissions.push({id:nextAutoCode('HH',6,'spa_next_commission_id',state.serviceCommissions,'id'),invoiceId:invoice.id,employeeId:employee.id,productCode:x.code,productName:x.name,revenue,rate,amount:revenue*rate/100,createdAt:new Date().toISOString(),status:'Đang ghi nhận'});}});
 closeModal();state.section='Đơn hàng';state.page='Hóa đơn';saveState();renderAll();alert(paid>=t.total?'Đã tạo hóa đơn và thanh toán thành công.':'Đã tạo hóa đơn, phần còn lại được ghi nhận là Còn nợ.');
}
function deleteProduct(code){
 if(!hasPermission('Xóa sản phẩm'))return alert('Bạn không có quyền xóa sản phẩm.');
 const p=state.products.find(x=>x.code===code);if(!p)return;

 if(used){p.status='Ngừng kinh doanh';saveState();productPage(document.getElementById('content'));return alert('Sản phẩm đã có giao dịch nên được chuyển sang Ngừng kinh doanh.');}
 if(confirm('Xóa sản phẩm '+p.name+'?')){state.products=state.products.filter(x=>x.code!==code);saveState();productPage(document.getElementById('content'));}

function openProduct(code){
 const editing=!!code;

 if(editing&&!p)return;
 const product=p||{code:nextAutoCode('SP',6,'spa_next_product_id',state.products,'code'),name:'',type:'Dịch vụ',group:'Mỹ phẩm',unit:'Cái',pre:0,vat:10,price:0,cost:0,stock:'---',status:'Đang kinh doanh'};
 document.getElementById('productGroup')&&(document.getElementById('productGroup').value=product.group||'Mỹ phẩm');
 openModal(editing?'Sửa hàng hóa':'Thêm hàng hóa',`
   <div class="form-grid">
    <div><label>Mã hàng hóa</label><input id="productCode" class="field" value="${escJs(product.code)}" readonly></div>
    <div><label>Nhóm hàng</label><select id="productGroup" class="field"><option value="Mỹ phẩm">Mỹ phẩm</option><option value="Dịch vụ">Dịch vụ</option><option value="Gói dịch vụ">Gói dịch vụ</option><option value="Khác">Khác</option></select></div><div><label>Đơn vị tính</label><select id="productUnit" class="field"><option>Chai</option><option>Hộp</option><option>Cái</option><option>Lần</option><option>Gói</option><option>Kg</option></select></div><div><label>Loại hàng</label><select id="productType" class="field"><option>Dịch vụ</option><option>Hàng hóa</option><option>Gói dịch vụ, liệu trình</option></select></div>
    <div class="full"><label>Tên hàng hóa</label><input id="productName" class="field" value="${esc(product.name)}"></div><div><label>Barcode</label><input id="productBarcode" class="field" value="${esc(product.barcode||"")}"></div>
    <div><label>VAT (%)</label><select id="productVat" class="field" onchange="calculateProductPreTax()"><option value="0">0</option><option value="5">5</option><option value="8">8</option><option value="10">10</option></select></div>
    <div><label>Giá bán sau thuế</label><input id="productPrice" class="field" type="number" min="0" step="0.001" value="${Number(product.price)||0}" oninput="calculateProductPreTax()"></div>
    <div><label>Giá bán trước thuế</label><input id="productPre" class="field" type="text" value="${formatProductPreTax(Number(product.price)||0)}" readonly></div>
    <div><label>Trạng thái</label><select id="productStatus" class="field"><option>Đang kinh doanh</option><option>Ngừng kinh doanh</option></select></div><div><label>Giá vốn</label><input id="productCost" class="field" type="number" min="0" step="0.001" value="${Number(product.cost)||0}"></div>
   </div>`,
   `<button class="btn btn-secondary" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveProduct('${escJs(product.code)}',${editing})">Lưu</button>`
 );
 const vatEl=document.getElementById('productVat'); if(vatEl) vatEl.value=String(Number(product.vat)||0);
 calculateProductPreTax();
}
function formatProductPreTax(price,vat){
 const value=Number(price)||0, rate=Number(vat)||0;
 return (value/(1+rate/100)).toFixed(3);
}
function calculateProductPreTax(){
 const price=Number(document.getElementById('productPrice')?.value)||0;
 const vat=Number(document.getElementById('productVat')?.value)||0;
 const pre=document.getElementById('productPre');
 if(pre) pre.value=formatProductPreTax(price,vat);
}
function saveProduct(code,editing){
  if(!hasPermission(editing?'Sửa sản phẩm':'Thêm sản phẩm')) return alert('Bạn không có quyền thực hiện thao tác này.');
 const name=document.getElementById('productName').value.trim();
 if(!name){alert('Vui lòng nhập tên hàng hóa.');return;}
 const rawPrice=document.getElementById('productPrice').value;
 if(rawPrice!==''&&Number(rawPrice)<0)return alert('Giá bán không được âm.');
 const rawCost=document.getElementById('productCost').value;
 if(rawCost!==''&&Number(rawCost)<0)return alert('Giá vốn không được âm.');
 const price=Number(rawPrice)||0;
 const data={
  name,
  barcode:(document.getElementById('productBarcode')?.value||'').trim(),
  type:document.getElementById('productType').value,
  pre:Number((price/(1+(Number(document.getElementById('productVat')?.value)||0)/100)).toFixed(3)),
  vat:Number(document.getElementById('productVat')?.value)||0,
  price,
  cost:Number(document.getElementById('productCost').value)||0,
  group:document.getElementById('productGroup').value,
  unit:document.getElementById('productUnit').value,
  status:document.getElementById('productStatus')?.value||'Đang kinh doanh'
 };
 if(editing){
  const p=state.products.find(x=>x.code===code);
  if(!p)return;
  Object.assign(p,data);
 }else{
  state.products.push({code,...data,stock:(data.type==='Dịch vụ'||data.type==='Gói dịch vụ, liệu trình')?'---':0});
 }
 saveState();
 closeModal();
 productPage(document.getElementById('content'));
}
